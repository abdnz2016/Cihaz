<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depo – Seval Kablo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#0f172a}
.top{background:linear-gradient(135deg,#713f12,#a16207);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:19px}.top a{color:#fff;font-size:13px;opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.kart{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:12px}
.tara{display:flex;gap:8px;flex-wrap:wrap}.tara input{flex:1;min-width:200px;padding:12px;border:2px solid #a16207;border-radius:10px;font-size:16px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer}
.b-ana{background:#a16207;color:#fff}.b-gri{background:#e2e8f0;color:#0f172a}.b-yes{background:#16a34a;color:#fff}.b-kir{background:#dc2626;color:#fff}.b-lac{background:#14305e;color:#fff}
.ozet{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.oz{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:13px}.oz b{font-size:18px}
.grup{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:10px;overflow:hidden}
.gb{padding:10px 14px;background:#fefce8;border-bottom:1px solid #e2e8f0;font-weight:800;display:flex;justify-content:space-between}.gb small{color:#64748b}
.sat{display:grid;grid-template-columns:110px 1fr 120px 110px;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.sat:hover{background:#fafafa}.sat .kod{font-weight:800;font-size:13px}.sat .ad{font-size:14px}.sat .ad small{display:block;color:#64748b;font-size:12px}
.stok{font-weight:800;text-align:right;font-size:15px}.stok.az{color:#dc2626}.stok.yok{color:#94a3b8}
.raf{font-size:12px;color:#64748b}
#pen{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
#pen .pk{background:#fff;border-radius:14px;max-width:600px;width:100%;overflow:hidden}#pen .ph{color:#fff;padding:13px 16px;font-weight:800;font-size:16px;background:linear-gradient(135deg,#713f12,#a16207)}
#pen .pb{padding:14px 16px}label{display:block;font-size:13px;font-weight:700;color:#334155;margin:10px 0 4px}
input,select,textarea{width:100%;font:15px Arial;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.iki{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{font-size:13px;margin-top:8px}.msg.err{color:#b91c1c}.msg.ok{color:#047857}
.hk{font-size:12.5px;padding:6px 0;border-bottom:1px solid #f1f5f9}.hk b.g{color:#047857}.hk b.c{color:#b91c1c}
#kamera{width:100%;max-height:60vh;background:#000;border-radius:10px}
@media(max-width:600px){.sat{grid-template-columns:1fr 90px}.sat .kod,.sat .raf{display:none}.iki{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#etiketler,#etiketler *{visibility:visible}#etiketler{position:absolute;left:0;top:0}}
#etiketler{display:none}
</style></head><body>
<div class="top"><b>📦 Depo</b><a href="index.html">Kontrol merkezi</a></div>
<div class="wrap" id="app"><div class="kart">Yükleniyor…</div></div>
<div id="etiketler"></div>
<script>
const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A", SERVIS_URL = "https://script.google.com/macros/s/AKfycbxFXTZEYyDTH9SscQygnRiW9HOIx1c4v3tgdGLjId9tXpJ5G0byl_LhaCXeEPDuzH-c/exec";
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim(), anah = s => String(s ?? "").trim().replace(/\s+/g, "").toLocaleUpperCase("tr");
const KAT = ["Yağ", "Gres", "Rulman", "Kayış", "Zincir", "Sürücü", "Kontaktör", "Sigorta", "Röle / termik", "PLC / kart", "Sensör", "Rezistans", "Termokupl", "Filtre", "Kablo / klemens", "Pnömatik", "Diğer"];
let MAL = [], HAR = [], HEDEF = [], MAKH = [];
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label));
  return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", n = c => { const x = Number(String(c ? c.v ?? "" : "").replace(",", ".")); return isNaN(x) ? 0 : x; };
const tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0)) : null; };
const say = x => String(Math.round(x * 1000) / 1000).replace(".", ",");
async function servis(o){ const r = await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(o) }); return r.json(); }
async function yukle(){
  let M, H, MK, C;
  try{ [M, H, MK, C] = await Promise.all([sekme("Depo_Malzemeler"), sekme("Depo_Hareketler"), sekme("Makinalar").catch(() => []), sekme("Cihazlar").catch(() => [])]); }
  catch(e){ $("#app").innerHTML = `<div class="kart">Veriler alınamadı: ${esc(e.message)}</div>`; return; }
  MAL = M.map(r => ({ kod:v(r["malzeme kodu"]), barkod:v(r["barkod"]), ad:v(r["malzeme adı"]), kat:v(r["kategori"]) || "Diğer", marka:v(r["marka"]), model:v(r["model / ölçü"]), birim:v(r["birim"]) || "adet",
    stok:n(r["stok"]), min:n(r["min stok"]), raf:v(r["raf / konum"]), bagli:v(r["bağlı makine / cihaz"]), not:v(r["not"]) })).filter(x => x.kod);
  HAR = H.map(r => ({ t:tar(r["tarih"]), tur:v(r["hareket"]), kod:v(r["malzeme kodu"]), miktar:n(r["miktar"]), yeni:n(r["yeni stok"]), hedef:v(r["makine / cihaz"]), ariza:v(r["arıza no"]), kim:v(r["kişi"]) })).filter(x => x.kod);
  MAKH = MK.map(r => ({ kod:v(r["makine kodu"]), hat:v(r["hat / bölüm"]) || "Diğer" })).filter(x => x.kod);
  HEDEF = MAKH.map(x => x.kod).concat(C.map(r => v(r["kayıt no"])).filter(Boolean));
  ciz();
}
function ciz(){
  const az = MAL.filter(x => x.min && x.stok <= x.min).length, yok = MAL.filter(x => x.stok <= 0).length;
  $("#app").innerHTML = `<div class="kart"><div class="tara"><input id="bk" placeholder="Barkod okutun ya da yazın (USB okuyucu da olur), ad / kod arayın…" autofocus>
      <button class="btn b-ana" id="kam">📷 Kamera ile okut</button><button class="btn b-lac" id="yeni">+ Yeni malzeme</button><button class="btn b-gri" id="etk">🏷 İç kodlu etiketleri bas</button></div>
    <div class="ozet"><div class="oz"><b>${MAL.length}</b> malzeme</div><div class="oz" style="color:#b91c1c"><b>${az}</b> minimum stokta</div><div class="oz"><b>${yok}</b> stokta yok</div><div class="oz"><b>${HAR.length}</b> hareket</div></div></div><div id="liste"></div>`;
  const bk = $("#bk");
  bk.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); barkodIsle(bk.value.trim()); } });
  bk.oninput = () => listele(bk.value);
  $("#kam").onclick = kameraAc; $("#yeni").onclick = () => malzemeForm(""); $("#etk").onclick = () => etiketBas(MAL.filter(x => /^DP-/i.test(x.barkod)));
  listele("");
}
function listele(q){
  q = norm(q); const L = MAL.filter(x => !q || norm([x.kod, x.barkod, x.ad, x.kat, x.marka, x.model, x.raf, x.bagli].join(" ")).includes(q)), g = {};
  L.forEach(x => (g[x.kat] = g[x.kat] || []).push(x));
  $("#liste").innerHTML = Object.keys(g).sort((a, b) => a.localeCompare(b, "tr")).map(k => `<div class="grup"><div class="gb"><span>${esc(k)}</span><small>${g[k].length} malzeme</small></div>
    ${g[k].sort((a, b) => a.ad.localeCompare(b.ad, "tr")).map(x => `<div class="sat" data-kod="${esc(x.kod)}"><span class="kod">${esc(x.kod)}</span><span class="ad">${esc(x.ad)}<small>${esc([x.marka, x.model].filter(Boolean).join(" · "))}${x.bagli ? " · 🔗 " + esc(x.bagli) : ""}</small></span>
      <span class="raf">${esc(x.raf || "")}</span><span class="stok ${x.stok <= 0 ? "yok" : (x.min && x.stok <= x.min ? "az" : "")}">${say(x.stok)} ${esc(x.birim)}${x.min && x.stok <= x.min ? " ⚠" : ""}</span></div>`).join("")}</div>`).join("") || `<div class="kart">${MAL.length ? "Aramaya uyan malzeme yok." : "Depo boş. Barkod okutun ya da “+ Yeni malzeme” ile ekleyin."}</div>`;
  document.querySelectorAll(".sat").forEach(s => s.onclick = () => malzemeKart(MAL.find(x => x.kod === s.dataset.kod)));
}
function barkodIsle(b){ if(!b) return; const x = MAL.find(m => anah(m.barkod) === anah(b) || anah(m.kod) === anah(b)); if(x) malzemeKart(x); else if(confirm(`"${b}" kayıtlı değil. Yeni malzeme olarak eklensin mi?`)) malzemeForm(b); }
function pencere(baslik, ic, renk){ const p = document.createElement("div"); p.id = "pen"; p.innerHTML = `<div class="pk"><div class="ph" ${renk ? `style="background:${renk}"` : ""}>${baslik}</div><div class="pb">${ic}</div></div>`; p.onclick = e => { if(e.target === p) kapat(p); }; document.body.appendChild(p); return p; }
function kapat(p){ if(window.AKIS){ AKIS.getTracks().forEach(t => t.stop()); window.AKIS = null; } if(window.H5){ try{ H5.stop(); }catch(e){} window.H5 = null; } p.remove(); }
async function gonder(p, o){ const m = p.querySelector(".msg"); let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return null; }
  m.className = "msg"; m.textContent = "Kaydediliyor…";
  try{ const j = await servis(Object.assign({ islem:"depo", pin }, o));
    if(j.ok){ localStorage.setItem("kayitPin", pin); if(o.kim) localStorage.setItem("arzAd", o.kim); m.className = "msg ok"; m.textContent = "✓ " + j.mesaj; return j; }
    if(/PIN/.test(j.hata || "")) localStorage.removeItem("kayitPin"); m.className = "msg err"; m.textContent = "⚠ " + j.hata; }
  catch(e){ m.className = "msg err"; m.textContent = "⚠ Servise ulaşılamadı: " + e.message; } return null; }
// çoklu seçim: makine / cihaz etiketleri + hat bazında toplu ekleme
function coklu(kap, baslangic){
  const S = new Set(String(baslangic || "").split(/\s*[,;]\s*/).filter(Boolean)), hatlar = {};
  MAKH.forEach(x => (hatlar[x.hat] = hatlar[x.hat] || []).push(x.kod));
  kap.innerHTML = `<div class="ms-et" style="display:flex;flex-wrap:wrap;gap:5px;min-height:34px;padding:6px;border:1px solid #cbd5e1;border-radius:9px;background:#fff"></div>
    <div style="display:flex;gap:6px;margin-top:6px"><input class="ms-in" list="dl_ms" placeholder="Kod yazın / seçin: UR-EK03, KK-23…" style="flex:1"><button type="button" class="btn b-gri ms-ek" style="padding:8px 12px">Ekle</button></div>
    <datalist id="dl_ms">${HEDEF.map(h => `<option value="${esc(h)}">`).join("")}</datalist>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">${Object.keys(hatlar).sort((a, b) => a.localeCompare(b, "tr")).map(h => `<button type="button" class="btn b-gri ms-hat" data-h="${esc(h)}" style="padding:5px 9px;font-size:12px">+ ${esc(h)} (${hatlar[h].length})</button>`).join("")}
      ${S.size ? "" : ""}<button type="button" class="btn b-gri ms-sil" style="padding:5px 9px;font-size:12px">Temizle</button></div>`;
  const et = kap.querySelector(".ms-et"), inp = kap.querySelector(".ms-in");
  const ciz = () => { et.innerHTML = [...S].map(k => `<span style="background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:700">${esc(k)} <a href="#" data-x="${esc(k)}" style="color:#92400e;text-decoration:none">✕</a></span>`).join("") || '<span style="color:#94a3b8;font-size:13px">Bağlı makine / cihaz yok</span>';
    et.querySelectorAll("[data-x]").forEach(a => a.onclick = e => { e.preventDefault(); S.delete(a.dataset.x); ciz(); }); };
  const ekle = () => { inp.value.split(/\s*[,;]\s*/).map(x => x.trim().toUpperCase()).filter(Boolean).forEach(x => S.add(x)); inp.value = ""; ciz(); };
  kap.querySelector(".ms-ek").onclick = ekle; inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); ekle(); } }); inp.addEventListener("change", () => { if(HEDEF.includes(inp.value.trim())) ekle(); });
  kap.querySelectorAll(".ms-hat").forEach(b => b.onclick = () => { hatlar[b.dataset.h].forEach(k => S.add(k)); ciz(); });
  kap.querySelector(".ms-sil").onclick = () => { S.clear(); ciz(); };
  ciz(); return () => [...S].join(", ");
}
function malzemeForm(barkod){
  const p = pencere("+ Yeni malzeme", `<label>Barkod (üretici barkodu; boş bırakırsanız sistem iç kod verir)<input id="m_bk" value="${esc(barkod)}"></label>
    <label>Malzeme adı<input id="m_ad" placeholder="Hidrolik yağ ISO VG 46 / Rulman 6205-2RS / Kontaktör 25A…"></label>
    <div class="iki"><label>Kategori<select id="m_kat">${KAT.map(k => `<option>${k}</option>`).join("")}</select></label><label>Birim<select id="m_bir"><option>adet</option><option>L</option><option>kg</option><option>m</option><option>paket</option></select></label></div>
    <div class="iki"><label>Marka<input id="m_ma"></label><label>Model / ölçü<input id="m_mo"></label></div>
    <div class="iki"><label>Başlangıç stoku<input id="m_st" inputmode="decimal" value="0"></label><label>Minimum stok<input id="m_min" inputmode="decimal" value="0"></label></div>
    <label>Raf / konum<input id="m_raf" placeholder="A-03"></label>
    <div class="msg" style="margin-top:6px">ℹ️ Makine bağlantısı kendiliğinden kurulur: bir makine için giriş / çıkış yapılınca ya da makinenin parça listesine eklenince.</div>
    <p style="display:flex;gap:8px"><button class="btn b-ana" id="m_ok">Kaydet (PIN)</button><button class="btn b-gri" id="m_ip">Vazgeç</button></p><div class="msg"></div>`);
  p.querySelector("#m_ip").onclick = () => kapat(p);
  p.querySelector("#m_ok").onclick = async () => { const q = s => p.querySelector(s).value.trim();
    if(!q("#m_ad")){ const m = p.querySelector(".msg"); m.className = "msg err"; m.textContent = "Malzeme adını yazın."; return; }
    const j = await gonder(p, { eylem:"ekle", barkod:q("#m_bk"), ad:q("#m_ad"), kategori:q("#m_kat"), birim:q("#m_bir"), marka:q("#m_ma"), model:q("#m_mo"), stok:q("#m_st"), min:q("#m_min"), raf:q("#m_raf"), bagli:"", kim:localStorage.getItem("arzAd") || "" });
    if(j){ if(!q("#m_bk") && confirm("İç barkod verildi: " + j.barkod + "\nEtiketi şimdi basılsın mı?")) etiketBas([{ kod:j.kod, barkod:j.barkod, ad:q("#m_ad"), raf:q("#m_raf"), marka:q("#m_ma"), model:q("#m_mo") }]); setTimeout(() => { kapat(p); yukle(); }, 900); } };
}
function malzemeKart(x){
  const H = HAR.filter(h => h.kod === x.kod).sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 15);
  const p = pencere(`📦 ${esc(x.kod)} · ${esc(x.ad)}`, `<div class="iki"><div><small style="color:#64748b">Stok</small><div style="font-size:26px;font-weight:800;color:${x.stok <= 0 || (x.min && x.stok <= x.min) ? "#dc2626" : "#047857"}">${say(x.stok)} ${esc(x.birim)}</div>${x.min ? `<small>minimum ${say(x.min)}</small>` : ""}</div>
      <div style="font-size:13px;line-height:1.6">Barkod: <b>${esc(x.barkod)}</b><br>${esc([x.kat, x.marka, x.model].filter(Boolean).join(" · "))}<br>${x.raf ? "Raf: " + esc(x.raf) + "<br>" : ""}${x.bagli ? "🔗 " + esc(x.bagli) : ""}</div></div>
    <div class="iki" style="margin-top:6px"><label>Miktar<input id="h_m" inputmode="decimal" value="1"></label><label>Adınız<input id="h_k" value="${esc(localStorage.getItem("arzAd") || "")}"></label></div>
    <div class="iki"><label>Makine / cihaz (çıkışta)<input id="h_h" list="dl_h2" placeholder="UR-EK03"></label><label>Arıza no (varsa)<input id="h_a" placeholder="AR-2026-0001"></label></div>
    <datalist id="dl_h2">${HEDEF.map(h => `<option value="${esc(h)}">`).join("")}</datalist><label>Not<input id="h_n"></label>
    <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn b-yes" data-e="giris">⬇ Giriş</button><button class="btn b-kir" data-e="cikis">⬆ Çıkış</button><button class="btn b-gri" data-e="sayim">🔢 Sayım (miktar = sayılan)</button><button class="btn b-lac" id="h_et">🏷 Etiket</button><button class="btn b-gri" id="h_duz">✏️ Düzenle</button></p><div class="msg"></div>
    <div style="margin-top:10px;font-weight:800;font-size:12px;color:#713f12">SON HAREKETLER</div>${H.map(h => `<div class="hk">${h.t ? h.t.toLocaleString("tr-TR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }) : ""} · <b class="${/Giriş/.test(h.tur) ? "g" : /Çıkış/.test(h.tur) ? "c" : ""}">${esc(h.tur)} ${say(Math.abs(h.miktar))}</b> → ${say(h.yeni)} ${h.hedef ? "· " + esc(h.hedef) : ""}${h.ariza ? " · " + esc(h.ariza) : ""} · ${esc(h.kim)}</div>`).join("") || '<div class="hk">Hareket yok.</div>'}`);
  p.querySelector("#h_et").onclick = () => etiketBas([x]);
  p.querySelector("#h_duz").onclick = () => { kapat(p); duzenleForm(x); };
  p.querySelectorAll("[data-e]").forEach(b => b.onclick = async () => { const q = s => p.querySelector(s).value.trim();
    const j = await gonder(p, { eylem:b.dataset.e, kod:x.kod, miktar:q("#h_m").replace(",", "."), kim:q("#h_k"), hedef:q("#h_h"), arizaNo:q("#h_a"), not:q("#h_n") });
    if(j) setTimeout(() => { kapat(p); yukle().then(() => { const y = MAL.find(m => m.kod === x.kod); if(y) malzemeKart(y); }); }, 900); });
}
function duzenleForm(x){
  const p = pencere(`✏️ ${esc(x.kod)} düzenle`, `<label>Malzeme adı<input id="d_ad" value="${esc(x.ad)}"></label>
    <div class="iki"><label>Kategori<select id="d_kat">${KAT.concat(KAT.includes(x.kat) ? [] : [x.kat]).map(k => `<option ${k === x.kat ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label><label>Birim<input id="d_bir" value="${esc(x.birim)}"></label></div>
    <div class="iki"><label>Marka<input id="d_ma" value="${esc(x.marka)}"></label><label>Model / ölçü<input id="d_mo" value="${esc(x.model)}"></label></div>
    <div class="iki"><label>Minimum stok<input id="d_min" inputmode="decimal" value="${esc(say(x.min))}"></label><label>Raf / konum<input id="d_raf" value="${esc(x.raf)}"></label></div>
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:#334155">Bağlı makineler / cihazlar (isteğe bağlı düzeltme)</summary><div id="d_bag" style="margin-top:6px"></div></details><label>Not<input id="d_not" value="${esc(x.not)}"></label>
    <p style="display:flex;gap:8px"><button class="btn b-ana" id="d_ok">Kaydet (PIN)</button><button class="btn b-gri" id="d_ip">Vazgeç</button></p><div class="msg"></div>`);
  const bagli = coklu(p.querySelector("#d_bag"), x.bagli); p.querySelector("#d_ip").onclick = () => kapat(p);
  p.querySelector("#d_ok").onclick = async () => { const q = s => p.querySelector(s).value.trim();
    const j = await gonder(p, { eylem:"guncelle", kod:x.kod, ad:q("#d_ad"), kategori:q("#d_kat"), birim:q("#d_bir"), marka:q("#d_ma"), model:q("#d_mo"), min:q("#d_min").replace(",", "."), raf:q("#d_raf"), bagli:bagli(), not:q("#d_not") });
    if(j) setTimeout(() => { kapat(p); yukle(); }, 900); };
}
async function kameraAc(){

  const e = $("#etiketler"); e.style.display = "block";

    L.map((x, i) => `<div class="et"><b>${esc(x.ad)}</b><svg id="bc${i}"></svg><small>${esc(x.kod)}${x.raf ? " · Raf " + esc(x.raf) : ""}${x.marka ? " · " + esc(x.marka) : ""}</small></div>`).join("");

}
