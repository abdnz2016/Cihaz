<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Doğrulama</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#111;font-size:15px}
.top{background:#14305e;color:#fff;padding:14px;font-size:18px;font-weight:bold}
.top span{font-weight:normal;font-size:13px;opacity:.85;margin-left:6px}
#msg{padding:16px;text-align:center;color:#666}
.wrap{max-width:900px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin:0 0 8px;font-size:14px;color:#14305e;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{display:flex;flex-direction:column;font-size:12px;color:#555;gap:3px}
.grid input,.grid select{font:15px Arial;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}
.grid input[readonly]{background:#f3f4f6;color:#333}
.ref{display:flex;gap:8px;align-items:flex-start;border:1px solid #e1e5ea;border-radius:10px;padding:8px;margin:6px 0}
.ref input[type=checkbox]{width:22px;height:22px;margin-top:2px}
.ref .i{flex:1;font-size:13px;line-height:1.35}
.ref .i b{font-size:14px}
.ref .u{display:flex;gap:6px;margin-top:5px;align-items:center;font-size:12px;color:#555}
.ref .u input{width:80px;font:14px Arial;padding:6px;border:1px solid #bbb;border-radius:6px}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{background:#14305e;color:#fff;padding:6px 3px;font-size:11px}
table.pt td{border-bottom:1px solid #e5e8ec;padding:4px 2px;text-align:center}
table.pt input{width:100%;min-width:52px;font:14px Arial;padding:7px 3px;border:1px solid #bbb;border-radius:6px;text-align:center}
.ok{color:#0a7d32;font-weight:bold}.bad{color:#c4161c;font-weight:bold}
.btn{display:inline-block;border:0;border-radius:9px;padding:12px 16px;font-weight:bold;font-size:15px;background:#e31e24;color:#fff;margin:4px 4px 0 0;text-decoration:none}
.btn.g{background:#14305e}.btn.w{background:#6b7280}
.sum{font-size:16px;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
.sum.ok{background:#e6f6ec}.sum.bad{background:#fdeaea}
.small{font-size:12px;color:#666;line-height:1.4}
.docbtn{display:block;background:#14305e;color:#fff;text-decoration:none;padding:13px;border-radius:10px;text-align:center;font-weight:bold;margin-top:8px}
/* ---------- A4 form ---------- */
#sheet{background:#fff;width:190mm;max-width:100%;margin:12px auto;border:.3mm solid #111;font-size:3.1mm;color:#000}
#sheet table{width:100%;border-collapse:collapse}
#sheet td,#sheet th{border:.3mm solid #111;padding:1mm 1.6mm;vertical-align:middle}
#sheet .hd td{height:18mm;text-align:center}
#sheet .hd img{height:8.5mm;max-width:100%}
#sheet .hd .t{font-weight:bold;font-size:4.4mm}
#sheet .sec{background:#e9edf3;font-weight:bold;font-size:3mm}
#sheet .k{font-weight:bold;width:17%}
#sheet th{font-size:2.8mm;background:#f2f2f2}
#sheet td.c{text-align:center}
#sheet .sign{border:0;text-align:right;padding:6mm 4mm 2mm;font-size:3mm;line-height:1.3}
#sheet .sign td{border:0}
#sheet .fc{font-size:2.2mm;padding:1mm 2mm;color:#333}
.hint{font-size:12px;color:#666;margin:6px 10px}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .top,#msg,#app,#hint{display:none!important}
  html,body{height:auto;margin:0;padding:0}
  #sheet,#sheet *{visibility:visible}
  #sheet{position:static;margin:0 auto;width:auto;max-width:194mm;border:.3mm solid #111}
  @page{size:A4;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
  #kaydetBar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccd;box-shadow:0 -2px 8px rgba(0,0,0,.12);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:50}
  #kaydetBar[hidden]{display:none}
  #kaydetBtn{background:#0a7d32;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
  #kaydetBtn:disabled{opacity:.6}
  #kaydetMsg{font-size:13px;color:#223}
  body{padding-bottom:78px}
@media print{ #kaydetBar{display:none!important} body{padding-bottom:0} }
  #kilit{position:fixed;inset:0;background:#eef1f6;z-index:200;display:flex;align-items:center;justify-content:center}
  #kilit .kb{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);width:min(330px,90vw);font:15px system-ui,Arial,sans-serif}
  #kilit input{width:100%;box-sizing:border-box;padding:11px;margin:10px 0;border:1px solid #c5ccd9;border-radius:8px;font-size:16px}
  #kilit button{width:100%;padding:11px;border:0;border-radius:8px;background:#16315c;color:#fff;font-size:16px;font-weight:600}
  #kilitMsg{color:#b00020;font-size:13px;margin-top:8px;min-height:16px}
@media print{ #kilit{display:none!important} }
</style>

function kabulFor(){

}
const ceilTo = (x,step) => Math.ceil(x/step - 1e-9) * step;

function compute(){
  const n3 = ST.tekrar ? 3 : 1, res = pf(ST.res) || CAT.res, tol = pf(ST.tol);
  // referans belirsizliği: seçili referansların en büyüğü (µm → mm)
  let uRef = 0, refTxt = [];
  CAT.refs.forEach(r => { const s = ST.refs[r]; if(!s.on) return; const U = pf(s.U), k = pf(s.k) || 2;
    if(!isNaN(U) && U > 0){ const u = (U/(CAT.refDiv||1000))/k; if(u > uRef) uRef = u; } });
  const uRes = res / (2*Math.sqrt(3));
  const uRefFor = nom => { let m = 0; CAT.refs.forEach(r => { const s = ST.refs[r]; if(!s.on) return; const U = pf(s.U), k = pf(s.k) || 2; if(isNaN(U) || U <= 0) return;
      const u = (((REFU[r]||{}).pct) ? (U/100*Math.abs(nom)) : U/(CAT.refDiv||1000))/k; if(u > m) m = u; }); return m; };
  return ST.deg.map((_,i) => {
    const nom = CAT.serbest ? pf(ST.nom[i]) : CAT.noktalar[i];
    if(isNaN(nom)) return { nom, ok:null };
    const uRef = uRefFor(nom);
    if(CAT.skala){ const rd = pf(ST.deg[i][0]), kk = pf(ST.k); if(isNaN(rd) || isNaN(kk)) return { nom, ok:null };
      const mean = rd*kk, hata = rnd(mean - nom, CAT.dec), uc = Math.sqrt(uRef*uRef + uRes*uRes), U = 2*uc, Ur = Math.max(ceilTo(U, CAT.ceilStep || res), CAT.minU || 0);
      return { nom, mean, hata, U, Ur, ok: isNaN(tol) ? null : Math.abs(hata) <= tol + 1e-9, n:1 }; }
    const vals = CAT.coklu ? String(ST.deg[i][0]||"").split(/[\s;]+/).filter(Boolean).map(pf).filter(v => !isNaN(v)) : ST.deg[i].slice(0,n3).map(pf).filter(v => !isNaN(v));
    if(!vals.length) return { nom, ok:null };
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    let uRep = 0;
    if(vals.length > 1){ const s = Math.sqrt(vals.reduce((a,v)=>a+(v-mean)*(v-mean),0)/(vals.length-1)); uRep = CAT.uPos === "s" ? s : s/Math.sqrt(vals.length); }
    const hata = CAT.sapmaTip === "maks" ? rnd(Math.max(...vals.map(v => Math.abs(v - nom))), CAT.dec) : rnd(mean - nom, CAT.dec);
    const uc = Math.sqrt(uRef*uRef + uRes*uRes + uRep*uRep);
    const U = 2*uc, Ur = Math.max(ceilTo(U, CAT.ceilStep || res), CAT.minU || 0);
    const hataPct = nom ? rnd(hata/nom*100, 1) : NaN;
    const ok = isNaN(tol) ? null : (CAT.tolAs ? (hataPct >= -1e-9 && hataPct <= tol + 1e-9) : CAT.tolPct ? Math.abs(hata)/Math.abs(nom)*100 <= tol + 1e-9 : Math.abs(hata) <= tol + 1e-9);
    return { nom, mean, hata, hataPct, U, Ur, ok, n:vals.length, uRef, uRes, uRep };
  });
}

function bind(){
  $("#app").addEventListener("input", e => {
    const t = e.target;
    if(t.dataset.f){ const f = t.dataset.f; ST[f] = f === "tekrar" ? t.value === "1" : t.value; if(f==="tekrar") { render(); return; } }
    else if(t.dataset.p !== undefined){ ST.deg[+t.dataset.p][+t.dataset.j] = t.value; }
    else if(t.dataset.n !== undefined){ ST.nom[+t.dataset.n] = t.value; }
    else if(t.dataset.u){ ST.refs[t.dataset.u].U = t.value; }
    else if(t.dataset.k){ ST.refs[t.dataset.k].k = t.value; }
    else if(t.dataset.fn){ ST.fn[t.dataset.fn] = t.value; }
    else if(t.dataset.ref){ ST.refs[t.dataset.ref].on = t.checked; }
    const rows = compute(); updateRows(rows); renderSum(rows); renderSheet(rows);
  });
  $("#app").addEventListener("click", e => { if(e.target.dataset.add){ ST.nom.push(""); ST.deg.push(["","",""]); render(); } });
  $("#app").addEventListener("change", e => { if(e.target.dataset.ref || e.target.dataset.f === "tarih" || e.target.dataset.f === "tekrar"){ if(e.target.dataset.ref) ST.refs[e.target.dataset.ref].on = e.target.checked; if(e.target.dataset.f==="tarih"){ ST.tarih = e.target.value; } render(); } });
}
function updateRows(rows){
  const trs = document.querySelectorAll("table.pt tr");
  rows.forEach((r,i) => { const tr = trs[i+1]; if(!tr) return; const tds = tr.querySelectorAll("td"); const n = tds.length;
    if(CAT.coklu || CAT.skala) tds[n-4].textContent = r.ok===null ? "" : nf(r.mean, CAT.dec);
    tds[n-3].textContent = r.ok===null ? "" : hTxt(r);
    tds[n-2].textContent = r.ok===null ? "" : nf(r.Ur, CAT.dec);
    tds[n-1].textContent = r.ok===null ? "" : (r.ok ? "✓" : "✗"); tds[n-1].className = r.ok ? "ok" : "bad"; });

    : buk ? { tip:"buk", kod:"F7.10-25", birim:"m/s", mesB:"m", dec:3, tarih:isoD(new Date()), tol:"10", yer:DEV.yer, refs:["KR-132","KK-131"],
      grp:[{ nom:"0.33", s:[1,1,1,1,1].map(m => ({mes:String(m), sn:""})) }] }
    : { tip:"uzama", kod:"F7.10-11", birim:"mm/dk", mesB:"mm", dec:2, tarih:isoD(new Date()), tol:"5", yer:DEV.yer, refs:["KK-113","KR-132"],
      grp:[{ nom:"20", s:[10,20,30,40,50].map(m => ({mes:String(m), sn:""})) }] };
  hzRender(); hzBind();
}
function hzRow(r){ const m = pf(r.mes), s = pf(r.sn); if(isNaN(m) || isNaN(s) || s <= 0) return null; return HZ.tip === "buk" ? m/s : m/(s/60); }
function hzGrp(g){ const v = g.s.map(hzRow).filter(x => x !== null), nom = pf(g.nom), tol = pf(HZ.tol);
  if(!v.length || isNaN(nom)) return {ok:null}; const mean = v.reduce((a,b)=>a+b,0)/v.length; let sap = mean - nom; if(HZ.tip === "cekme") sap = Math.max(...v.map(x => Math.abs(x - nom))); const pct = sap/nom*100;
  return {mean, sap, pct, n:v.length, ok: isNaN(tol) ? null : Math.abs(pct) <= tol + 1e-9}; }

function ycHes(r){ const N = pf(r.n), y = pf(r.yuk), g = pf(HZ.g), tol = pf(HZ.tol); if(isNaN(N) || isNaN(y) || isNaN(g) || y <= 0) return null;

function exYeni(mk){
  const pl = mk.startsWith("PL");
  EX.makine = mk;
  EX.bolum = pl ? [{ad:"", satir:EX_PL.map(([a,g]) => ({ad:a, gos:String(g), oku:""}))}]
                : [{ad:"ANA EXTRUDER", satir:EX_ANA.map(g => ({ad:"", gos:String(g), oku:""}))},
                   {ad:"RENK EXTRUDER", satir:EX_RENK.map(g => ({ad:"", gos:String(g), oku:""}))}];

function exHesap(s){
  const gos = pf(s.gos), res = pf(EX.res) || 0.1, tol = pf(EX.tol);
  const v = String(s.oku||"").split(/[\s;]+/).filter(Boolean).map(pf).filter(x => !isNaN(x));
  if(isNaN(gos) || !v.length) return { ok:null };
  const mean = v.reduce((a,b)=>a+b,0)/v.length;
  const sapma = Math.max(...v.map(x => Math.abs(x - gos)));
  let uRep = 0; if(v.length > 1){ const sd = Math.sqrt(v.reduce((a,x)=>a+(x-mean)*(x-mean),0)/(v.length-1)); uRep = sd/Math.sqrt(v.length); }

  const U = 2*Math.sqrt(uRef*uRef + uRes*uRes + uRep*uRep), Ur = ceilTo(U, CAT.ceilStep || res);
  return { ok: isNaN(tol) ? null : sapma <= tol + 1e-9, mean, sapma: rnd(sapma,1), Ur, n:v.length };
}

    $("#app").innerHTML = `<div class="card"><h3>KATEGORİLER</h3>${kart}${kartEx}</div><div class="card"><h3>DİĞER CİHAZLAR</h3><div class="small">Özel kartı olmayan her cihaz (komparatör, çekme kopma, vb.) için kumpas ile aynı formatta <b>genel doğrulama kartı</b> açılır: referans değeri, okumalar, sapma, belirsizlik ve kabul sınırını siz girersiniz.</div></div>`;
    return;
  }
  $("#kod").textContent = id;
  try{
    ALL = await loadSheet(); DEV = ALL[id];
    if(!DEV){ $("#msg").textContent = id + " Sheet'te bulunamadı."; return; }
    if(!DEV.dogT){ $("#msg").textContent = DEV.id + " · " + DEV.ad + ": Sheet'te Doğrulama Tarihi yok, bu cihaz için doğrulama formu düzenlenmez (yalnızca kalibrasyon)."; return; }
    CAT = Object.values(CATS).find(c => c.match.test(norm(DEV.ad + " " + DEV.model)));
    $("#msg").hidden = true; $("#app").hidden = false;
    if(!CAT) CAT = genelCat();
    if(CAT.asTip){ asInit(); return; }
    if(CAT.hizTip){ hzInit(); return; }
    if(CAT.rtip){ resInit(); return; }
    if(CAT.profilTip){ profilInit(); return; }
    initState(); if(CAT.genel && kabulFor()) ST.birim = kabulFor().birim; if(CAT.spark) sparkInit(); render(); bind();
  }catch(e){ $("#msg").hidden = false; $("#msg").textContent = "Hata: " + e.message; }
})();


/* ===================== FORMU DRIVE'A KAYDET (PIN'li, klasör sabit) ===================== */
const KAYIT_URL = "https://script.google.com/macros/s/AKfycbxFXTZEYyDTH9SscQygnRiW9HOIx1c4v3tgdGLjId9tXpJ5G0byl_LhaCXeEPDuzH-c/exec";   // Apps Script web uygulaması adresi. Hatalıysa bir sonraki basışta yeni adres sorulur.
(function(){
  const bar = document.getElementById("kaydetBar"), btn = document.getElementById("kaydetBtn"), msg = document.getElementById("kaydetMsg"), sheet = document.getElementById("sheet");
  new MutationObserver(() => { bar.hidden = sheet.hidden; }).observe(sheet, { attributes:true, attributeFilter:["hidden"] });
  btn.addEventListener("click", async () => {
    let url = (localStorage.getItem("kayitUrl") || KAYIT_URL || "").trim();
    if(!url || localStorage.getItem("kayitUrlSor")){ url = (prompt("Kayıt servisi adresini yapıştırın (…/exec):", url) || "").trim(); if(!url) return; localStorage.setItem("kayitUrl", url); localStorage.removeItem("kayitUrlSor"); }
    let pin = localStorage.getItem("kayitPin") || "";
    if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return; }
    if(typeof html2canvas === "undefined" || !window.jspdf){ msg.textContent = "⚠ PDF kütüphanesi yüklenemedi (internet bağlantısını kontrol edin)."; return; }
    const tEl = document.querySelector('#app input[type="date"]'), tarih = tEl && tEl.value ? tEl.value : isoD(new Date());
    const ad = `${String(DEV.id).replace(/\//g,"-")}_${slug(DEV.ad)}_Dogrulama_${tarih}.pdf`;
    btn.disabled = true; msg.textContent = "PDF hazırlanıyor…";
    const kaydirma = window.scrollY, kap = document.createElement("div"), klon = sheet.cloneNode(true);
    try{
      window.scrollTo(0, 0);
      // formun tam boy kopyası: ekranın dışında değil, sayfanın en üstünde, A4 genişliğinde (190 mm ≈ 718 px); orijinal geçici olarak yeniden adlandırılır
      kap.style.cssText = "position:absolute;left:0;top:0;width:718px;background:#fff;z-index:-1;pointer-events:none";
      sheet.id = "sheet_orj"; klon.id = "sheet"; klon.hidden = false;
      klon.style.cssText = "width:718px;max-width:none;margin:0;position:static";
      kap.appendChild(klon); document.body.appendChild(kap);
      await new Promise(r => setTimeout(r, 60));
      const g = klon.scrollWidth, y = klon.scrollHeight;
      const canvas = await html2canvas(klon, { scale:2, backgroundColor:"#ffffff", useCORS:true, x:0, y:0, scrollX:0, scrollY:0, width:g, height:y, windowWidth:1024, windowHeight:Math.max(y + 200, 1400) });
      const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait" });
      const kenar = 8, sg = 210 - 2*kenar, sy = 297 - 2*kenar;           // tek A4 sayfaya tam sığdır (kesilme olmaz)
      let w = sg, h = canvas.height * sg / canvas.width;
      if(h > sy){ h = sy; w = canvas.width * sy / canvas.height; }
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", (210 - w) / 2, kenar, w, h);
      const blob = pdf.output("blob");
      kap.remove(); sheet.id = "sheet"; window.scrollTo(0, kaydirma);
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
      msg.textContent = "Drive'a gönderiliyor…";
      const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ pin:pin, id:DEV.id, ad:ad, tarih:tarih, pdf:b64 }) });
      const j = await r.json();
      if(j.ok){ localStorage.setItem("kayitPin", pin); msg.innerHTML = "✅ Kaydedildi: <a target='_blank' href='" + j.url + "'>" + ad + "</a>"; }
      else { if(/PIN hatalı/i.test(j.hata || "")) localStorage.removeItem("kayitPin"); msg.textContent = "⚠ " + (j.hata || "Kaydedilemedi"); }
    }catch(e){
      msg.textContent = "⚠ Kaydedilemedi (" + e.message + ")." + (/fetch/i.test(e.message) ? " Adres hatalıysa düğmeye tekrar basınca yeni adres sorulur." : "");
      if(/fetch/i.test(e.message)) localStorage.setItem("kayitUrlSor","1");
    }finally{
      if(kap.parentNode) kap.remove();
      sheet.id = "sheet";
    }
    btn.disabled = false;
  });
})();

/* ===================== ŞİFRE KAPISI (erişim şifresi; ölçüm raporu bu sayfada değil) ===================== */
(function(){
  const kilit = document.getElementById("kilit"), inp = document.getElementById("kilitPin"), btn = document.getElementById("kilitBtn"), msg = document.getElementById("kilitMsg");
  async function dene(pin, sessiz){
    if(!pin) return;
    btn.disabled = true; if(!sessiz) msg.textContent = "Kontrol ediliyor…";
    try{
      const url = (localStorage.getItem("kayitUrl") || KAYIT_URL || "").trim();
      const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ islem:"pin", pin:pin }) });
      const j = await r.json();
      if(j.ok){ sessionStorage.setItem("erisimPin", pin); kilit.remove(); return; }
      sessionStorage.removeItem("erisimPin"); msg.textContent = sessiz ? "" : (j.hata || "Şifre hatalı");
    }catch(e){ msg.textContent = "Servise ulaşılamadı: " + e.message; }
    btn.disabled = false;
  }
  btn.addEventListener("click", () => dene(inp.value.trim(), false));
  inp.addEventListener("keydown", e => { if(e.key === "Enter") dene(inp.value.trim(), false); });
  const kayitli = sessionStorage.getItem("erisimPin"); if(kayitli) dene(kayitli, true);
})();
</script>
