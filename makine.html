<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makine Arıza / Bakım – Seval Kablo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#0f172a}
.top{background:#14305e;color:#fff;padding:14px 16px;font-size:18px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:#fff;font-size:13px;font-weight:normal;opacity:.85}
.wrap{max-width:860px;margin:0 auto;padding:12px}
.kart{background:#fff;border:1px solid #d5dbe5;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(15,23,42,.08);margin-bottom:14px}
.ust{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px;border-bottom:3px solid #e31e24}
.ust img{height:26px}.ust .bt{text-align:right;font-size:11px;font-weight:700;letter-spacing:.6px;line-height:1.3;color:#14305e}
.serit{background:linear-gradient(135deg,#0d1b36,#1d4a85);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.serit .kod{font-size:24px;font-weight:800}.serit .ad{font-size:16px;font-weight:600;margin-top:2px}.serit .alt{font-size:12px;opacity:.85;margin-top:3px}
.rozet{font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap}
.r-ok{background:#dcfce7;color:#047857}.r-no{background:#fee2e2;color:#b91c1c}.r-kv{background:#fef3c7;color:#92400e}
.ic{padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kutu{background:#f1f5f9;border-radius:10px;padding:8px 10px}
.kutu small{display:block;font-size:10px;letter-spacing:.5px;color:#64748b;font-weight:700;text-transform:uppercase}.kutu b{font-size:15px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}
.b-kirmizi{background:#dc2626;color:#fff}.b-yesil{background:#16a34a;color:#fff}.b-gri{background:#e2e8f0;color:#0f172a}.b-lacivert{background:#14305e;color:#fff}
.sec{font-size:13px;font-weight:800;letter-spacing:.5px;color:#14305e;margin:14px 0 8px;text-transform:uppercase}
.kayit{border:1px solid #e2e8f0;border-left:5px solid #dc2626;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.kayit.kapali{border-left-color:#16a34a}.kayit .bas{display:flex;justify-content:space-between;gap:6px;font-weight:700}.kayit .ac{font-size:13px;color:#334155;margin:4px 0}
.kayit .kucuk{font-size:12px;color:#64748b}.kayit .dug{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.kayit .dug .btn{padding:8px 12px;font-size:13px}
#pen{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:14px}
#pen .pk{background:#fff;border-radius:14px;max-width:640px;width:100%;overflow:hidden}
#pen .ph{color:#fff;padding:14px 16px;font-size:17px;font-weight:800}.ph.kirmizi{background:linear-gradient(135deg,#991b1b,#dc2626)}.ph.yesil{background:linear-gradient(135deg,#166534,#16a34a)}
#pen .pb{padding:14px 16px}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin:10px 0 4px}
input,select,textarea{width:100%;font:15px Arial;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
textarea{min-height:80px;resize:vertical}.iki{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ek{background:#fff7ed;border:1px dashed #fb923c;border-radius:10px;padding:4px 10px 10px;margin-top:10px}.ek .baslik{font-size:12px;font-weight:800;color:#9a3412;margin-top:8px}
.foto{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.foto img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #cbd5e1}
.parca{display:grid;grid-template-columns:1.1fr 2fr .7fr auto;gap:6px;margin-bottom:6px;align-items:center}.parca button{padding:8px 10px}
.msg{font-size:13px;margin-top:8px}.msg.err{color:#b91c1c}.msg.ok{color:#047857}
.liste a{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px;color:#0f172a;text-decoration:none}
.perf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.perf .kutu{text-align:center}.perf b{font-size:20px;display:block}
/* yazdırılabilir arıza formu */
#form .kart{max-width:190mm;margin:0 auto}.fbas{font-size:12px;font-weight:800;color:#fff;padding:7px 12px;letter-spacing:.5px}
.f-ac{background:#dc2626}.f-kap{background:#16a34a}.ftab{width:100%;border-collapse:collapse;font-size:12.5px}.ftab td{border-bottom:1px solid #e2e8f0;padding:6px 10px;vertical-align:top}
.ftab td.k{width:32%;color:#64748b;font-weight:700}.imza{display:flex;justify-content:space-between;padding:18px 14px 10px;font-size:12px}
@media print{body{background:#fff}.top,.wrap>*:not(#form),#pen,.np{display:none!important}#form{display:block!important}.kart{box-shadow:none;border:1px solid #cbd5e1}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:10mm}}
@media(max-width:560px){.perf{grid-template-columns:1fr 1fr}.parca{grid-template-columns:1fr 1fr}.iki{grid-template-columns:1fr}}
</style></head><body>

        <div class="kutu"><b style="color:#b91c1c">${CA.length}</b><small>Arızalı cihaz</small></div><div class="kutu"><b style="color:#b45309">${CK.length}</b><small>Kalibrasyondaki cihaz</small></div></div>
      ${A.some(a => a.durdu === "Evet") ? `<div class="msg" style="color:#b91c1c;font-weight:700;margin-top:8px">⛔ ${A.filter(a => a.durdu === "Evet").length} kayıtta üretim durmuş durumda</div>` : ""}</div></div>
    <div class="sec">⚙️ Makine arıza / bakım (${A.length})</div>
    ${A.map(a => { const m = MAK.find(x => key(x.kod) === key(a.mk)) || {}; return `<div class="kayit" style="${a.kayit === "Bakım" ? "border-left-color:#2563eb" : ""}"><div class="bas"><span>${a.kayit === "Bakım" ? '<span class="rozet" style="background:#dbeafe;color:#1e40af">BAKIM</span>' : '<span class="rozet" style="background:#fee2e2;color:#b91c1c">ARIZA</span>'} <a href="makine.html?id=${encodeURIComponent(a.mk)}" style="color:#14305e">${esc(a.mk)}</a> · ${esc(a.no)}</span><span class="rozet ${a.onc === "Kritik" ? "r-no" : "r-kv"}">${esc(a.onc || "Açık")}</span></div>
      <div class="ac">${a.sinif ? esc(a.sinif) + " · " : ""}${a.alt ? esc(a.alt) + " – " : ""}${esc(a.tanim)}</div>
      <div class="kucuk">${esc(m.ad || "")} · Açan: ${esc(a.acan)} · ${fz(a.acl)} · <b>${sure(a)}</b>${a.durdu === "Evet" ? " · ⛔ üretim durdu" : ""}</div>
      <div class="dug"><a class="btn b-yesil" href="makine.html?id=${encodeURIComponent(a.mk)}" style="text-decoration:none">Makine kartı → kapat</a></div></div>`; }).join("") || '<div class="msg">Açık makine kaydı yok. ✓</div>'}
    <div class="sec">🔬 Arızalı cihazlar (${CA.length})</div>${CA.map(x => cih(x, "#dc2626", "Arıza")).join("") || '<div class="msg">Arızalı cihaz yok. ✓</div>'}
    <div class="sec">📏 Kalibrasyondaki cihazlar (${CK.length})</div>${CK.map(x => cih(x, "#b45309", "Kalibrasyonda")).join("") || '<div class="msg">Kalibrasyona gönderilmiş, dönmemiş cihaz yok.</div>'}
    <div class="msg">ℹ️ Cihaz arızası ve kalibrasyona gönderim cihaz karnesinden girilir; bitiş / dönüş tarihi girilince listeden düşer.</div>`;
}

// Makine QR etiketleri: seç → yazdır (QR okutulunca makine kartı açılır)
async function qrEtiketler(){
  document.querySelector(".top span").textContent = "🔳 Makine QR etiketleri";
  const hat = {}; MAK.forEach(m => (hat[m.hat || "Diğer"] = hat[m.hat || "Diğer"] || []).push(m));
  $("#app").innerHTML = `<div class="kart"><div class="ic"><div class="msg" style="margin:0 0 8px">Etiketi basılacak makineleri seçin. QR okutulunca makinenin kartı açılır; operatör arızayı oradan bildirir.</div>
      <p style="display:flex;gap:8px;flex-wrap:wrap;margin:0"><button class="btn b-lacivert" id="q_bas">🖨 Seçilenleri yazdır</button><button class="btn b-gri" id="q_hep">Tümünü seç</button><button class="btn b-gri" id="q_yok">Seçimi temizle</button><span class="msg" id="q_say" style="margin:0;align-self:center"></span></p></div></div>
    ${Object.keys(hat).sort((a, b) => a.localeCompare(b, "tr")).map(h => `<div class="kart"><div class="ic"><label style="display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:14px"><input type="checkbox" data-hat="${esc(h)}" style="width:auto"> <b>${esc(h)}</b> (${hat[h].length})</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${hat[h].map(m => `<label style="display:flex;gap:5px;align-items:center;margin:0;font-weight:700;border:1px solid #e2e8f0;border-radius:8px;padding:5px 8px"><input type="checkbox" data-mk="${esc(m.kod)}" data-h="${esc(h)}" style="width:auto">${esc(m.kod)}</label>`).join("")}</div></div></div>`).join("")}<div id="etk" style="display:none"></div>`;
  const say = () => { $("#q_say").textContent = document.querySelectorAll("[data-mk]:checked").length + " makine seçili"; }; say();
  document.querySelectorAll("[data-hat]").forEach(c => c.onchange = () => { document.querySelectorAll(`[data-h="${CSS.escape(c.dataset.hat)}"]`).forEach(x => x.checked = c.checked); say(); });
  document.querySelectorAll("[data-mk]").forEach(c => c.onchange = say);
  $("#q_hep").onclick = () => { document.querySelectorAll("[data-mk],[data-hat]").forEach(x => x.checked = true); say(); };
  $("#q_yok").onclick = () => { document.querySelectorAll("[data-mk],[data-hat]").forEach(x => x.checked = false); say(); };
  $("#q_bas").onclick = async () => {
    const L = [...document.querySelectorAll("[data-mk]:checked")].map(c => MAK.find(m => m.kod === c.dataset.mk)).filter(Boolean); if(!L.length) return alert("Makine seçin.");
    if(!window.qrcode) await new Promise((ok, red) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"; sc.onload = ok; sc.onerror = () => red(new Error("QR kütüphanesi yüklenemedi")); document.head.appendChild(sc); }).catch(e => alert(e.message));
    if(!window.qrcode) return;
    const taban = new URL("makine.html", location.href).href, w = window.open("", "_blank"); if(!w) return alert("Açılır pencere engellendi");
    const et = L.map(m => { const q = qrcode(0, "M"); q.addData(taban + "?id=" + encodeURIComponent(m.kod)); q.make();
      const ur = [m.uretici, m.tarih].filter(Boolean).join(" · ");
      const bant = [m.volt ? "⚡ " + m.volt.replace(/\s*V$/i, "") + " V" : "", m.guc ? m.guc.replace(".", ",") + " kW" : "", m.hava ? "💨 " + m.hava.replace(".", ",") + " bar" : ""].filter(Boolean).join("  ·  ");
      return `<div class="e"><div class="sol"><img class="lg" src="${LOGO}"><div class="kd">${esc(m.kod)}</div><div class="ad">${esc(m.ad || "")}</div>${ur ? `<div class="ur">${esc(ur)}</div>` : ""}<div class="nt">${bant ? esc(bant) : "🔧 Arıza / bakım bildirmek için QR'ı okutun"}</div></div><div class="qr">${q.createSvgTag({ cellSize:3, margin:0, scalable:true })}</div></div>`; }).join("");
    w.document.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Makine QR etiketleri</title><style>
      @page{size:A4;margin:8mm}body{margin:0;font-family:Arial,sans-serif}.s{display:flex;flex-wrap:wrap;gap:3mm}
      .e{width:92mm;height:46mm;border:.3mm solid #94a3b8;border-radius:3mm;display:flex;align-items:center;gap:3mm;padding:3mm;box-sizing:border-box;break-inside:avoid;border-top:2.2mm solid #b91c1c}
      .sol{flex:1;min-width:0}.lg{height:6mm}.kd{font-size:9mm;font-weight:900;color:#14305e;line-height:1.1;margin-top:1.5mm}.ad{font-size:3.4mm;font-weight:700;color:#334155}.ur{font-size:2.8mm;color:#475569;margin-top:.6mm}.nt{font-size:3.1mm;color:#b91c1c;font-weight:800;margin-top:1.5mm}
      .qr{width:34mm;height:34mm}.qr svg{width:100%;height:100%}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><div class="s">${et}</div><script>setTimeout(() => print(), 500)<\/script></body></html>`);
    w.document.close();
  };
}

// KONUM: cihazı bu makineye tak (cihaz QR'ı okut ya da kodu yaz) → Bulunduğu Yer = makine kodu, karneye "Söküm / Takma"
async function qrOkuyucu(kap, bulundu){
  let akis = null, h5 = null; const dur = () => { if(akis){ akis.getTracks().forEach(t => t.stop()); akis = null; } if(h5){ try{ h5.stop(); }catch(e){} h5 = null; } };
  kap.innerHTML = `<video playsinline muted style="width:100%;max-height:45vh;background:#000;border-radius:10px"></video><div id="h5q"></div><div class="msg">QR'ı kameraya tutun…</div>`;
  const vd = kap.querySelector("video"), bitti = x => { dur(); kap.innerHTML = ""; bulundu(x); };
  if("BarcodeDetector" in window){ try{ const det = new BarcodeDetector({ formats:["qr_code"] }); akis = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }); vd.srcObject = akis; await vd.play();
      const dongu = async () => { if(!akis) return; try{ const s = await det.detect(vd); if(s.length){ bitti(s[0].rawValue); return; } }catch(e){} requestAnimationFrame(dongu); }; dongu(); return dur; }catch(e){ dur(); } }
  vd.style.display = "none";
  try{ if(!window.Html5Qrcode) await new Promise((ok, red) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"; sc.onload = ok; sc.onerror = () => red(new Error("okuyucu yüklenemedi")); document.head.appendChild(sc); });
    h5 = new Html5Qrcode("h5q"); await h5.start({ facingMode:"environment" }, { fps:10, qrbox:220 }, x => bitti(x)); }
  catch(e){ kap.innerHTML = `<div class="msg err">Kamera açılamadı: ${esc(e.message)} – kodu elle yazabilirsiniz.</div>`; }
  return dur;
}
const qrCihaz = x => { try{ const u = new URL(x); const k = u.searchParams.get("id"); if(k) return k.trim(); }catch(e){} const m = /[A-ZÇĞİÖŞÜ]{1,4}-[0-9A-Z.\/-]{1,10}/i.exec(String(x)); return m ? m[0].toUpperCase() : ""; };
function cihazTakForm(m){
  const p = pencere("kirmizi", `📍 ${esc(m.kod)} makinesine cihaz tak`, `<div class="msg" style="margin:0 0 8px">Cihazın QR'ını okutun ya da Kayıt No'sunu yazın. Cihazın konumu bu makine olur, eski yeri karneye "Söküm / Takma" olarak yazılır.</div>
    <label>Cihaz (Kayıt No)<input id="t_id" list="t_dl" placeholder="KK-256"></label><datalist id="t_dl">${CHZ.filter(c => key(c.mk) !== key(m.kod)).map(c => `<option value="${esc(c.id)}">${esc(c.ad + (c.yer ? " · " + c.yer : ""))}</option>`).join("")}</datalist>
    <div id="t_bilgi" class="msg" style="margin:4px 0"></div>
    <p style="margin:6px 0"><button class="btn b-lacivert" id="t_qr" type="button">📷 Cihazın QR'ını okut</button></p><div id="t_kam"></div>
    <label>Not (isteğe bağlı)<input id="t_not"></label><label>Takan<input id="t_kim" value="${esc(localStorage.getItem("arzAd") || "")}"></label>
    <p style="display:flex;gap:8px"><button class="btn b-yesil" id="t_ok">Tak (PIN)</button><button class="btn b-gri" id="t_ip">Vazgeç</button></p><div class="msg" id="t_m"></div>`);
  p.querySelector(".ph").style.background = "linear-gradient(135deg,#0f766e,#14b8a6)";
  let dur = null, yol = "liste";
  const bilgi = () => { const c = CHZ.find(x => key(x.id) === key(p.querySelector("#t_id").value)); p.querySelector("#t_bilgi").textContent = c ? c.ad + " · şu an: " + (c.yer || "belirtilmemiş") : ""; };
  p.querySelector("#t_id").oninput = bilgi;
  p.querySelector("#t_ip").onclick = () => { if(dur) dur(); p.remove(); };
  p.querySelector("#t_qr").onclick = async () => { dur = await qrOkuyucu(p.querySelector("#t_kam"), x => { const k = qrCihaz(x); if(k){ p.querySelector("#t_id").value = k; yol = "QR"; bilgi(); } else alert("Bu QR bir cihaz QR'ı değil: " + x); }); };
  p.querySelector("#t_ok").onclick = async () => { if(dur) dur(); const q = s => p.querySelector(s).value.trim(), g = p.querySelector("#t_m");
    if(!q("#t_id")){ g.className = "msg err"; g.textContent = "Cihazı seçin ya da QR okutun."; return; }
    let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return; }
    g.className = "msg"; g.textContent = "Kaydediliyor…";
    try{ const j = await servis({ islem:"konum", pin, id:q("#t_id"), yer:m.kod, not:q("#t_not"), kim:q("#t_kim"), yol });
      if(j.ok){ localStorage.setItem("kayitPin", pin); localStorage.setItem("arzAd", q("#t_kim")); g.className = "msg ok"; g.textContent = "✓ " + j.mesaj; setTimeout(() => { p.remove(); yukle(); }, 1200); }
      else { if(/PIN/.test(j.hata || "")) localStorage.removeItem("kayitPin"); g.className = "msg err"; g.textContent = "⚠ " + j.hata; } }
    catch(e){ g.className = "msg err"; g.textContent = "⚠ Servise ulaşılamadı: " + e.message; } };
}
yukle();
