<div class="wrap" id="app"><div class="msg">Yükleniyor…</div></div>
<script>
const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A";
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim(), key = s => String(s ?? "").trim().replace(/\s+/g, "").replace(/\//g, "-").toLocaleUpperCase("tr");
const GRUP = { AK:"Aktarma", BK:"Büküm", CT:"Tel Çekme", CV:"Orta Gerilim", DK:"Döküm", EK:"Ekstruder", KN:"Kangallama", KT:"Katot", OR:"Örgü", PL:"Plastik", RJ:"Rijit", ZR:"Zırhlama" };
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label));
  return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; };
// makine kodu: yer / model içindeki EK-03, KN-5, AK03… → UR-EK03
const makineKodu = s => { const m = /(?:^|[^A-ZÇĞİÖŞÜ])(AK|BK|CT|CV|DK|EK|KN|KT|OR|PL|RJ|ZR)[\s\-]?0*(\d{1,2})(?!\d)/i.exec(String(s || "").toLocaleUpperCase("tr")); return m ? "UR-" + m[1].toUpperCase() + ("0" + m[2]).slice(-2) : ""; };
let MAK = [], CIH = [], FILTRE = "harita";
// ölçüm kategorileri (cihaz adına göre) – [ad, desen, simge]
const KATEGORI = [
  ["Sıcaklık", /etüv|etuv|termometre|sıcaklık|data logger|ısı kayıt|termokupl|dondurucu|su banyosu|kül fırını|termoreakt|ısıl|soğutma|isi kayit/, "🌡️"],
  ["Boyut / uzunluk", /kumpas|mikrometre|mikroskop|profil|çap|şerit|çelik metre|metre sayac|metre disk|yazı makina|komparatör|mastar|cam skala|kalınlık/, "📏"],
  ["Direnç", /resistomat|sehpa|pt-?\s?100|standart diren/, "Ω"],
  ["Elektrik / gerilim", /yüksek gerilim|orta gerilim|spark|prob|multimetre|megaohm|miliohm|resistomat|sehpa|direnç|oto trafo|akım|wattmetre|shortester|kısa devre/, "⚡"],
  ["Kütle", /terazi|kantar|tartı/, "⚖️"],
  ["Basınç / akış", /manometre|flowmetre|debimetre|anemometre|basınç|hava akış/, "💨"],
  ["Mekanik test", /çekme|kopma|bükülgenlik|aşındırma|soğukta|sertlik|dinamometre|kronometre|darbe|uzama/, "🔩"],
  ["Yangın / CPR", /alev|en 50399|en 60332|en 50200|en 61034|duman|cpr|yanma|ekipman doğ/, "🔥"],
  ["Kimya / çevre", /ph|iletkenlik|ses seviye|gürültü|nem|gaz analiz|mezur|balonjoje|su tayin/, "🧪"]
];
const kategori = (ad, model) => { const n = norm(ad + " " + (model || "")), once = KATEGORI.find(k => k[0] === "Direnç" && k[1].test(n)); if(once) return "Direnç"; const x = KATEGORI.find(k => k[1].test(n)); return x ? x[0] : "Diğer"; };   // Direnç (resistomat, sehpa, Pt100) önce
async function yukle(){
  let C, M, A, E, K;
  try{ [C, M, A, E, K] = await Promise.all([sekme("Cihazlar"), sekme("Makinalar").catch(() => []), sekme("Arizalar").catch(() => []), sekme("Etuv_Testleri").catch(() => []), sekme("Karne").catch(() => [])]); }
  catch(e){ $("#app").innerHTML = `<div class="msg">Veriler alınamadı: ${esc(e.message)}</div>`; return; }
  const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
  const acikAriza = {}; A.forEach(r => { if(v(r["durum"]) && v(r["durum"]) !== "Kapalı") { const k = key(v(r["makine kodu"])); (acikAriza[k] = acikAriza[k] || []).push(v(r["arıza no"])); } });
  // karne: bitişi girilmemiş arıza / kalibrasyon olayları
  const tz = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; };
  const kArz = {}, kKal = {};
  K.forEach(r => { if(v(r["bitiş"])) return; const id = key(v(r["kayıt no"])), t = v(r["tür"]), b = tz(r["başlangıç"]) || tz(r["tarih"]);
    if(/^(Arıza|Tamir)$/.test(t)) kArz[id] = b || true; else if(t === "Kalibrasyon") kKal[id] = b || true; });
  const gunSay = d => d instanceof Date ? Math.max(0, Math.floor((Date.now() - d) / 864e5)) + " gün" : "";
  const etuvTest = {}; E.forEach(r => { if(v(r["durum"]) === "Devam") etuvTest[key(v(r["kayıt no"]))] = v(r["test no"]) + " · " + v(r["test tipi"]) + " · " + v(r["test sıcaklığı (°c)"]) + " °C"; });
  MAK = M.map(r => ({ kod:v(r["makine kodu"]), ad:v(r["makine adı"]), hat:v(r["hat / bölüm"]), yer:v(r["bulunduğu yer"]), durum:v(r["durum"]),
    uretici:v(r["üretici / otomasyon"]), volt:v(r["besleme gerilimi (v)"]), guc:v(r["kurulu güç (kw)"]), hava:v(r["hava basıncı (bar)"]) })).filter(m => m.kod).map(m => {
    const ar = acikAriza[key(m.kod)] || [];
    m.renk = ar.length ? "k" : /duruyor|pasif|bakım|kapalı/i.test(m.durum) ? "s" : "g";
    m.neden = ar.length ? ar.length + " açık arıza (" + ar.join(", ") + ")" : m.renk === "s" ? "Durum: " + m.durum : "Çalışıyor";
    return m; });
  CIH = C.map(r => ({ id:v(r["kayıt no"]), ad:v(r["cihaz adı"]), yer:v(r["bulunduğu yer"]), model:v(r["model"]), marka:v(r["marka"]), foto:v(r["fotoğraf url"]), durum:v(r["cihaz durumu"]), kn:tar(r["sonraki kalibrasyon"]), dn:tar(r["sonraki doğrulama"]), ds:v(r["doğrulama sonucu"]) })).filter(c => c.id).map(c => {
    const neden = [];
    if(/arız|kullanım dışı|hurda|uygun değil|olumsuz/i.test(c.durum)) neden.push("Durum: " + c.durum);
    if(c.kn && c.kn < bugun) neden.push("kalibrasyon süresi geçti");
    if(c.dn && c.dn < bugun) neden.push("doğrulama süresi geçti");
    if(/OLUMSUZ/i.test(c.ds)) neden.push("doğrulama olumsuz");   // "ölçüm raporuna bakınız" hata değil
    if(kArz[key(c.id)]) neden.unshift("ARIZADA" + (gunSay(kArz[key(c.id)]) ? " (" + gunSay(kArz[key(c.id)]) + ")" : ""));
    const etuv = /etüv|etuv/i.test(c.ad), test = etuvTest[key(c.id)], kal = kKal[key(c.id)];
    // öncelik: arızada (kırmızı) → kalibrasyonda (sarı; süre/uygunluk nedeni zaten bu) → diğer kırmızı nedenler → etüv durumu → hazır
    const kalY = kal ? "Kalibrasyonda" + (gunSay(kal) ? " (" + gunSay(kal) + ")" : "") : "";
    c.renk = kArz[key(c.id)] ? "k" : kal ? "s" : neden.length ? "k" : etuv ? (test ? "g" : "s") : "g";
    c.neden = kal && !kArz[key(c.id)] ? [kalY].concat(neden).join(" · ") : neden.length ? (kal ? [neden[0], kalY].concat(neden.slice(1)) : neden).join(" · ") : etuv ? (test ? "Test sürüyor: " + test : "Etüv boş / duruyor") : (/RAPORUNA/i.test(c.ds) ? "Kullanıma hazır · ölçüm raporuna bakınız" : "Kullanıma hazır");
    c.mk = makineKodu(c.yer) || (/ısı göster|isi göster/.test(norm(c.ad)) ? makineKodu(c.model) : "");
    return c; });
  ciz();
}
const mm = c => [c.marka, /^(AK|BK|CT|CV|DK|EK|KN|KT|OR|PL|RJ|ZR)[\s\-]?\d{1,2}$/i.test(c.model || "") ? "" : c.model].filter(x => x && x !== "-").join(" ");   // modelde makine kodu (EK-03) yazıyorsa gösterilmez
// makine kartında cihaz etiketi: simge + kod (ad, marka, durum: üzerine gelince / dokununca)
const SIMGE = [[/spark/, "⚡"], [/çap|cap ölç/, "📏"], [/metre sayac|metre disk/, "🔢"], [/yazı makina|yazi makina/, "🖋️"], [/yüksek gerilim|prob/, "🔌"], [/ısı göster|isi göster|termometre|sıcaklık/, "🌡️"], [/terazi|kantar/, "⚖️"], [/manometre|basınç/, "💨"]];
const simge = ad => { const n = norm(ad); const x = SIMGE.find(s => s[0].test(n)); return x ? x[1] : "🔹"; };
// makine kartında cihaz: fotoğraf (yoksa tür simgesi) + üzerinde marka/model + altında durum ve kod
const fotoId = u => (String(u || "").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{10,})/) || [])[1] || "";
const fotoSrc = u => { const id = fotoId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w240` : (/^https?:\/\//.test(u || "") ? u : ""); };
// fotoğrafı olmayan cihaz için özgün çizim (sparktester, çap ölçer); diğerlerinde tür simgesi
const CIZIM = {
  spark: '<svg viewBox="0 0 64 48" width="62" height="46"><rect x="7" y="9" width="50" height="31" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><rect x="40" y="13" width="13" height="6" rx="1" fill="#22c55e"/><circle cx="25" cy="25" r="9" fill="#fff" stroke="#475569" stroke-width="2"/><line x1="0" y1="25" x2="64" y2="25" stroke="#0f172a" stroke-width="3.5"/><path d="M24 15l-4 8h4l-2 8 7-10h-4l3-6z" fill="#f59e0b" stroke="#b45309" stroke-width=".6"/></svg>',
  cap: '<svg viewBox="0 0 64 48" width="62" height="46"><path d="M12 7h40v11H41v12h11v11H12V30h11V18H12z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><line x1="0" y1="24" x2="64" y2="24" stroke="#0f172a" stroke-width="4"/><line x1="23" y1="18" x2="23" y2="30" stroke="#ef4444" stroke-width="1.6"/><line x1="41" y1="18" x2="41" y2="30" stroke="#ef4444" stroke-width="1.6"/><rect x="16" y="9" width="11" height="5" rx="1" fill="#38bdf8"/></svg>' };
const cizim = ad => { const n = norm(ad); return /spark/.test(n) ? CIZIM.spark : /çap|cap ölç/.test(n) ? CIZIM.cap : `<span class="sm">${simge(ad)}</span>`; };
const cip = c => { const f = fotoSrc(c.foto), y = mm(c);
  return `<a class="ft" href="cihaz.html?id=${encodeURIComponent(c.id)}" title="${esc(c.ad + (y ? " · " + y : "") + " – " + c.neden)}"><span class="im">${cizim(c.ad)}${f ? `<img src="${esc(f)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${y ? `<span class="mm">${esc(y)}</span>` : ""}</span><span class="kd"><span class="nok ${c.renk}"></span>${esc(c.id)}</span><span class="ca">${esc(c.ad)}</span></a>`; };
const isiGosterge = c => /ısı göster|isi göster/.test(norm(c.ad));
const isiOzet = L => { if(!L.length) return ""; const r = L.some(c => c.renk === "k") ? "k" : L.some(c => c.renk === "s") ? "s" : "g";
  return `<a class="cip" href="cihaz.html?id=${encodeURIComponent(L[0].id)}" title="${esc("Isı göstergeleri (doğrulamaları ayrıca takip edilir):\n" + L.map(c => c.id + " " + c.ad + " – " + c.neden).join("\n"))}"><span class="nok ${r}"></span>🌡️ ${L.length}</a>`; };
const makBilgi = m => { const e = [m.volt ? "⚡ " + m.volt.replace(/\s*V$/i, "") + " V" : "", m.guc ? m.guc.replace(".", ",") + " kW" : "", m.hava ? "💨 " + m.hava.replace(".", ",") + " bar" : ""].filter(Boolean).join(" · ");
  return (m.uretici ? `<div class="mt">${esc(m.uretici)}</div>` : "") + (e ? `<div class="me">${esc(e)}</div>` : ""); };
// laboratuvar cihazı: makine kartı gibi dolgulu küçük kart (hazır = turkuaz)
const labKart = c => `<a class="lk ${c.renk}" href="cihaz.html?id=${encodeURIComponent(c.id)}" title="${esc(c.ad + " · " + (c.yer || "") + " – " + c.neden)}"><div class="mb"><span>${esc(c.id)}</span><span class="nok ${c.renk === "g" ? "t" : c.renk}"></span></div><div class="la">${esc(c.ad)}</div>${mm(c) ? `<div class="lm">${esc(mm(c))}</div>` : ""}</a>`;
function ciz(){
  const q = norm($("#ara") ? $("#ara").value : ""), uy = s => !q || norm(s).includes(q);
  const mkSet = new Set(MAK.map(m => key(m.kod))), makCih = {}, kalan = [];
  CIH.forEach(c => { if(c.mk && mkSet.has(key(c.mk))) (makCih[key(c.mk)] = makCih[key(c.mk)] || []).push(c); else kalan.push(c); });
  const say = L => ({ g:L.filter(x => x.renk === "g").length, s:L.filter(x => x.renk === "s").length, k:L.filter(x => x.renk === "k").length });
  const sm = say(MAK), sc = say(CIH);
  let h = `<div class="ozet"><div class="oz"><span class="nok g"></span><b>${sm.g + sc.g}</b> çalışıyor / hazır</div><div class="oz"><span class="nok s"></span><b>${sm.s + sc.s}</b> duruyor</div><div class="oz"><span class="nok k"></span><b>${sm.k + sc.k}</b> arıza / uygunsuz</div><div class="oz">⚙️ <b>${MAK.length}</b> makine · 🔬 <b>${CIH.length}</b> cihaz</div></div>
    <div class="arac"><input id="ara" placeholder="Ara: UR-EK03, KK-23, etüv, LAB-ARGE…" value="${esc($("#ara") ? $("#ara").value : "")}">
    ${[["harita","🗺️ Harita"],["tum","Liste"],["mak","Üretim hatları"],["lab","Laboratuvarlar"],["kir","Yalnız kırmızı"]].map(([k, a]) => `<button data-f="${k}" class="${FILTRE === k ? "on" : ""}">${a}</button>`).join("")}</div>`;
  if(FILTRE === "harita"){ h += harita(makCih, kalan); $("#app").innerHTML = h; baglaHarita(); $("#ara").oninput = () => { FILTRE = "tum"; ciz(); }; document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { FILTRE = b.dataset.f; ciz(); }); return; }
  if(FILTRE !== "lab"){
