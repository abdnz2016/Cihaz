<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Ölçüm ve Kullanım Raporu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#111}
.top{background:#14305e;color:#fff;padding:14px;font-size:18px;font-weight:bold}
.top span{font-weight:normal;font-size:13px;opacity:.85;margin-left:6px}
.tool{background:#fff;padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd}
.tool input{flex:1;min-width:180px;font:15px Arial;padding:10px;border:1px solid #bbb;border-radius:8px}
.tool button{padding:10px 14px;border:0;border-radius:8px;background:#e31e24;color:#fff;font-weight:bold;font-size:14px}
.tool button.g{background:#14305e}
#msg{padding:14px;color:#666;text-align:center;font-size:14px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:14px;max-width:1100px;margin:0 auto;justify-items:center}
.rep{width:98mm;max-width:100%;background:#fff;border:.25mm solid #d5dbe5;border-radius:3.5mm;overflow:hidden;font-size:3.1mm;color:#0f172a;display:flex;flex-direction:column;box-shadow:0 2mm 6mm rgba(15,23,42,.10)}
.rep .ust{display:flex;align-items:center;justify-content:space-between;gap:2mm;padding:3mm 3.5mm 2.4mm;border-bottom:.7mm solid #e31e24}
.rep .ust img{height:6.2mm}.rep .ust .bt{text-align:right;font-size:2.35mm;font-weight:700;color:#14305e;letter-spacing:.15mm;line-height:1.25}
.rep .serit{background:linear-gradient(135deg,#0d1b36,#1d4a85);color:#fff;padding:3mm 3.5mm;display:flex;justify-content:space-between;align-items:center;gap:2mm}
.rep .serit .kod{font-size:4.6mm;font-weight:800;letter-spacing:.2mm}.rep .serit .ad{font-size:3.4mm;font-weight:600;margin-top:.4mm}.rep .serit .alt{font-size:2.5mm;opacity:.85;margin-top:.6mm}
.rep .durum{font-size:2.5mm;font-weight:800;padding:1.2mm 2.4mm;border-radius:5mm;white-space:nowrap;text-align:center}
.rep .durum.ok{background:#d1fae5;color:#065f46}.rep .durum.bak{background:#fef3c7;color:#92400e;white-space:normal;max-width:30mm}.rep .durum.yok{background:#e2e8f0;color:#475569}
.rep .kutu{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm;padding:3mm 3.5mm 1mm}
.rep .kutu div{background:#f3f6fb;border-radius:2mm;padding:1.6mm 2.2mm}.rep .kutu small{display:block;font-size:2.1mm;color:#64748b;font-weight:700;letter-spacing:.1mm;text-transform:uppercase}.rep .kutu b{font-size:3mm}
.rep table{width:100%;border-collapse:separate;border-spacing:0}
.rep .tw{padding:2mm 3.5mm 0}.rep .tt{font-size:2.4mm;font-weight:800;color:#14305e;margin:1mm 0 1mm;text-transform:uppercase;letter-spacing:.1mm}
.rep .olc{border:.25mm solid #d5dbe5;border-radius:2mm;overflow:hidden}
.rep .olc th{background:#14305e;color:#fff;font-size:2.15mm;font-weight:700;padding:1.4mm .8mm;text-align:center;line-height:1.2}
.rep .olc td{padding:1.3mm .8mm;text-align:center;border-top:.2mm solid #e6eaf1;font-size:3mm}
.rep .olc tr:nth-child(even) td{background:#f8fafc}.rep .olc td.gir{background:#e0f2fe!important;color:#0c4a6e;font-weight:800}.rep .olc td.kotu{color:#c4161c;font-weight:800}
.rep .not{margin:2.5mm 3.5mm 0;background:#f1f5f9;border-left:.9mm solid #14305e;border-radius:1.5mm;padding:1.8mm 2.2mm;font-size:2.45mm;line-height:1.4;color:#334155}
.rep .uyar{margin:2mm 3.5mm 0;background:#fee2e2;color:#991b1b;border-radius:1.5mm;padding:1.6mm 2.2mm;font-size:2.5mm;font-weight:700}
.rep .alt2{display:flex;justify-content:space-between;align-items:flex-end;padding:4mm 3.5mm 2.5mm;margin-top:auto}
.rep .alt2 .form{font-size:2mm;color:#94a3b8}.rep .alt2 .imza{text-align:right;font-size:2.7mm;line-height:1.35}.rep .alt2 .imza b{display:block;font-size:2.9mm}
@media print{
  body{background:#fff}.top,.tool,#msg{display:none}
  #list{display:grid;grid-template-columns:repeat(2,98mm);gap:4mm;padding:0;justify-content:center;max-width:none}
  .rep{break-inside:avoid;box-shadow:none}
  @page{size:A4;margin:6mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <button class="g" onclick="window.print()">Yazdır / PDF</button>
</div>

async function sheet(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url, {cache:"no-store"}); if(!res.ok) throw new Error(name + " sekmesi okunamadı");
  const t = await res.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
  if(j.status && j.status !== "ok") throw new Error(name + " sekmesi bulunamadı");
  const idx = {}; j.table.cols.forEach((c,i)=>{ idx[norm(c.label)] = i; });
  return {rows:j.table.rows.filter(r=>r.c), idx};
}
async function olcumSheet(){
  for(const n of CONFIG.OLCUM_SEKMELER){
    try{ const o = await sheet(n); if((o.idx["set değeri"] !== undefined && o.idx["ölçülen değer"] !== undefined) || (o.idx["set değerleri"] !== undefined && o.idx["ölçülen değerler"] !== undefined)) return o; }catch(e){}
  }
  throw new Error("'Ölçümler' sekmesi bulunamadı (başlıklar: Kayıt No, Set Değerleri, Ölçülen Değerler)");
}
let DEV = {}, MEAS = {}, IDS = [];
async function load(){
  const [c, o] = await Promise.all([sheet(CONFIG.CIHAZ_SEKME), olcumSheet()]);
  const g = (r,key) => { const i = c.idx[key]; return i === undefined ? null : r.c[i]; };
  c.rows.forEach(r => {
    const id = idOf(g(r,"kayıt no")); if(!id) return;
    const kt = parseDate(g(r,"kalibrasyon tarihi")), kp = num(g(r,"kalibrasyon periyodu (ay)"));
    let next = parseDate(g(r,"sonraki kalibrasyon"));
    if(!next && kt && kp) next = addDays(kt, Math.round(kp*365/12));
    DEV[id] = {id, ad:txt(g(r,"cihaz adı")), marka:txt(g(r,"marka")), model:txt(g(r,"model")), seri:txt(g(r,"seri numarası")), sert:txt(g(r,"sertifika no")), yer:txt(g(r,"bulunduğu yer")), kt, next};
  });
  const oi = k => o.idx[k];
  const og = (r,k) => oi(k) === undefined ? null : r.c[oi(k)];
  const kompakt = oi("set değerleri") !== undefined && oi("ölçülen değerler") !== undefined;
  const liste = c => String(txt(c) || "").split(/[;|\n]+/).map(x => x.trim()).filter(Boolean).map(x => parseFloat(x.replace(",", ".")));
  o.rows.forEach(r => {
    const id = idOf(og(r,"kayıt no")); if(!id) return;
    const turKey = norm(txt(og(r,"ölçüm türü"))) || "sıcaklık";
    const T = TUR[turKey] || TUR["sıcaklık"];
    const unit = txt(og(r,"birim")) || T.birim;
    const dd = num(og(r,"ondalık")), dec = isNaN(dd) ? T.dec : dd;
    const kulc = norm(txt(og(r,"kullanım"))), dn = DEV[id] ? norm(DEV[id].ad) : "";
    if(DEV[id] && oi("durum") !== undefined && DEV[id].olcDurum === undefined) DEV[id].olcDurum = txt(og(r,"durum"));
    const kul = kulc ? (/ölçü|olcu/.test(kulc) ? "ölçüm" : "ayar") : (AYAR_RE.test(dn) ? "ayar" : "ölçüm");
    if(kompakt){
      const S = liste(og(r,"set değerleri")), O = liste(og(r,"ölçülen değerler")), U = liste(og(r,"belirsizlikler")), U1 = U.length === 1 ? U[0] : undefined;
      for(let i = 0; i < Math.min(S.length, O.length); i++) if(!isNaN(S[i]) && !isNaN(O[i])) (MEAS[id] = MEAS[id] || []).push({set:S[i], olc:O[i], u: U1 !== undefined ? U1 : U[i], unit, tur:T.ad, dec, kul});
      return;
    }
    const set = num(og(r,"set değeri")), olc = num(og(r,"ölçülen değer"));
    if(isNaN(set) || isNaN(olc)) return;
    (MEAS[id] = MEAS[id] || []).push({set, olc, unit, tur:T.ad, dec, kul});
  });
  IDS = Object.keys(MEAS).filter(id => DEV[id]);
}
function report(id){
  const d = DEV[id], all = (MEAS[id] || []).slice();
  const groups = {}; all.forEach(m => { const k = m.tur + "|" + m.unit + "|" + m.dec + "|" + m.kul; (groups[k] = groups[k] || []).push(m); });
  const keys = Object.keys(groups), multi = keys.length > 1;
  let durum = null, kritTxt = "", fark = 0;
  const tables = keys.map(k => {
    const rows = groups[k].sort((a,b)=>a.set-b.set), u = rows[0].unit, dec = rows[0].dec, kr = kriter(d, u), olcum = rows[0].kul === "ölçüm", hasU = rows.some(m => m.u !== undefined && !isNaN(m.u));
    if(kr && !kritTxt) kritTxt = kr.pct ? "± %" + String(kr.tol).replace(".", ",") : "± " + String(kr.tol).replace(".", ",") + " " + kr.u;
    const body = rows.map(m => {
      const e = m.olc - m.set, ok = kr ? (kr.pct ? (m.set ? Math.abs(e)/Math.abs(m.set)*100 <= kr.tol + 1e-9 : Math.abs(e) <= 1e-9) : Math.abs(e) <= kr.tol + 1e-9) : null;
      if(ok === false) durum = false; else if(ok === true && durum === null) durum = true;
      if(Math.abs(e) > 1e-9) fark++;
      return `<tr><td>${fset(m.set)}</td><td>${fnum(m.olc, dec)}</td><td class="${ok===false ? "kotu" : ""}">${(e>0?"+":"") + fnum(e, dec)}</td><td class="gir">${olcum ? ((-e > 0 ? "+" : "") + fnum(-e, dec)) : fnum(girilecek(m.set, m.olc, dec), dec)}</td>${hasU ? `<td>${m.u !== undefined && !isNaN(m.u) ? String(m.u).replace(".", ",") : "—"}</td>` : ""}</tr>`; }).join("");
    return `<div class="tw">${multi ? `<div class="tt">${esc(rows[0].tur)}</div>` : `<div class="tt">${olcum ? "Ölçüm sonuçları" : "Ayar ve kullanım değerleri"}</div>`}<table class="olc">
      ${olcum ? `<tr><th>REFERANS<br>${esc(u)}</th><th>CİHAZ OKUMASI<br>${esc(u)}</th><th>HATA<br>${esc(u)}</th><th>DÜZELTME<br>${esc(u)}</th>${hasU ? `<th>BELİRSİZLİK<br>± ${esc(u)}</th>` : ""}</tr>` : `<tr><th>SET<br>${esc(u)}</th><th>ÖLÇÜLEN<br>${esc(u)}</th><th>HATA<br>${esc(u)}</th><th>GİRİLECEK<br>${esc(u)}</th>${hasU ? `<th>BELİRSİZLİK<br>± ${esc(u)}</th>` : ""}</tr>`}
      ${body}
    </table></div>`;
  }).join("");
  const dTxt = durum === null ? "—" : (durum ? "UYGUN" : "ÖLÇÜM SONUÇLARINA BAKINIZ");
  const olcumTum = all.length && all.every(m => m.kul === "ölçüm");
  const kul = olcumTum
    ? (durum === false ? "Hata kabul kriterini aşan nokta var: cihazla alınan okumalara tablodaki DÜZELTME değeri eklenerek kullanılır." : "Cihazla alınan okumalara gerektiğinde DÜZELTME değeri eklenir (gerçek değer = okuma + düzeltme).")
    : (durum === false ? "Hata kabul kriterini aşan nokta var: cihaz tablodaki GİRİLECEK DEĞER girilerek kullanılır."
            : "Set değerine ulaşmak için cihaza GİRİLECEK DEĞER girilmelidir.");
  return `<div class="rep">
    <div class="ust"><img src="${CONFIG.LOGO}" alt="Seval Kablo"><div class="bt">CİHAZ ÖLÇÜM VE<br>KULLANIM RAPORU</div></div>
    <div class="serit"><div><div class="kod">${esc(d.id)}</div><div class="ad">${esc(d.ad)}</div><div class="alt">${esc([d.marka, d.model].filter(Boolean).join(" "))}${d.seri ? " · S/N " + esc(d.seri) : ""}</div></div>
      <span class="durum ${durum === null ? "yok" : (durum ? "ok" : "bak")}">${dTxt}</span></div>
    <div class="kutu">
      <div><small>Kalibrasyon sertifika no</small><b>${esc(d.sert || "—")}</b></div>
      <div><small>Kabul kriteri</small><b>${esc(kritTxt || "—")}</b></div>
      <div><small>Kalibrasyon tarihi</small><b>${fmt(d.kt)}</b></div>
      <div><small>Gelecek kalibrasyon</small><b>${fmt(d.next)}</b></div>
    </div>
    ${tables}
    ${/otomatik/.test(norm(d.olcDurum || "")) ? `<div class="uyar">UYARI: Bu değerler sertifikadan otomatik okundu, henüz kontrol edilmedi.</div>` : ""}
    ${/yeni sertifika/.test(norm(d.olcDurum || "")) ? `<div class="uyar">UYARI: Sertifika yenilenmiş, bu değerler eski sertifikaya ait olabilir.</div>` : ""}
    <div class="not">ℹ️ ${esc(kul)} Ölçülen değerler ve belirsizlikler (U, k=2) yukarıdaki kalibrasyon sertifikasına aittir; ${olcumTum ? "hata = cihaz okuması − referans değer" : "hata = ölçülen − set"}.</div>
    <div class="alt2"><span class="form">F7.10-43 · 21.11.2019 · REV:1</span><span class="imza"><b>${esc(CONFIG.PERSONEL)}</b>Lab. Personeli</span></div>
  </div>`;
}
function parseFilter(s){
  const toks = s.split(/[\s,;]+/).filter(Boolean).map(t => t.toLocaleLowerCase("tr"));
  const num2 = id => { const m = String(id).match(/\d+/); return m ? +m[0] : NaN; };
  return id => toks.some(t => {
    const m = t.match(/^(\d+)-(\d+)$/);
    if(m){ const n = num2(id); return n >= +m[1] && n <= +m[2]; }
    const k = id.toLocaleLowerCase("tr");
    return k === t || k.startsWith(t + "/") || DEV[id].ad.toLocaleLowerCase("tr").includes(t) || MEAS[id].some(m => m.tur.toLocaleLowerCase("tr") === t);
  });
}
function draw(){
  const f = $("#flt").value.trim();
  const ids = (f ? IDS.filter(parseFilter(f)) : IDS).slice(0, 60);
  $("#list").innerHTML = ids.map(report).join("");
  $("#msg").textContent = ids.length ? "" : (f && DEV[f.split(/[\s,;]+/)[0]] ? "Bu cihaz için ölçüm değerleri henüz girilmemiş ya da okunamamış (Ölçümler sekmesine bakın)." : (IDS.length ? "Bu filtreyle rapor bulunamadı." : "Ölçümler sekmesinde henüz ölçüm değeri yok."));
}
(async function(){
  try{
    await load();
    $("#cnt").textContent = IDS.length + " cihaz";
    const q = new URLSearchParams(location.search).get("id");
    if(q) $("#flt").value = q;
    draw();
  }catch(e){ $("#msg").innerHTML = "Veriler alınamadı.<br><small>" + esc(e.message) + "</small>"; }
})();
</script>
