<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Ölçüm ve Kullanım Raporu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#111}
.top{background:#14305e;color:#fff;padding:14px;font-size:18px;font-weight:bold}
.top span{font-weight:normal;font-size:13px;opacity:.85;margin-left:6px}
.tool{background:#fff;padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd}
.tool input{flex:1;min-width:180px;font:15px Arial;padding:10px;border:1px solid #bbb;border-radius:8px}
.tool button{padding:10px 14px;border:0;border-radius:8px;background:#e31e24;color:#fff;font-weight:bold;font-size:14px}
.tool button.g{background:#14305e}
#msg{padding:14px;color:#666;text-align:center;font-size:14px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:14px;max-width:1100px;margin:0 auto;justify-items:center}
.rep{width:98mm;max-width:100%;background:#fff;border:.35mm solid #111;font-size:3.3mm;display:flex;flex-direction:column}
.rep table{width:100%;border-collapse:collapse}
.rep td,.rep th{border:.3mm solid #111;padding:1.1mm 1.6mm;vertical-align:middle}
.rep .hd td{height:17mm;text-align:center;padding:2mm}
.rep .hd img{height:12mm}
.rep .ttl td{text-align:center;font-weight:bold;font-size:3.8mm;padding:2mm}
.rep .lbl{font-weight:bold;width:40%}
.rep .sp td{height:3.2mm;padding:0}
.rep th{font-size:2.7mm;font-weight:bold;text-align:center;padding:1.4mm}
.rep td.c{text-align:center}
.rep .sign{padding:3mm 4mm 2mm;text-align:right;font-size:3mm;min-height:20mm;display:flex;flex-direction:column;justify-content:flex-end;gap:.5mm}
.rep .form{font-size:2.2mm;padding:1mm 2mm;color:#333}
.rep .warn{color:#b00020;font-size:2.8mm;padding:1.5mm 2mm}
@media print{
  body{background:#fff}.top,.tool,#msg{display:none}
  #list{display:grid;grid-template-columns:repeat(2,98mm);gap:4mm;padding:0;justify-content:center;max-width:none}
  .rep{break-inside:avoid}
  @page{size:A4;margin:6mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="top">Cihaz Ölçüm ve Kullanım Raporları <span id="cnt"></span></div>
<div class="tool">
  <input id="flt" placeholder="Filtre: KK-97, 95-120, etüv (boş = hepsi)">
  <button onclick="draw()">Göster</button>
  <button class="g" onclick="window.print()">Yazdır / PDF</button>
</div>
<div id="msg">Yükleniyor…</div>
<div id="list"></div>

/* =================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s ?? "").toString().toLocaleLowerCase("tr").trim();
const pad = n => String(n).padStart(2,"0");
const fmt = d => d ? `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}` : "";
function idOf(c){ if(!c || c.v == null) return ""; return typeof c.v === "number" ? String(c.v) : String(c.v).trim(); }
function txt(c){ return c && c.v != null ? String(c.f ?? c.v).trim() : ""; }
function num(c){ if(!c || c.v == null || c.v === "") return NaN; return typeof c.v === "number" ? c.v : parseFloat(String(c.v).replace(",", ".")); }
function parseDate(c){
  if(!c || c.v == null || c.v === "") return null; const v = c.v;
  if(typeof v === "string"){
    let m = v.match(/^Date\((\d+),(\d+),(\d+)/); if(m) return new Date(+m[1], +m[2], +m[3]);
    m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/); if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  } return null;
}
const addDays = (d,n) => { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate()+n); return r; };
// Excel ROUND gibi: .5 sıfırdan uzağa yuvarlanır (70,5 → 71 ; -4,5 → -5)
const rnd = x => Math.sign(x) * Math.round(Math.abs(x) + 1e-9);
// Girilecek değer = set − (ölçülen − set) = 2 × set − ölçülen  (firma çizelgesi: =G4-(I4-G4))
const girilecek = (set, olc) => rnd(2*set - olc);

async function sheet(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url, {cache:"no-store"}); if(!res.ok) throw new Error(name + " sekmesi okunamadı");
  const t = await res.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
  const idx = {}; j.table.cols.forEach((c,i)=>{ idx[norm(c.label)] = i; });
  return {rows:j.table.rows.filter(r=>r.c), idx};
}
let DEV = {}, MEAS = {}, IDS = [];
async function load(){
  const [c, o] = await Promise.all([sheet(CONFIG.CIHAZ_SEKME), sheet(CONFIG.OLCUM_SEKME)]);
  const g = (r,key) => { const i = c.idx[key]; return i === undefined ? null : r.c[i]; };
  c.rows.forEach(r => {
    const id = idOf(g(r,"kayıt no")); if(!id) return;
    const kt = parseDate(g(r,"kalibrasyon tarihi")), kp = num(g(r,"kalibrasyon periyodu (ay)"));
    let next = parseDate(g(r,"sonraki kalibrasyon"));
    if(!next && kt && kp) next = addDays(kt, Math.round(kp*365/12));
    DEV[id] = {id, ad:txt(g(r,"cihaz adı")), marka:txt(g(r,"marka")), model:txt(g(r,"model")), seri:txt(g(r,"seri numarası")), sert:txt(g(r,"sertifika no")), kt, next};
  });
  const oi = k => o.idx[k];
  o.rows.forEach(r => {
    const id = idOf(r.c[oi("kayıt no")]); if(!id) return;
    const set = num(r.c[oi("set değeri")]), olc = num(r.c[oi("ölçülen değer")]);
    if(isNaN(set) || isNaN(olc)) return;
    const unit = oi("birim") === undefined ? "°C" : (txt(r.c[oi("birim")]) || "°C");
    (MEAS[id] = MEAS[id] || []).push({set, olc, unit});
  });
  IDS = Object.keys(MEAS).filter(id => DEV[id]);
}
function report(id){
  const d = DEV[id], rows = (MEAS[id] || []).slice().sort((a,b)=>a.set-b.set), unit = rows[0] ? rows[0].unit : "°C";
  const body = rows.map(m => `<tr><td class="c">${rnd(m.set)}</td><td class="c">${rnd(m.olc)}</td><td class="c"><b>${girilecek(m.set,m.olc)}</b></td></tr>`).join("");
  return `<div class="rep">
    <table class="hd"><tr><td><img src="${CONFIG.LOGO}" alt="Seval Kablo"></td></tr></table>
    <table class="ttl"><tr><td>CİHAZ ÖLÇÜM VE KULLANIM RAPORU</td></tr></table>
    <table>
      <tr><td class="lbl">Cihaz Adı</td><td>${esc(d.ad)}</td></tr>
      <tr><td class="lbl">Cihaz Marka</td><td>${esc(d.marka)}</td></tr>
      <tr><td class="lbl">Cihaz Model</td><td>${esc(d.model)}</td></tr>
      <tr><td class="lbl">Cihaz Seri No</td><td>${esc(d.seri)}</td></tr>
      <tr><td class="lbl">Kayıt Kodu</td><td>${esc(d.id)}</td></tr>
    </table>
    <table class="sp"><tr><td></td></tr></table>
    <table>
      <tr><th>KALİB. SERTİFİKA NO</th><th>KALİBRASYON TARİHİ</th><th>GEL. KALİBRASYON TARİHİ</th></tr>
      <tr><td class="c">${esc(d.sert)}</td><td class="c">${fmt(d.kt)}</td><td class="c">${fmt(d.next)}</td></tr>
    </table>
    <table class="sp"><tr><td></td></tr></table>
    <table>
      <tr><th>CİHAZ SET DEĞERİ ${esc(unit)}</th><th>ÖLÇÜLEN DEĞER ${esc(unit)}</th><th>GİRİLECEK DEĞER ${esc(unit)}</th></tr>
      ${body}
    </table>
    <div class="sign"><span>${esc(CONFIG.PERSONEL)}</span><span>Lab. Personeli</span></div>
    <div class="form">F7.10-43  21.11.2019 REV:1</div>
  </div>`;
}
function parseFilter(s){
  const toks = s.split(/[\s,;]+/).filter(Boolean).map(t => t.toLocaleLowerCase("tr"));
  const num2 = id => { const m = String(id).match(/\d+/); return m ? +m[0] : NaN; };
  return id => toks.some(t => {
    const m = t.match(/^(\d+)-(\d+)$/);
    if(m){ const n = num2(id); return n >= +m[1] && n <= +m[2]; }
    const k = id.toLocaleLowerCase("tr");
    return k === t || k.startsWith(t + "/") || DEV[id].ad.toLocaleLowerCase("tr").includes(t);
  });
}
function draw(){
  const f = $("#flt").value.trim();
  const ids = (f ? IDS.filter(parseFilter(f)) : IDS).slice(0, 60);
  $("#list").innerHTML = ids.map(report).join("");
  $("#msg").textContent = ids.length ? "" : (IDS.length ? "Bu filtreyle rapor bulunamadı." : "Ölçümler sekmesinde henüz ölçüm değeri yok.");
}
(async function(){
  try{
    await load();
    $("#cnt").textContent = IDS.length + " cihaz";
    const q = new URLSearchParams(location.search).get("id");
    if(q) $("#flt").value = q;
    draw();
  }catch(e){ $("#msg").innerHTML = "Veriler alınamadı.<br><small>" + esc(e.message) + "</small>"; }
})();
</script>
