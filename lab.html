<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratuvar – Seval Kablo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#0f172a}
.top{background:linear-gradient(135deg,#0d1b36,#1d4a85);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:19px}.top a{color:#fff;font-size:13px;opacity:.85;margin-left:12px}
.wrap{max-width:1400px;margin:0 auto;padding:12px}
.kart{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:12px}
h1{margin:0;font-size:24px;color:#14305e}.alt{color:#475569;font-size:14px;margin-top:3px}
.bas{font-weight:800;color:#14305e;font-size:15px;margin-bottom:8px}.bas small{font-weight:600;color:#64748b;font-size:12px}
.nok{width:10px;height:10px;border-radius:50%;display:inline-block}.g{background:#16a34a}.s{background:#eab308}.k{background:#dc2626}
.oda{background:linear-gradient(#f8fafc,#e5e7eb);border-radius:12px;overflow-x:auto;position:relative}.oda svg{display:block;width:100%;min-width:860px;height:auto}
.etv{cursor:pointer;transition:transform .15s ease,filter .15s ease;transform-box:fill-box;transform-origin:50% 100%}.etv:hover{transform:scale(1.06);filter:drop-shadow(0 6px 10px rgba(20,48,94,.3))}
#ipucu{display:none;position:absolute;z-index:10;width:300px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.25);padding:10px 12px;font-size:12.5px;pointer-events:none}
.sat{display:grid;grid-template-columns:18px 90px 1fr 1.2fr;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;align-items:center}.sat a{color:#14305e;font-weight:700}
.lej{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#475569;margin-top:8px}
.msg{color:#64748b;font-size:13px}
</style></head><body>
<div class="top"><b>🔬 Laboratuvar</b><span><a href="lab3d.html" style="background:#b88b36;border-radius:16px;padding:5px 12px;opacity:1">🧊 3B gez</a><a href="park.html">🏭 Seval Park</a><a href="index.html">Kontrol merkezi</a></span></div>
<div class="wrap" id="app"><div class="msg">Yükleniyor…</div></div>
<script>
const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A";
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim(), key = s => String(s ?? "").trim().replace(/\s+/g, "").replace(/\//g, "-").toLocaleUpperCase("tr");
// ---------- Ar-Ge binası (karantina sahasının yanında, 2 kat) ----------
const BINA = { "LAB-ARGE":{ kat:"2. kat", ad:"Ar-Ge laboratuvarı · etüv odası ve depo" }, "LAB-CPR":{ kat:"Alt kat", ad:"CPR laboratuvarı" } };
// etüv odası: soldan sağa sütunlar, [üst raf, alt raf]
const ETUV_ODASI = [["KK-147"], ["KK-146"], ["KK-118", "KK-116"], ["KK-115", "KK-99"], ["KK-100", "KK-117"], ["KK-97", "KK-23"], ["KK-14", "KK-85"], ["KK-05"], ["KK-151", "KK-22"]];
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label)); return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0)) : null; };
const fz = d => d ? d.toLocaleDateString("tr-TR") : "–", fzs = d => d ? d.toLocaleDateString("tr-TR") + " " + d.toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit" }) : "–";
const RENK = { g:"#16a34a", s:"#eab308", k:"#dc2626" };
function etuvCiz(x, y, w, h, c, t){   // önden etüv: gövde, kontrol paneli, pencere; test sürüyorsa pencere turuncu
  const mdl = norm(c ? c.model : ""), vak = /ev\s*0?18/.test(mdl), ster = /fn\s*120/.test(mdl), f = n => +n.toFixed(1);
  const pw = w * (ster ? .18 : .26), gz = t ? "#fb923c" : "#94a3b8";
  let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>`;
  s += `<rect x="${f(x + 3)}" y="${f(y + 3)}" width="${f(pw)}" height="${f(h - 6)}" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>`;
  s += `<rect x="${f(x + 3 + pw * .18)}" y="${f(y + h * .16)}" width="${f(pw * .64)}" height="${f(h * .16)}" rx="2" fill="#0f172a"/><text x="${f(x + 3 + pw / 2)}" y="${f(y + h * .28)}" font-size="${f(h * .1)}" text-anchor="middle" fill="${t ? "#4ade80" : "#64748b"}" font-family="monospace" font-weight="700">${t ? esc(String(t.sicaklik || "").replace(/\s*°C/, "")) : "---"}</text>`;
  s += `<circle cx="${f(x + 3 + pw / 2)}" cy="${f(y + h * .5)}" r="${f(Math.min(pw, h) * .14)}" fill="#3b82f6"/>`;
  const wx = x + pw + 3 + (w - pw - 6) * .22, ww = (w - pw - 6) * .56, wy = y + h * (vak ? .12 : .2), wh = h * (vak ? .42 : .52);
  s += `<rect x="${f(wx)}" y="${f(wy)}" width="${f(ww)}" height="${f(wh)}" rx="2" fill="${t ? "#fed7aa" : "#cbd5e1"}" stroke="${gz}" stroke-width="1.6"/>`;
  if(vak) s += `<circle cx="${f(x + w * .62)}" cy="${f(y + h * .78)}" r="${f(h * .1)}" fill="#fff" stroke="#475569"/>`;
  s += `<rect x="${f(x + pw + 6)}" y="${f(y + h * .4)}" width="${f(w * .04)}" height="${f(h * .2)}" fill="#1f2937"/>`;
  return s;
}
async function yukle(){
  const id = (new URLSearchParams(location.search).get("id") || "LAB-ARGE").toUpperCase();
  let C = [], ET = [], K = [];
  try{ [C, ET, K] = await Promise.all([sekme("Cihazlar"), sekme("Etuv_Testleri").catch(() => []), sekme("Karne").catch(() => [])]); }
  catch(e){ $("#app").innerHTML = `<div class="msg">Veriler alınamadı: ${esc(e.message)}</div>`; return; }
  const g = new Date(); g.setHours(0, 0, 0, 0); const yak = d => d && d >= g && (d - g) / 864e5 <= 30;
  const kal = new Set(K.filter(r => !v(r["bitiş"]) && v(r["tür"]) === "Kalibrasyon").map(r => key(v(r["kayıt no"]))));
  const ariz = new Set(K.filter(r => !v(r["bitiş"]) && /^(Arıza|Tamir)$/.test(v(r["tür"]))).map(r => key(v(r["kayıt no"]))));
  const T = C.map(r => { const c = { id:v(r["kayıt no"]), ad:v(r["cihaz adı"]), marka:v(r["marka"]), model:v(r["model"]), yer:v(r["bulunduğu yer"]), kn:tar(r["sonraki kalibrasyon"]), dn:tar(r["sonraki doğrulama"]), ds:v(r["doğrulama sonucu"]) };
    const n = []; if(ariz.has(key(c.id))) n.push("arızada"); if(c.kn && c.kn < g) n.push("kalibrasyon süresi geçti"); if(c.dn && c.dn < g) n.push("doğrulama süresi geçti"); if(/RAPORUNA|OLUMSUZ/i.test(c.ds)) n.push("ölçüm raporuna bakınız");
    c.renk = n.length ? "k" : kal.has(key(c.id)) || yak(c.kn) || yak(c.dn) ? "s" : "g";
    c.neden = n.join(" · ") || (kal.has(key(c.id)) ? "kalibrasyonda" : yak(c.kn) ? "kalibrasyon " + fz(c.kn) + " (yaklaşıyor)" : yak(c.dn) ? "doğrulama " + fz(c.dn) + " (yaklaşıyor)" : "kullanıma hazır"); return c; }).filter(c => c.id);
  const bul = k => T.find(c => key(c.id) === key(k) || key(c.id) === key(k.replace(/-0+(\d)/, "-$1")));
  const lab = T.filter(c => { const t = String(c.yer || "").toLocaleUpperCase("tr").split(/[-\s]+/); return (t[1] ? "LAB-" + t[1] : t[0]) === id; });
  const test = {}; ET.forEach(r => { if(v(r["durum"]) === "Devam" && !v(r["bitiş"])) test[key(v(r["kayıt no"]))] = { no:v(r["test no"]), tip:v(r["test tipi"]), sicaklik:v(r["test sıcaklığı (°c)"]) ? v(r["test sıcaklığı (°c)"]) + " °C" : "", bas:tar(r["başlangıç"]), bit:tar(r["planlanan bitiş"]), num:v(r["numuneler"]), kim:v(r["başlatan"]), guc:parseFloat(v(r["güç (w)"]).replace(",", ".")) || 0, urun:v(r["ürün / kablo kodu"]), lot:v(r["lot / mps"]), std:v(r["standart"]) }; });
  const say = { g:0, s:0, k:0 }; lab.forEach(c => say[c.renk]++);
  // bina kesiti
  const binaSvg = `<svg viewBox="0 0 420 150" style="width:100%;max-width:520px;display:block">
    <rect x="10" y="20" width="60" height="120" fill="#e2e8f0" stroke="#94a3b8"/><text x="40" y="84" font-size="10" text-anchor="middle" fill="#475569" transform="rotate(-90 40 80)">Karantina sahası</text>
    ${[["LAB-ARGE", 20, "2. kat · Depo | Etüv odası"], ["LAB-CPR", 82, "Alt kat · LAB-CPR"]].map(([k, y, t]) => `<a href="lab.html?id=${k}"><rect x="90" y="${y}" width="310" height="56" rx="4" fill="${k === id ? "#fef3c7" : "#f8fafc"}" stroke="${k === id ? "#b88b36" : "#94a3b8"}" stroke-width="${k === id ? 2.5 : 1.2}"/>
      ${k === "LAB-ARGE" ? `<line x1="170" y1="${y}" x2="170" y2="${y + 56}" stroke="#94a3b8"/><text x="130" y="${y + 33}" font-size="11" text-anchor="middle" fill="#475569">Depo</text><text x="285" y="${y + 33}" font-size="12" text-anchor="middle" font-weight="700" fill="#14305e">Etüv odası</text>` : `<text x="245" y="${y + 33}" font-size="12" text-anchor="middle" font-weight="700" fill="#14305e">CPR laboratuvarı</text>`}
      <text x="396" y="${y + 13}" font-size="9" text-anchor="end" fill="#64748b">${t.split(" · ")[0]}</text></a>`).join("")}</svg>`;
  // etüv odası (yalnız LAB-ARGE)
  let oda = "";
  if(id === "LAB-ARGE"){
    const CW = 104, X0 = 24, Y1 = 40, Y2 = 186, EH = 92, W = X0 * 2 + CW * ETUV_ODASI.length;
    let s = `<rect x="0" y="0" width="${W}" height="316" fill="#f1f5f9"/><rect x="0" y="292" width="${W}" height="24" fill="#e2e8f0"/>`;
    [Y1 + EH + 4, Y2 + EH + 4].forEach(y => s += `<rect x="${X0 - 8}" y="${y}" width="${W - 2 * X0 + 16}" height="8" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>`);
    for(let i = 0; i <= ETUV_ODASI.length; i += 3) s += `<rect x="${X0 - 8 + i * CW - (i === ETUV_ODASI.length ? 0 : 0)}" y="${Y1 - 8}" width="7" height="${Y2 + EH + 22 - Y1}" fill="#f8fafc" stroke="#cbd5e1"/>`;
    ETUV_ODASI.forEach((kol, i) => kol.forEach((kod, j) => { const c = bul(kod), t = c ? test[key(c.id)] : null, x = X0 + i * CW + 6, y = j ? Y2 : Y1, w = CW - 12;
      const ster = c && /fn\s*120/i.test(c.model), eh = ster ? EH * .8 : EH;
      s += `<g class="etv" data-id="${esc(c ? c.id : kod)}">${etuvCiz(x, y + (EH - eh), w, eh, c, t)}
        <rect x="${x + w - 42}" y="${y + (EH - eh) - 14}" width="44" height="14" rx="7" fill="${t ? "#16a34a" : "#94a3b8"}"/><text x="${x + w - 20}" y="${y + (EH - eh) - 4}" font-size="8.5" font-weight="800" text-anchor="middle" fill="#fff">${t ? "TEST" : "BOŞ"}</text>
        <circle cx="${x + 6}" cy="${y + (EH - eh) - 7}" r="5" fill="${c ? RENK[c.renk] : "#cbd5e1"}" stroke="#fff" stroke-width="1.2"/>
        <text x="${x + w / 2}" y="${y + EH + 26}" font-size="12" font-weight="800" text-anchor="middle" fill="#14305e">${esc(c ? c.id : kod)}</text></g>`; }));
    const aktif = ETUV_ODASI.flat().filter(k => { const c = bul(k); return c && test[key(c.id)]; }).length;
    oda = `<div class="kart"><div class="bas">🧪 Etüv odası <small>· 2. kat · önden görünüm · ${ETUV_ODASI.flat().length} etüv · ${aktif} tanesinde test sürüyor</small></div>
      <div class="oda"><svg viewBox="0 0 ${W} 316">${s}</svg><div id="ipucu"></div></div>
      <div class="lej"><span><b style="color:#16a34a">TEST</b> içinde test sürüyor (pencere turuncu)</span><span><b style="color:#64748b">BOŞ</b> etüv boş</span><span><span class="nok g"></span> hazır</span><span><span class="nok s"></span> tarihi yaklaşan / kalibrasyonda</span><span><span class="nok k"></span> uygunsuz / tarihi geçmiş</span></div></div>`;
  }
  $("#app").innerHTML = `<div class="kart" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center"><div><h1>${esc(id)}</h1><div class="alt">${esc((BINA[id] || {}).ad || "Laboratuvar")}${BINA[id] ? " · " + BINA[id].kat + " · karantina sahasının yanında" : ""}</div>
      <div class="alt" style="margin-top:8px"><b>${lab.length} cihaz</b> · <span class="nok g"></span> ${say.g} · <span class="nok s"></span> ${say.s} · <span class="nok k"></span> ${say.k}</div></div>${BINA[id] ? binaSvg : ""}</div>
    ${oda}
    <div class="kart"><div class="bas">Laboratuvardaki cihazlar (${lab.length})</div>${lab.sort((a, b) => ({ k:0, s:1, g:2 }[a.renk] - { k:0, s:1, g:2 }[b.renk]) || a.id.localeCompare(b.id, "tr", { numeric:true })).map(c => `<div class="sat"><span class="nok ${c.renk}"></span><a href="cihaz.html?id=${encodeURIComponent(c.id)}">${esc(c.id)}</a><span>${esc(c.ad)}${c.marka ? " · " + esc(c.marka) : ""}${c.model ? " " + esc(c.model) : ""}</span><span style="color:#64748b">${esc(c.neden)}${test[key(c.id)] ? " · 🧪 test sürüyor" : ""}</span></div>`).join("") || '<div class="msg">Kayıtlı cihaz yok.</div>'}</div>`;
  document.querySelectorAll(".etv").forEach(e => { const c = bul(e.dataset.id), t = c ? test[key(c.id)] : null;
    e.onclick = () => location.href = "cihaz.html?id=" + encodeURIComponent(e.dataset.id);
    e.onmousemove = ev => { const p = $("#ipucu"), k = p.parentNode.getBoundingClientRect();
      p.innerHTML = `<b style="font-size:14px;color:#14305e">${esc(e.dataset.id)}</b> · ${esc(c ? (c.marka + " " + c.model).trim() : "")}<br><span class="nok ${c ? c.renk : "g"}"></span> ${esc(c ? c.neden : "kayıt bulunamadı")}
        ${c ? `<br><small style="color:#64748b">Kalibrasyon: ${fz(c.kn)} · Doğrulama: ${fz(c.dn)}</small>` : ""}
        ${t ? `<hr style="border:0;border-top:1px solid #e2e8f0;margin:6px 0"><b style="color:#16a34a">🧪 ${esc(t.no)} · ${esc(t.tip)} · ${esc(t.sicaklik)}</b><br>Başlangıç ${fzs(t.bas)} · bitiş ${fzs(t.bit)}${t.urun || t.lot ? `<br>📦 ${esc([t.urun, t.lot, t.std].filter(Boolean).join(" · "))}` : ""}${t.guc && t.bas ? `<br>⚡ Şu ana kadar ${(t.guc * (new Date() - t.bas) / 36e5 / 1000).toLocaleString("tr-TR", { maximumFractionDigits:1 })} kWh (${t.guc} W)` : ""}<div style="white-space:pre-line;background:#f8fafc;border-radius:6px;padding:5px 7px;margin-top:4px">${esc(t.num)}</div>` : '<div style="margin-top:4px;color:#64748b">Etüv boş</div>'}`;
      p.style.display = "block"; let x = ev.clientX - k.left + 14, y = ev.clientY - k.top + 14; if(x + 310 > k.width) x = ev.clientX - k.left - 314; if(y + p.offsetHeight > k.height) y = Math.max(4, ev.clientY - k.top - p.offsetHeight - 10);
      p.style.left = x + "px"; p.style.top = y + "px"; };
    e.onmouseleave = () => $("#ipucu").style.display = "none"; });
}
yukle();
</script></body></html>
