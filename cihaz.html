<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Kartı</title>
<style>
:root{--navy:#14305e;--red:#e31e24;--gray:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#222}
.wrap{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.main{padding:14px 14px 18px;flex:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.head img{height:48px;max-width:58%}
.head .t{text-align:right}
.head .t b{display:block;color:var(--navy);font-size:21px;letter-spacing:.3px}
.head .t span{color:var(--gray);font-size:14px}
.head .t span i{color:var(--red);font-style:normal;font-weight:bold;font-size:17px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.info{display:flex;gap:12px}
.photo{width:92px;min-width:92px;height:120px;border-radius:10px;background:#f1f4f9;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px}
.photo img{width:100%;height:100%;object-fit:contain}
.dchip{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:bold;font-size:12.5px;background:#eceff3;color:#555}
.dchip.ok{background:#e1f3e5;color:#1b8a3a}
.dchip.bad{background:#fdeaea;color:#c62828}
.photo svg{width:100%;height:100%;padding:6px}
.rows{flex:1;min-width:0}
.row{display:flex;gap:6px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13.5px}
.row:last-child{border:0}
.row .k{width:42%;color:var(--navy);font-weight:bold}
.row .v{flex:1;word-break:break-word}
.st{display:flex;gap:10px;border-radius:14px;padding:10px;margin-bottom:12px;border:1px solid var(--bd);background:var(--bg)}
.st .side{width:30%;min-width:96px;text-align:center;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.st .side .ic{line-height:0}
.st .side .nm{font-weight:bold;font-size:13px;line-height:1.2}
.pill{background:var(--c);color:#fff;border-radius:8px;padding:7px 8px;font-weight:bold;font-size:12.5px;width:100%}
.st .list{flex:1;min-width:0}
.st .row{border-bottom:1px solid rgba(0,0,0,.07);align-items:center}
.st .row .k{width:56%;font-weight:normal;color:#333}
.st .row .v{text-align:right;font-weight:bold}
.st .row .v.c{color:var(--c)}
.chip{display:inline-block;background:var(--bd);color:var(--c);border-radius:12px;padding:3px 10px}
.firm{background:#f3f6fb;border-color:#dfe6f3}
.firm .row .k{width:48%}
.dt{color:var(--navy);font-weight:bold;font-size:13px;margin-bottom:8px;letter-spacing:.5px}
.doc{display:flex;justify-content:space-between;align-items:center;padding:12px;margin-top:8px;border:1px solid #dfe6f3;background:#f3f6fb;border-radius:10px;color:var(--navy);font-weight:bold;font-size:14px;text-decoration:none}
.foot{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11.5px;color:var(--gray)}
.foot b{display:block;color:#333;font-size:13px}
.foot .sep{width:1px;align-self:stretch;background:var(--line)}
.bar{background:var(--navy);color:#fff;display:flex;justify-content:space-around;align-items:center;padding:14px 8px;font-size:13.5px}
.bar a{color:#fff;text-decoration:none}
.msg{text-align:center;padding:40px 12px;color:var(--gray);font-size:15px}
.msg b{color:var(--red)}
#pdfg{position:fixed;inset:0;background:#1f2937;z-index:90;display:flex;flex-direction:column}
#pdfg .pg-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d1b36;color:#fff;padding:10px 12px}
#pdfg .pg-bar b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdfg .pg-bar button{background:#fff;color:#0d1b36;border:0;border-radius:8px;padding:7px 11px;margin-left:6px;font-weight:700;font-size:13px}
#pdfg .pg-ic{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
#pdfg canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:100%}
#pdfg .pg-msg{color:#fff;margin-top:40px;text-align:center;font-size:15px}
#pdfg .xlk{background:#fff;border-radius:8px;padding:12px;width:min(1100px,100%);overflow-x:auto;box-sizing:border-box}
#pdfg .xlu{background:#fef3c7;color:#92400e;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px}
#pdfg .xlk h4{margin:12px 0 6px;color:#14305e;font-size:14px}
#pdfg table.xl{border-collapse:collapse;font-size:12px;min-width:100%}#pdfg table.xl td{border:1px solid #d5dbe5;padding:4px 6px;white-space:nowrap}
#pdfg table.xl tr:first-child td{background:#14305e;color:#fff;font-weight:700}#pdfg table.xl tr.v td{background:#e0f2fe;font-weight:700}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s ?? "").toString().toLocaleLowerCase("tr").trim();
const pad = n => String(n).padStart(2, "0");
const fmt = d => d ? `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}` : "-";

function parseDate(c){
  if(!c || c.v == null || c.v === "") return null;
  const v = c.v;
  if(typeof v === "string"){
    let m = v.match(/^Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
    m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  }
  return null;
}
function addDays(d, n){ const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() + n); return r; }
// Firma listesi kuralı: kalibrasyon = ay x 365/12 gün (yuvarlanır), doğrulama = ay x 30 gün (12 ay = 365 gün)
const nextKal = (d, m) => addDays(d, Math.round(m * 365 / 12));
const nextDog = (d, m) => addDays(d, m === 12 ? 365 : m * 30);
function addMonths(d, n){
  const r = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last));
  return r;
}
function daysLeft(d){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

async function loadRecord(id){
  if(CONFIG.SHEET_ID.startsWith("BURAYA")){
    // Önizleme (demo) modu: Sheet ID girilmediyse örnek veri gösterilir
    return { ad:"Dijital Multimetre", seri:"3957012345", model:"Fluke 87V", yer:"Kalite Laboratuvarı - Lab 01", marka:"Fluke",
      kalTar:new Date(2026,5,15), kalPer:12, dogTar:new Date(2026,11,15), dogPer:6, kalNext:null, dogNext:null,
      firma:"SEVAL KABLO KALİBRASYON HİZMETLERİ", sert:"SK-KAL-2026-0158", foto:"", durum:"UYGUN", sertLink:"https://example.com/sertifika.pdf", dogForm:"https://example.com/dogrulama.pdf", talimat:"https://example.com/talimat.pdf", demo:true };
  }
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_ADI)}`;
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("Veri alınamadı");
  const t = await res.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
  const idx = {};
  j.table.cols.forEach((c,i)=>{ idx[norm(c.label)] = i; });
  const ci = {};
  for(const k in COLS){ ci[k] = idx[COLS[k]]; }
  if(ci.kayit === undefined) throw new Error("Sayfada 'Kayıt No' sütunu bulunamadı");
  const row = j.table.rows.find(r => r.c && r.c[ci.kayit] && idOf(r.c[ci.kayit]) === String(id).trim());
  if(!row){   // eski QR etiketi (AK-01, KN-06/1, YZ-01…): "Eski Kayıt No" sütunundan yeni numaraya yönlendir
    const ie = idx["eski kayıt no"];
    const r2 = ie === undefined ? null : j.table.rows.find(r => r.c && r.c[ie] && String(r.c[ie].v ?? "").trim() === String(id).trim());
    if(r2 && r2.c[ci.kayit]){ location.replace(location.pathname + "?id=" + encodeURIComponent(idOf(r2.c[ci.kayit]))); return new Promise(() => {}); }
    return null;
  }
  const g = k => ci[k] === undefined ? null : row.c[ci[k]];
  return {
    ad:txt(g("ad")), seri:txt(g("seri")), model:txt(g("model")), yer:txt(g("yer")), marka:txt(g("marka")),
    kalTar:parseDate(g("kalTar")), kalPer:Number(g("kalPer")?.v)||0,
    dogTar:parseDate(g("dogTar")), dogPer:Number(g("dogPer")?.v)||0,
    kalNext:parseDate(g("kalNext")), dogNext:parseDate(g("dogNext")),
    firma:txt(g("firma")), sert:txt(g("sert")), foto:txt(g("foto")),
    sertLink:txt(g("sertLink")), dogForm:txt(g("dogForm")), talimat:txt(g("talimat")),
    vidTr:txt(g("vidTr")), vidEn:txt(g("vidEn")), durum:(s => /^\s*olumsuz\s*$/i.test(String(s || "")) ? "Ölçüm raporuna bakınız" : String(s || "").trim())(txt(g("durum"))),
    aralik:txt(g("aralik")), coz:txt(g("coz")), uretici:txt(g("uretici")), dogTal:txt(g("dogTal")), etiket:txt(g("etiket"))
  };
}

function statusBlock(title, icon, dateLabel, perLabel, nextLabel, remLabel, date, per, base, nextExplicit, calc){
  if(!date) return "";
  const next = nextExplicit || (per ? calc(date, per) : null);
  const left = next ? daysLeft(next) : null;
  let c = base.c, bg = base.bg, bd = base.bd, pill = "GEÇERLİ";
  if(left !== null){
    if(left < 0){ c="#c62828"; bg="#fdf1f1"; bd="#f5c6c6"; pill="SÜRESİ DOLDU"; }
    else if(left <= 30){ c="#d98200"; bg="#fff8ec"; bd="#fadfb0"; pill="YAKLAŞIYOR"; }
  }
  const state = pill === "GEÇERLİ" ? "ok" : (pill === "YAKLAŞIYOR" ? "warn" : "bad");
  const remTxt = left === null ? "-" : (left < 0 ? `${-left} gün geçti` : `${left} Gün`);
  return `
  <div class="st" style="--c:${c};--bg:${bg};--bd:${bd}">
    <div class="side"><div class="ic">${stIcon(icon, state, c)}</div><div class="nm">${title}</div><div class="pill">${pill}</div></div>
    <div class="list">
      <div class="row"><span class="k">${dateLabel}</span><span class="v">${fmt(date)}</span></div>
      <div class="row"><span class="k">${nextLabel}</span><span class="v c">${fmt(next)}</span></div>
      <div class="row"><span class="k">${perLabel}</span><span class="v">${per ? per + " Ay" : "-"}</span></div>
      <div class="row"><span class="k">${remLabel}</span><span class="v"><span class="chip">${remTxt}</span></span></div>
    </div>
  </div>`;
}

/* ===== Sayfa içi PDF görüntüleyici (şifreli belgeler indirilmeden ekranda açılır) ===== */
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function pdfjsYukle(){ return window.pdfjsLib ? Promise.resolve(window.pdfjsLib) : new Promise((ok, hata) => { const s = document.createElement("script"); s.src = PDFJS_URL; s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; ok(window.pdfjsLib); }; s.onerror = () => hata(new Error("PDF görüntüleyici yüklenemedi")); document.head.appendChild(s); }); }
async function belgeGoster(istek, baslik){
  const kap = document.createElement("div"); kap.id = "pdfg";
  kap.innerHTML = `<div class="pg-bar"><b>${esc(baslik || "Belge")}</b><span><button class="pg-in">⬇ İndir</button><button class="pg-x">✕</button></span></div><div class="pg-ic"><div class="pg-msg">Belge açılıyor…</div></div>`;
  document.body.appendChild(kap); document.body.style.overflow = "hidden";
  const kapat = () => { kap.remove(); document.body.style.overflow = ""; };
  kap.querySelector(".pg-x").onclick = kapat;
  try{
    const j = await belgeVeri(istek, async o => (await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(o) })).json());
    if(!j.ok){ if(/şifre/i.test(j.hata || "")) sessionStorage.removeItem("erisimPin"); kap.querySelector(".pg-msg").textContent = "⚠ " + (j.hata || "Belge açılamadı"); return false; }
    const a = j.a;
    const blob = new Blob([a], { type: j.mime || "application/pdf" });
    kap.querySelector(".pg-in").onclick = () => { const u = URL.createObjectURL(blob), d = document.createElement("a"); d.href = u; d.download = j.ad || "belge.pdf"; document.body.appendChild(d); d.click(); d.remove(); };
    if(/sheet|excel|xls/i.test((j.mime || "") + " " + (j.ad || ""))){ await excelGoster(a.slice(), istek.id, kap.querySelector(".pg-ic")); return true; }
    if(!/pdf/i.test(j.mime || "pdf")){ kap.querySelector(".pg-msg").textContent = "Bu belge PDF değil (" + (j.ad || "") + "). İndir düğmesiyle açın."; return true; }
    const lib = await pdfjsYukle(), pdf = await lib.getDocument({ data: a.slice() }).promise, ic = kap.querySelector(".pg-ic");
    ic.innerHTML = "";
    const gen = Math.min(ic.clientWidth - 16, 1100), oran = window.devicePixelRatio || 1;
    for(let n = 1; n <= pdf.numPages; n++){
      const sayfa = await pdf.getPage(n), v0 = sayfa.getViewport({ scale:1 }), olcek = gen / v0.width, v = sayfa.getViewport({ scale: olcek * oran });

/* ===== Eski Excel doğrulama kaydı: yalnızca ilgili cihazın satırı / sayfası ===== */
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function xlsxYukle(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, hata) => { const s = document.createElement("script"); s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => hata(new Error("Excel okuyucu yüklenemedi")); document.head.appendChild(s); }); }
function kodAnahtar(s){ const t = String(s ?? "").toLocaleUpperCase("tr").replace(/[\s\-_.]/g, ""); return [t, t.replace(/^([A-ZÇĞİÖŞÜ]+)0+(\d)/, "$1$2")]; }
async function excelGoster(bayt, id, ic){
  const X = await xlsxYukle(), wb = X.read(bayt, { type:"array" }), [k1, k2] = kodAnahtar(id), es = c => { const [a, b] = kodAnahtar(c); return a && (a === k1 || b === k2); };
  const kodGibi = c => /^[A-ZÇĞİÖŞÜ]{1,4}[\s\-]?\d{1,4}(\/\d+)?$/i.test(String(c ?? "").trim());
  const tablo = (satirlar, vurgu) => { const kol = []; satirlar.forEach(r => r.forEach((c, j) => { if(String(c ?? "").trim() !== "") kol[j] = 1; }));
    const J = kol.map((v, j) => v ? j : -1).filter(j => j >= 0);
    return `<table class="xl">${satirlar.map((r, i) => `<tr class="${vurgu(i) ? "v" : ""}">${J.map(j => `<td>${esc(r[j] ?? "")}</td>`).join("")}</tr>`).join("")}</table>`; };
  let html = "";
  wb.SheetNames.forEach(ad => {
    const ws = wb.Sheets[ad], R = X.utils.sheet_to_json(ws, { header:1, raw:false, defval:"" });
    if(es(ad)){ html += `<h4>Sayfa: ${esc(ad)}</h4>` + tablo(R.filter(r => r.some(c => String(c).trim() !== "")), () => false); return; }
    const M = R.map((r, i) => r.some(es) ? i : -1).filter(i => i >= 0); if(!M.length) return;
    let bas = M[0];   // tablo başlığı: ilk eşleşmenin üstünde, içinde cihaz kodu olmayan ve en az 3 dolu hücreli satırlar (en fazla 3)
    const ust = []; for(let i = M[0] - 1; i >= 0 && ust.length < 3; i--){ const r = R[i], dolu = r.filter(c => String(c).trim() !== "").length; if(r.some(kodGibi)) { if(ust.length) break; else continue; } if(dolu >= 2) ust.unshift(i); else if(ust.length) break; }
    const alt = []; for(let i = M[M.length - 1] + 1; i < R.length && alt.length < 4; i++) if(R[i].some(c => /tarih|doğrulayan|yapan/i.test(String(c)))) alt.push(i);
    const sec = [...ust, ...M, ...alt];
    html += `<h4>Sayfa: ${esc(ad)}</h4>` + tablo(sec.map(i => R[i]), i => M.includes(sec[i]));
  });
  ic.innerHTML = `<div class="xlk"><div class="xlu">⚠ Bu cihazın doğrulaması <b>eski Excel kaydından</b> gösteriliyor (yeni formatta form yok). Yalnızca <b>${esc(id)}</b> ile ilgili satırlar/sayfalar listelenir; tüm dosya için ⬇ İndir.</div>${html || `<p>Excel dosyasında ${esc(id)} kodu bulunamadı.</p>`}</div>`;
}

// v18.7: belge önbelleği – açılan PDF cihazda saklanır; sonraki açılışta sunucu yalnızca "değişti mi" der (şifre yine sorulur)
const BELGE_IDB = { db:null,
  ac(){ return this.db || (this.db = new Promise((ok, red) => { const r = indexedDB.open("cihazBelge", 1); r.onupgradeneeded = () => r.result.createObjectStore("b"); r.onsuccess = () => ok(r.result); r.onerror = () => red(r.error); })); },
  async al(k){ try{ const d = await this.ac(); return await new Promise(ok => { const q = d.transaction("b").objectStore("b").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }catch(e){ return null; } },
  async koy(k, v){ try{ const d = await this.ac(); d.transaction("b", "readwrite").objectStore("b").put(v, k); }catch(e){} } };
async function belgeVeri(istek, post){
  const k = [istek.tur, istek.id, istek.fid || ""].join("|"), on = await BELGE_IDB.al(k);
  const j = await post(Object.assign({}, istek, on && on.fid ? { bilinen: on.fid } : {}));
  if(!j.ok) return j;
  if(j.ayni && on) return { ok:true, ad:on.ad, mime:on.mime, a:new Uint8Array(await on.blob.arrayBuffer()) };
  const bin = atob(j.veri), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  if(j.fid) BELGE_IDB.koy(k, { fid:j.fid, ad:j.ad, mime:j.mime, blob:new Blob([a], { type:j.mime || "application/pdf" }) });
  return { ok:true, ad:j.ad, mime:j.mime, a };
}

async function qrOkuyucu(kap, bulundu){
  let akis = null, h5 = null; const dur = () => { if(akis){ akis.getTracks().forEach(t => t.stop()); akis = null; } if(h5){ try{ h5.stop(); }catch(e){} h5 = null; } };
  kap.innerHTML = `<video playsinline muted style="width:100%;max-height:45vh;background:#000;border-radius:10px"></video><div id="h5q"></div><div style="font-size:13px;color:#475569;margin-top:4px">QR'ı kameraya tutun…</div>`;
  const vd = kap.querySelector("video"), bitti = x => { dur(); kap.innerHTML = ""; bulundu(x); };
  if("BarcodeDetector" in window){ try{ const det = new BarcodeDetector({ formats:["qr_code"] }); akis = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }); vd.srcObject = akis; await vd.play();
      const dongu = async () => { if(!akis) return; try{ const s = await det.detect(vd); if(s.length){ bitti(s[0].rawValue); return; } }catch(e){} requestAnimationFrame(dongu); }; dongu(); return dur; }catch(e){ dur(); } }
  vd.style.display = "none";
  try{ if(!window.Html5Qrcode) await new Promise((ok, red) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"; s.onload = ok; s.onerror = () => red(new Error("okuyucu yüklenemedi")); document.head.appendChild(s); });
    h5 = new Html5Qrcode("h5q"); await h5.start({ facingMode:"environment" }, { fps:10, qrbox:220 }, x => bitti(x)); }
  catch(e){ kap.innerHTML = `<div style="color:#b91c1c;font-size:13px">Kamera açılamadı: ${esc(e.message)} – listeden seçebilirsiniz.</div>`; }
  return dur;
}
const qrKod = (x, tur) => { try{ const u = new URL(x); const k = u.searchParams.get("id"); if(k) return k.trim(); }catch(e){} const m = (tur === "makine" ? /UR-[A-Z]{2}\d{2}/i : /[A-ZÇĞİÖŞÜ]{1,4}-[0-9A-Z.\/-]{1,10}/i).exec(String(x)); return m ? m[0].toUpperCase() : ""; };

async function konumGonder(p, o){ const m = p.querySelector(".etv-m"); let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return; }

/* ===== CİHAZ ARIZA / BAKIM (karne): açık arıza / kalibrasyon, son kayıtlar, bildir ===== */
function sonaAl(){ const f = document.querySelector("#app .foot"); if(f) document.querySelector("#app").appendChild(f); }   // son güncelleme en altta
async function arizaBolum(id, r){
  let L = [];
  try{
    const q = await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=Karne&t=${Date.now()}`), t = await q.text();
    const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1));
    if(j.table){ const H = j.table.cols.map(x => String(x.label || "").toLocaleLowerCase("tr").trim()), g = (x, n) => { const i = H.indexOf(n); return i >= 0 && x.c && x.c[i] ? x.c[i] : null; };
      const tz = x => { if(!x || x.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(x.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; }, s = (x, n) => String((g(x, n) || {}).v ?? "");
      L = j.table.rows.map(x => ({ id:s(x, "kayıt no"), tur:s(x, "tür"), ack:s(x, "açıklama"), bas:tz(g(x, "başlangıç")) || tz(g(x, "tarih")), bit:tz(g(x, "bitiş")), kim:s(x, "kaydeden") }))
        .filter(x => x.id.trim() === String(id).trim()).sort((a, b) => (b.bas || 0) - (a.bas || 0)); }
  }catch(e){}
  const gun = d => d ? Math.max(0, Math.floor((Date.now() - d) / 864e5)) : 0;
  const arz = L.find(x => !x.bit && /^(Arıza|Tamir)$/.test(x.tur)), kal = L.find(x => !x.bit && x.tur === "Kalibrasyon"), ak = arz || kal;
  const [renk, rozet] = arz ? ["#b91c1c", "ARIZADA · " + gun(arz.bas) + " gün"] : kal ? ["#b45309", "KALİBRASYONDA · " + gun(kal.bas) + " gün"] : ["#166534", "AÇIK KAYIT YOK"];
  const rt = t => /Arıza|Tamir/.test(t) ? "#b91c1c" : /Bakım/.test(t) ? "#1d4ed8" : /Kalibrasyon/.test(t) ? "#b45309" : "#475569";
  const d = document.createElement("div"); d.id = "arizaKart"; d.style.cssText = "background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin:12px 0;overflow:hidden";
  d.innerHTML = `<div style="background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <b style="font-size:16px">🛠 Arıza / Bakım</b><span style="background:#fff;color:${renk};border-radius:14px;padding:3px 10px;font-size:12px;font-weight:800">${rozet}</span></div>
    <div style="padding:12px 14px">
      ${ak ? `<div style="font-size:14px;margin-bottom:8px"><b style="color:${renk}">${esc(ak.tur)}</b> – ${esc(ak.ack || "")}<br><small style="color:#64748b">${ak.bas ? ak.bas.toLocaleDateString("tr-TR") : ""}${ak.kim ? " · " + esc(ak.kim) : ""}</small></div>` : ""}
      ${L.length ? `<div style="font-size:12px;font-weight:800;color:#14305e;letter-spacing:.5px;margin:6px 0 2px">SON KAYITLAR</div>` + L.slice(0, 4).map(x => `<div style="font-size:13px;padding:6px 0;border-bottom:1px solid #f1f5f9"><b style="color:${rt(x.tur)}">${esc(x.tur)}</b> · ${esc(x.ack || "")}<br><span style="color:#64748b">${x.bas ? x.bas.toLocaleDateString("tr-TR") : ""}${x.bit ? " → " + x.bit.toLocaleDateString("tr-TR") : (/^(Arıza|Tamir|Kalibrasyon)$/.test(x.tur) ? " → devam ediyor" : "")}</span></div>`).join("") : '<div style="font-size:14px;color:#475569">Bu cihaz için arıza / bakım kaydı yok.</div>'}
      <p style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0"><a href="karne.html?id=${encodeURIComponent(id)}#kaydet" style="background:#dc2626;color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;text-decoration:none">🔴 Arıza / bakım bildir</a>
        <a href="karne.html?id=${encodeURIComponent(id)}" style="background:#e2e8f0;color:#0f172a;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;text-decoration:none">🛠 Karnenin tamamı</a></p></div>`;
  document.querySelector("#app").appendChild(d);
}

/* ===== CİHAZ FOTOĞRAFI: 📷 düğmesi → telefonda kamera / bilgisayarda dosya → küçült → PIN ile Drive'a, Fotoğraf URL'ye ===== */
function fotoDugme(id){
  const k = document.querySelector("#app .photo"); if(!k) return;
  k.style.position = "relative";
  const b = document.createElement("button"); b.type = "button"; b.title = "Fotoğraf ekle / değiştir"; b.textContent = "📷";
  b.style.cssText = "position:absolute;right:4px;bottom:4px;border:0;border-radius:50%;width:34px;height:34px;background:#14305e;color:#fff;font-size:16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)";
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment"); inp.style.display = "none";
  b.onclick = () => inp.click(); k.appendChild(b); k.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return; }
    b.textContent = "⏳"; b.disabled = true;
    try{
      const img = await new Promise((ok, red) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => red(new Error("resim okunamadı")); i.src = URL.createObjectURL(f); });
      const o = Math.min(1, 1200 / Math.max(img.width, img.height)), cv = document.createElement("canvas"); cv.width = Math.round(img.width * o); cv.height = Math.round(img.height * o);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const veri = cv.toDataURL("image/jpeg", 0.82).split(",")[1];
      const q = await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ islem:"cihazFoto", pin, id, dosya:{ veri, mime:"image/jpeg", ad:f.name } }) }), j = await q.json();
      if(!j.ok){ if(/PIN/.test(j.hata || "")) localStorage.removeItem("kayitPin"); throw new Error(j.hata || "kaydedilemedi"); }
      localStorage.setItem("kayitPin", pin);
      const im = k.querySelector("img") || document.createElement("img"); im.src = "data:image/jpeg;base64," + veri; im.alt = ""; if(!im.parentNode){ [...k.childNodes].forEach(n => { if(n !== b && n !== inp) n.remove(); }); k.insertBefore(im, b); }
      b.textContent = "✓"; setTimeout(() => { b.textContent = "📷"; b.disabled = false; }, 1500);
    }catch(e){ alert("Fotoğraf kaydedilemedi: " + e.message); b.textContent = "📷"; b.disabled = false; }
    inp.value = "";
  };
}

  lab:{ "LAB-ARGE":[2088, 546, 2209, 616], "LAB-CPR":[2088, 620, 2209, 690] }   // Ar-Ge binası karantina sahasının yanında: 2. kat LAB-ARGE (depo + etüv odası), alt kat LAB-CPR · diğer laboratuvarların plandaki yeri: örn. "LAB-ARGE":[x1,y1,x2,y2] – kullanıcıdan gelince eklenecek
};
function planBolum(id, r){
  const yer = String(r.yer || ""), mdl = String(r.model || ""), up = s => s.toLocaleUpperCase("tr"), n = s => String(s || "").toLocaleLowerCase("tr");
  const mm = /(?:^|[^A-ZÇĞİÖŞÜ])(AK|BK|CT|CV|DK|EK|KN|KT|OR|PL|RJ|ZR|MB)[\s\-]?0*(\d{1,2})(?!\d)/.exec(up(yer)) || (/ısı göster|isi göster/.test(n(r.ad)) ? /(?:^|[^A-ZÇĞİÖŞÜ])(EK)[\s\-]?0*(\d{1,2})(?!\d)/.exec(up(mdl)) : null);
  let hedef = null, etiket = "", tur = "";
  if(mm){ const k = mm[1] + "-" + ("0" + mm[2]).slice(-2); if(FPLAN.m[k]){ hedef = FPLAN.m[k]; etiket = k; tur = "makine"; } }
  if(!hedef){ const a = FPLAN.a.find(x => x[2].test(n(yer))); if(a){ hedef = a[1]; etiket = a[0]; tur = "alan"; } }
  const lb = /^LAB/i.test(yer.trim()) ? "LAB-" + (up(yer).split(/[-\s]+/)[1] || "") : "";
  if(!hedef && lb && FPLAN.lab[lb]){ hedef = FPLAN.lab[lb]; etiket = lb; tur = "laboratuvar"; }
  const d = document.createElement("div"); d.id = "planKart"; d.style.cssText = "background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin:12px 0;padding:12px 14px";
  if(!hedef){ d.innerHTML = `<b style="font-size:15px;color:#14305e">📍 Fabrikadaki yeri</b><div style="font-size:13px;color:#64748b;margin-top:6px">${lb ? esc(lb) + " laboratuvarının plandaki yeri henüz tanımlanmadı." : "Bulunduğu yer (" + esc(yer || "—") + ") fabrika planında eşleşmedi."}</div>`;
    const k = document.querySelector("#konumKart"); (k ? k.after(d) : document.querySelector("#app").appendChild(d)); return; }
  const X0 = 130, Y0 = 240, K = 1000 / (2222 - X0), X = x => ((x - X0) * K).toFixed(1), Y = y => ((y - Y0) * K).toFixed(1), W = (a, b) => ((b - a) * K).toFixed(1), H = ((1410 - Y0) * K).toFixed(0);
  const [hx1, hy1, hx2, hy2] = hedef, cx = (+X(hx1) + +X(hx2)) / 2, cy = (+Y(hy1) + +Y(hy2)) / 2;
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:15px;color:#14305e">📍 Fabrikadaki yeri</b><small style="color:#64748b">${esc(etiket)} · ${tur}</small></div>
    <svg viewBox="-6 -6 1012 ${+H + 12}" style="width:100%;display:block;margin-top:8px">
      ${FPLAN.bina.map(b => `<rect x="${X(b[0])}" y="${Y(b[1])}" width="${W(b[0], b[2])}" height="${W(b[1], b[3])}" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>`).join("")}
      ${FPLAN.koridor.map(k => `<line x1="${X(k[0])}" y1="${Y(k[1])}" x2="${X(k[2])}" y2="${Y(k[1])}" stroke="#dbe2ea" stroke-width="5"/>`).join("")}
      ${FPLAN.a.map(a => `<rect x="${X(a[1][0])}" y="${Y(a[1][1])}" width="${W(a[1][0], a[1][2])}" height="${W(a[1][1], a[1][3])}" fill="#eef2f7" stroke="#cbd5e1" stroke-width=".8"/>`).join("")}
      ${Object.entries(FPLAN.m).map(([k, b]) => `<rect x="${X(b[0])}" y="${Y(b[1])}" width="${W(b[0], b[2])}" height="${Math.max(5, W(b[1], b[3]))}" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".6"/>`).join("")}
      <rect x="${X(hx1)}" y="${Y(hy1)}" width="${W(hx1, hx2)}" height="${Math.max(6, W(hy1, hy2))}" rx="2" fill="#b88b36" stroke="#7c5a1e" stroke-width="1.2"/>
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9" fill="none" stroke="#dc2626" stroke-width="2.5"><animate attributeName="r" values="7;16;7" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="${Math.min(940, cx + 14).toFixed(1)}" y="${Math.max(16, cy - 10).toFixed(1)}" font-size="16" font-weight="800" fill="#14305e" style="paint-order:stroke;stroke:#fff;stroke-width:4px">${esc(etiket)}</text>
    </svg><div style="font-size:11.5px;color:#64748b;margin-top:4px">Buharkent fabrika yerleşim planından · yukarısı kuzey hol (AK, KN, EK hatları), ortası ZR / RJ / BK / CT / KT, aşağısı MB, kalay kaplama, Upcast</div>`;
  const k = document.querySelector("#konumKart"); (k ? k.after(d) : document.querySelector("#app").appendChild(d));
}
