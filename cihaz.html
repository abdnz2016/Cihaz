<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Kartı</title>
<style>
:root{--navy:#14305e;--red:#e31e24;--gray:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#222}
.wrap{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.main{padding:14px 14px 18px;flex:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.head img{height:48px;max-width:58%}
.head .t{text-align:right}
.head .t b{display:block;color:var(--navy);font-size:21px;letter-spacing:.3px}
.head .t span{color:var(--gray);font-size:14px}
.head .t span i{color:var(--red);font-style:normal;font-weight:bold;font-size:17px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.info{display:flex;gap:12px}
.photo{width:92px;min-width:92px;height:120px;border-radius:10px;background:#f1f4f9;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px}
.photo img{width:100%;height:100%;object-fit:contain}
.dchip{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:bold;font-size:12.5px;background:#eceff3;color:#555}
.dchip.ok{background:#e1f3e5;color:#1b8a3a}
.dchip.bad{background:#fdeaea;color:#c62828}
.photo svg{width:100%;height:100%;padding:6px}
.rows{flex:1;min-width:0}
.row{display:flex;gap:6px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13.5px}
.row:last-child{border:0}
.row .k{width:42%;color:var(--navy);font-weight:bold}
.row .v{flex:1;word-break:break-word}
.st{display:flex;gap:10px;border-radius:14px;padding:10px;margin-bottom:12px;border:1px solid var(--bd);background:var(--bg)}
.st .side{width:30%;min-width:96px;text-align:center;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.st .side .ic{line-height:0}
.st .side .nm{font-weight:bold;font-size:13px;line-height:1.2}
.pill{background:var(--c);color:#fff;border-radius:8px;padding:7px 8px;font-weight:bold;font-size:12.5px;width:100%}
.st .list{flex:1;min-width:0}
.st .row{border-bottom:1px solid rgba(0,0,0,.07);align-items:center}
.st .row .k{width:56%;font-weight:normal;color:#333}
.st .row .v{text-align:right;font-weight:bold}
.st .row .v.c{color:var(--c)}
.chip{display:inline-block;background:var(--bd);color:var(--c);border-radius:12px;padding:3px 10px}
.firm{background:#f3f6fb;border-color:#dfe6f3}
.firm .row .k{width:48%}
.dt{color:var(--navy);font-weight:bold;font-size:13px;margin-bottom:8px;letter-spacing:.5px}
.doc{display:flex;justify-content:space-between;align-items:center;padding:12px;margin-top:8px;border:1px solid #dfe6f3;background:#f3f6fb;border-radius:10px;color:var(--navy);font-weight:bold;font-size:14px;text-decoration:none}
.foot{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11.5px;color:var(--gray)}
.foot b{display:block;color:#333;font-size:13px}
.foot .sep{width:1px;align-self:stretch;background:var(--line)}
.bar{background:var(--navy);color:#fff;display:flex;justify-content:space-around;align-items:center;padding:14px 8px;font-size:13.5px}
.bar a{color:#fff;text-decoration:none}
.msg{text-align:center;padding:40px 12px;color:var(--gray);font-size:15px}
.msg b{color:var(--red)}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s ?? "").toString().toLocaleLowerCase("tr").trim();
const pad = n => String(n).padStart(2, "0");
const fmt = d => d ? `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}` : "-";

function parseDate(c){
  if(!c || c.v == null || c.v === "") return null;
  const v = c.v;
  if(typeof v === "string"){
    let m = v.match(/^Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
    m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  }
  return null;
}
function addDays(d, n){ const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() + n); return r; }
// Firma listesi kuralı: kalibrasyon = ay x 365/12 gün (yuvarlanır), doğrulama = ay x 30 gün (12 ay = 365 gün)
const nextKal = (d, m) => addDays(d, Math.round(m * 365 / 12));
const nextDog = (d, m) => addDays(d, m === 12 ? 365 : m * 30);
function addMonths(d, n){
  const r = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last));
  return r;
}
function daysLeft(d){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

const ICON_KEYS = [["kumpas", "kumpas"], ["mikrometre", "mikrometre"], ["multimetre", "multimetre"], ["avometre", "multimetre"], ["komparatör", "komparator"], ["komparator", "komparator"], ["terazi", "terazi"], ["tartı", "terazi"]];
function pickIcon(name){
  const n = norm(name);
  for(const [k,v] of ICON_KEYS){ if(n.includes(k)) return ICONS[v]; }
  return "🔧";
}
function idOf(c){ if(!c || c.v == null) return ""; return typeof c.v === "number" ? String(c.v) : String(c.v).trim(); }

async function loadRecord(id){
  if(CONFIG.SHEET_ID.startsWith("BURAYA")){
    // Önizleme (demo) modu: Sheet ID girilmediyse örnek veri gösterilir
    return { ad:"Dijital Multimetre", seri:"3957012345", model:"Fluke 87V", yer:"Kalite Laboratuvarı - Lab 01", marka:"Fluke",
      kalTar:new Date(2026,5,15), kalPer:12, dogTar:new Date(2026,11,15), dogPer:6, kalNext:null, dogNext:null,
      firma:"SEVAL KABLO KALİBRASYON HİZMETLERİ", sert:"SK-KAL-2026-0158", foto:"", durum:"UYGUN", sertLink:"https://example.com/sertifika.pdf", dogForm:"https://example.com/dogrulama.pdf", talimat:"https://example.com/talimat.pdf", demo:true };
  }
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_ADI)}`;
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("Veri alınamadı");
  const t = await res.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
  const idx = {};
  j.table.cols.forEach((c,i)=>{ idx[norm(c.label)] = i; });
  const ci = {};
  for(const k in COLS){ ci[k] = idx[COLS[k]]; }
  if(ci.kayit === undefined) throw new Error("Sayfada 'Kayıt No' sütunu bulunamadı");
  const row = j.table.rows.find(r => r.c && r.c[ci.kayit] && idOf(r.c[ci.kayit]) === String(id).trim());
  if(!row) return null;
  const g = k => ci[k] === undefined ? null : row.c[ci[k]];
  return {
    ad:txt(g("ad")), seri:txt(g("seri")), model:txt(g("model")), yer:txt(g("yer")), marka:txt(g("marka")),
    kalTar:parseDate(g("kalTar")), kalPer:Number(g("kalPer")?.v)||0,
    dogTar:parseDate(g("dogTar")), dogPer:Number(g("dogPer")?.v)||0,
    kalNext:parseDate(g("kalNext")), dogNext:parseDate(g("dogNext")),
    firma:txt(g("firma")), sert:txt(g("sert")), foto:txt(g("foto")),
    sertLink:txt(g("sertLink")), dogForm:txt(g("dogForm")), talimat:txt(g("talimat")),
    vidTr:txt(g("vidTr")), vidEn:txt(g("vidEn")), durum:txt(g("durum")),
    aralik:txt(g("aralik")), coz:txt(g("coz")), uretici:txt(g("uretici")), dogTal:txt(g("dogTal")), etiket:txt(g("etiket"))
  };
}

function stIcon(kind, state, color){
  const sym = {
    cal:    {ok:"M16 31l6 6 11-12", warn:"M24 24v9M24 38v.5", bad:"M18 25l12 12M30 25l-12 12"},
    shield: {ok:"M17 24l5 5 9-10",  warn:"M24 15v11M24 31v.5", bad:"M18 17l12 12M30 17l-12 12"}
  }[kind][state];
  const shape = kind === "cal"
    ? '<rect x="6" y="9" width="36" height="33" rx="5"/><path d="M6 19h36M15 5v8M33 5v8" fill="none"/>'
    : '<path d="M24 5l15 6v11c0 10-6.5 17-15 21C15.5 39 9 32 9 22V11z"/>';
  return `<svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g fill="${color}" fill-opacity=".12">${shape}</g><path d="${sym}" fill="none"/></svg>`;
}
function statusBlock(title, icon, dateLabel, perLabel, nextLabel, remLabel, date, per, base, nextExplicit, calc){
  if(!date) return "";
  const next = nextExplicit || (per ? calc(date, per) : null);
  const left = next ? daysLeft(next) : null;
  let c = base.c, bg = base.bg, bd = base.bd, pill = "GEÇERLİ";
  if(left !== null){
    if(left < 0){ c="#c62828"; bg="#fdf1f1"; bd="#f5c6c6"; pill="SÜRESİ DOLDU"; }
    else if(left <= 30){ c="#d98200"; bg="#fff8ec"; bd="#fadfb0"; pill="YAKLAŞIYOR"; }
  }
  const state = pill === "GEÇERLİ" ? "ok" : (pill === "YAKLAŞIYOR" ? "warn" : "bad");
  const remTxt = left === null ? "-" : (left < 0 ? `${-left} gün geçti` : `${left} Gün`);
  return `
  <div class="st" style="--c:${c};--bg:${bg};--bd:${bd}">
    <div class="side"><div class="ic">${stIcon(icon, state, c)}</div><div class="nm">${title}</div><div class="pill">${pill}</div></div>
    <div class="list">
      <div class="row"><span class="k">${dateLabel}</span><span class="v">${fmt(date)}</span></div>
      <div class="row"><span class="k">${nextLabel}</span><span class="v c">${fmt(next)}</span></div>
      <div class="row"><span class="k">${perLabel}</span><span class="v">${per ? per + " Ay" : "-"}</span></div>
      <div class="row"><span class="k">${remLabel}</span><span class="v"><span class="chip">${remTxt}</span></span></div>
    </div>
  </div>`;
}

function render(id, r){
  const now = new Date();
  const upd = `${fmt(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const safe = u => /^https?:\/\//i.test(u || "") ? u : "";
  const icon = pickIcon(r.ad);
  window.FALLBACK_ICON = icon;
  // Drive "Bağlantıyı kopyala" linkini doğrudan resim adresine çevirir (dosya "bağlantıya sahip herkes" ile paylaşılmış olmalı)
  const driveId = u => { const m = String(u || "").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{10,})/); return m ? m[1] : ""; };
  const fid = driveId(r.foto);
  const fotoSrc = fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w600` : safe(r.foto);
  const fotoAlt = fid ? `https://lh3.googleusercontent.com/d/${fid}=w600` : "";
  const photo = fotoSrc ? `<img src="${esc(fotoSrc)}" data-alt="${esc(fotoAlt)}" alt="" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.parentNode.innerHTML=window.FALLBACK_ICON}">` : icon;
  const firm = (r.firma || r.sert) ? `
    <div class="card firm">
      <div class="row"><span class="k">Kalibrasyon Yapan Firma</span><span class="v">${esc(r.firma) || "-"}</span></div>
      <div class="row"><span class="k">Sertifika No</span><span class="v">${esc(r.sert) || "-"}</span></div>
    </div>` : "";
  const docs = [["📄","Kalibrasyon Sertifikası",r.sertLink],["📋","Doğrulama Formu",r.dogForm],["📊","Ölçüm ve Kullanım Raporu", r.kalTar ? new URL("rapor.html?id="+encodeURIComponent(id), location.href).href : ""]].filter(d => safe(d[2]));
  const docsHtml = docs.length ? `<div class="card"><div class="dt">DOKÜMANLAR</div>${docs.map(d => /Kalibrasyon Sertifikası|Doğrulama Formu/.test(d[1])
      ? `<a class="doc" href="#" data-gizli="${d[1].indexOf("Sertifika")>=0 ? "sertifika" : "dogrulama"}"><span>${d[0]} ${d[1]} 🔒</span><span>›</span></a>`
      : `<a class="doc" href="${esc(safe(d[2]))}" target="_blank" rel="noopener"><span>${d[0]} ${d[1]}${/Doğrulama Yap/.test(d[1]) ? " 🔒" : ""}</span><span>›</span></a>`).join("")}</div>` : "";
  $("#app").innerHTML = `
    <div class="head">
      <img src="${CONFIG.LOGO}" alt="Seval Kablo">
      <div class="t"><b>CİHAZ KARTI</b><span>Kayıt No: <i>${esc(id)}</i></span></div>
    </div>
    <div class="card info">
      <div class="photo">${photo}</div>
      <div class="rows">
        <div class="row"><span class="k">Cihaz Adı</span><span class="v">${esc(r.ad) || "-"}</span></div>
        <div class="row"><span class="k">Marka</span><span class="v">${esc(r.marka) || "-"}</span></div>
        <div class="row"><span class="k">Seri Numarası</span><span class="v">${esc(r.seri) || "-"}</span></div>
        <div class="row"><span class="k">Model</span><span class="v">${esc(r.model) || "-"}</span></div>
        ${r.aralik ? `<div class="row"><span class="k">Ölçüm Aralığı</span><span class="v">${esc(r.aralik)}</span></div>` : ""}
        ${r.coz ? `<div class="row"><span class="k">Çözünürlük</span><span class="v">${esc(r.coz)}</span></div>` : ""}
        <div class="row"><span class="k">Bulunduğu Yer</span><span class="v">${esc(r.yer) || "-"}</span></div>
        ${r.durum ? `<div class="row"><span class="k">Cihaz Durumu</span><span class="v"><span class="dchip ${norm(r.durum) === "uygun" ? "ok" : (norm(r.durum) === "olumsuz" ? "bad" : "")}">${esc(r.durum)}</span></span></div>` : ""}
      </div>
    </div>
    ${statusBlock("KALİBRASYON DURUMU","cal","Kalibrasyon Tarihi","Kalibrasyon Periyodu","Gelecek Kalibrasyon","Gelecek Kalibrasyona Kalan Süre",r.kalTar,r.kalPer,{c:"#1b8a3a",bg:"#f3faf4",bd:"#cfe8d3"},r.kalNext,nextKal)}
    ${statusBlock("DOĞRULAMA DURUMU","shield","Doğrulama Tarihi","Doğrulama Periyodu","Gelecek Doğrulama","Gelecek Doğrulamaya Kalan Süre",r.dogTar,r.dogPer,{c:"#f26a1b",bg:"#fff6ef",bd:"#fbd9c0"},r.dogNext,nextDog)}
    ${firm}
    ${docsHtml}
    <div class="foot">
      <div><span>Son Güncelleme</span><b>${upd}</b></div>
      <div class="sep"></div>
      <div>Bu veriler Google Sheets üzerinden anlık olarak alınmaktadır.</div>
    </div>
    ${r.demo ? '<div class="msg" style="padding:10px">Önizleme modu: örnek veri gösteriliyor.</div>' : ""}`;
}

(async function(){
  $("#web").textContent = "🌐 " + CONFIG.WEB;  $("#web").href = "https://" + CONFIG.WEB;
  $("#tel").textContent = "📞 " + CONFIG.TEL;  $("#tel").href = "tel:" + CONFIG.TEL.replace(/\s/g,"");
  const id = new URLSearchParams(location.search).get("id");
  if(!id){ $("#app").innerHTML = '<div class="msg">Kayıt numarası bulunamadı.<br>Lütfen cihaz üzerindeki <b>QR kodu</b> okutunuz.</div>'; return; }
  try{
    const r = await loadRecord(id);
    if(!r) $("#app").innerHTML = `<div class="msg">Kayıt No <b>${esc(id)}</b> için cihaz bulunamadı.</div>`;
    else render(id, r);
  }catch(e){
    $("#app").innerHTML = `<div class="msg">Veriler alınamadı.<br><small>${esc(e.message)}</small></div>`;
  }
})();

/* ===== Şifreli belgeler: sertifika ve doğrulama formu (servis sizin yetkinizle getirir) ===== */
const SERVIS_URL = "https://script.google.com/macros/s/AKfycbxFXTZEYyDTH9SscQygnRiW9HOIx1c4v3tgdGLjId9tXpJ5G0byl_LhaCXeEPDuzH-c/exec";
document.addEventListener("click", async e => {
  const a = e.target.closest && e.target.closest("a[data-gizli]"); if(!a) return;
  e.preventDefault();
  const tur = a.dataset.gizli, id = new URLSearchParams(location.search).get("id") || "";
  let pin = sessionStorage.getItem("erisimPin");
  if(!pin){ pin = (prompt("Şifre:") || "").trim(); if(!pin) return; }
  const MOBIL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent), w = MOBIL ? null : window.open("", "_blank");
  if(w) w.document.write("<p style='font:16px sans-serif;padding:20px'>Belge açılıyor…</p>");
  try{
    const r = await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ islem:"dosya", tur:tur, id:id, pin:pin }) });
    const j = await r.json();
    if(!j.ok){ if(/şifre/i.test(j.hata || "")) sessionStorage.removeItem("erisimPin"); if(w) w.close(); alert(j.hata || "Belge açılamadı"); return; }
    sessionStorage.setItem("erisimPin", pin);
    const bin = atob(j.veri), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: j.mime || "application/octet-stream" }));
    if(/pdf/i.test(j.mime || "") && w){ w.location.href = url; }
    else if(MOBIL){ const d = document.createElement("a"); d.href = url; d.download = j.ad || "belge.pdf"; document.body.appendChild(d); d.click(); d.remove(); }
    else { const d = document.createElement("a"); d.href = url; d.download = j.ad || "belge"; document.body.appendChild(d); d.click(); d.remove(); if(w) w.close(); }
  }catch(err){ if(w) w.close(); alert("Belge açılamadı: " + err.message); }
});
</script>
