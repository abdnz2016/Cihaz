// ---------- etüv ve cihaz modelleri ----------
function etuv(c, t, x, y, z, ax){ const g = new THREE.Group(), md = norm(c ? c.model : ""), ster = /fn\s*120/.test(md), vak = /ev\s*0?18/.test(md), kucuk = /fn\s*300/.test(md);
