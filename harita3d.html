// ===== KUŞ BAKIŞI HAT ÇİZİMİ (Seval Park ve hat sayfası ortak) – yalnız gerçekten kayıtlı cihazların istasyonları; durum noktası cihazın kendi istasyonunda =====
const KB = {
  tur: c => { const n = String(c.ad || "").toLocaleLowerCase("tr"); return /çap|cap ölç/.test(n) ? "cap" : /spark/.test(n) ? "spark" : /yazı makina|yazi makina|metre göster/.test(n) ? "yazi" : /metre sayac|metre disk/.test(n) ? "metre"

  renk: c => { if(c.renk === "k") return "k"; const g = new Date(); g.setHours(0, 0, 0, 0); const y = d => d && d >= g && (d - g) / 864e5 <= 30;

  neden: c => { const g = new Date(); g.setHours(0, 0, 0, 0); const y = d => d && d >= g && (d - g) / 864e5 <= 30;

  RENK: { g:"#16a34a", s:"#eab308", k:"#dc2626" },
  en: L => L.some(c => KB.renk(c) === "k") ? "k" : L.some(c => KB.renk(c) === "s") ? "s" : "g",
  istasyonlar(ek, cc){
    const by = t => cc.filter(c => KB.tur(c) === t), cap = by("cap"), sp = by("spark"), yz = by("yazi"), mt = by("metre"), L = [];
    if(ek){ L.push(["verici", "Verici 1", []], ["verici", "Verici 2", []], ["ekstr", "Dolgu ekstr.", by("dolgu")]);
      if(cap[0]) L.push(["cap", "Çap ölçer 1", [cap[0]]]);
      L.push(["ekstr", "Ana ekstr.", by("ana")]);
      cap.slice(1).forEach((c, i) => L.push(["cap", "Çap ölçer " + (i + 2), [c]]));
      L.push(["havuz", "Soğutma havuzu", []]);

      yz.forEach((c, i) => L.push(["yazi", "Yazı mak." + (yz.length > 1 ? " " + (i + 1) : ""), [c]]));
      L.push(["katarpil", "Katarpil", mt], ["topla", "Toplayıcı 1", []], ["topla", "Toplayıcı 2", []]);
    } else { L.push(["verici", "Verici", []], ["govde", "Makine", by("diger").concat(by("dolgu"), by("ana"))]);
      cap.forEach(c => L.push(["cap", "Çap ölçer", [c]])); sp.forEach(c => L.push(["spark", "Spark", [c]])); yz.forEach(c => L.push(["yazi", "Yazı mak.", [c]])); mt.forEach(c => L.push(["metre", "Metre sayacı", [c]]));
      L.push(["topla", "Toplayıcı", []]); }
    const W = { verici:5, ekstr:4, cap:2.4, havuz:24, spark:3.6, yazi:2.8, katarpil:6, topla:6, govde:28, metre:2.8 }, gap = 1.6;
    const top = L.reduce((s, x) => s + W[x[0]], 0) + gap * (L.length - 1); let t = 0;
    return L.map(x => { const a = t / top, b = (t + W[x[0]]) / top; t += W[x[0]] + gap; return { tip:x[0], ad:x[1], cihaz:x[2], a, b }; });
  },
  ciz(x1, y, x2, h, L, etiketli, ek){   // akış sağdan (doğu, karantina tarafı) sola
    const cy = y + h / 2, W = x2 - x1, px = t => x2 - t * W, f = n => +n.toFixed(1);
    let s = `<line x1="${f(x2)}" y1="${f(cy)}" x2="${f(x1)}" y2="${f(cy)}" stroke="#334155" stroke-width="${f(Math.max(.8, h * .1))}"/>`, nok = "";

        ekstr:`<rect x="${f(xa)}" y="${f(y - h * 1.3)}" width="${w}" height="${f(h * 1.8)}" rx="1" fill="#2563eb" stroke="#1e3a8a" stroke-width=".5"/><circle cx="${f(xa + w / 2)}" cy="${f(y - h * .7)}" r="${f(Math.min(w, h) * .32)}" fill="#93c5fd" stroke="#1e3a8a" stroke-width=".4"/>`,

          (etiketli && ek ? `<rect x="${f(xa + w * .25)}" y="${f(y - h * 1.15)}" width="${f(w * .4)}" height="${f(h * .7)}" fill="#cbd5e1" stroke="#64748b" stroke-width=".5"/><text x="${f(xa + w * .45)}" y="${f(y - h * 1.3)}" font-size="${f(h * .38)}" text-anchor="middle" fill="#14305e" font-weight="700">Pano</text>` : ""),
        spark:`<rect x="${f(xa)}" y="${f(y + h * .12)}" width="${w}" height="${f(h * .76)}" fill="#cbd5e1" stroke="#475569" stroke-width=".5"/><circle cx="${f(xa + w / 2)}" cy="${f(cy)}" r="${f(h * .2)}" fill="#f59e0b"/>`,
        yazi:`<rect x="${f(xa)}" y="${f(y - h * .55)}" width="${w}" height="${f(h * .75)}" fill="#d1d5db" stroke="#6b7280" stroke-width=".5"/><rect x="${f(xa + w * .2)}" y="${f(y - h * .45)}" width="${f(w * .6)}" height="${f(h * .25)}" fill="#7c3aed"/>`,
        katarpil:`<rect x="${f(xa)}" y="${f(y + h * .05)}" width="${w}" height="${f(h * .9)}" fill="#cbd5e1" stroke="#475569" stroke-width=".5"/><rect x="${f(xa + w * .08)}" y="${f(y + h * .2)}" width="${f(w * .84)}" height="${f(h * .18)}" fill="#1f2937"/><rect x="${f(xa + w * .08)}" y="${f(y + h * .62)}" width="${f(w * .84)}" height="${f(h * .18)}" fill="#1f2937"/>`,
        metre:`<rect x="${f(xa)}" y="${f(y + h * .15)}" width="${w}" height="${f(h * .7)}" fill="#0f172a" stroke="#334155" stroke-width=".5"/>`,
        govde:`<rect x="${f(xa)}" y="${f(y + h * .15)}" width="${w}" height="${f(h * .7)}" rx="1" fill="#94a3b8" stroke="#475569" stroke-width=".5"/>` }[tip];
      s += r;
      if(etiketli) s += `<text x="${f(xa + w / 2)}" y="${f(tip === "ekstr" || tip === "yazi" ? y - h * 1.45 : y + h * 1.75)}" font-size="${f(h * .38)}" text-anchor="middle" fill="#14305e" font-weight="700">${st.ad}</text>`;
      if(st.cihaz.length){ const rk = KB.en(st.cihaz), ny = etiketli ? (tip === "ekstr" ? y - h * 1.3 : tip === "yazi" ? y - h * .55 : y + h * .05) : y;
        nok += `<circle cx="${f(xa + w / 2)}" cy="${f(ny)}" r="${etiketli ? f(h * .26) : f(Math.max(2.2, h * .28))}" fill="${KB.RENK[rk]}" stroke="#fff" stroke-width="${etiketli ? 1.4 : .8}"><title>${st.cihaz.map(c => c.id + " " + c.ad + " – " + KB.neden(c)).join("\n")}</title></circle>`; } });

async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label)); return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; };
const makineKodu = s => { const m = /(?:^|[^A-ZÇĞİÖŞÜ])(AK|BK|CT|CV|DK|EK|KN|KT|OR|PL|RJ|ZR)[\s\-]?0*(\d{1,2})(?!\d)/i.exec(String(s || "").toLocaleUpperCase("tr")); return m ? "UR-" + m[1].toUpperCase() + ("0" + m[2]).slice(-2) : ""; };

// ---------- ölçek: plan pikseli → sahne birimi ----------
const S = 0.06, CX = 1230, CZ = 520, X = px => (px - CX) * S, Z = py => (py - CZ) * S;
const HOL = [385, 340, 2072, 690];

const mat = {}, M = (renk, o = {}) => { const k = renk + JSON.stringify(o); return mat[k] || (mat[k] = new THREE.MeshStandardMaterial(Object.assign({ color:renk, roughness:.6, metalness:.15 }, o))); };
function kutu(g, w, h, d, renk, x, y, z, o){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(renk, o)); m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; g.add(m); return m; }
function silindir(g, r, uz, renk, x, y, z, eksen){ const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, uz, 24), M(renk)); if(eksen === "z") m.rotation.x = Math.PI / 2; if(eksen === "x") m.rotation.z = Math.PI / 2; m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; }
function yazi(metin, renk, boy){ const c = document.createElement("canvas"), x = c.getContext("2d"), F = "bold 38px Arial"; x.font = F; const g = Math.max(256, Math.ceil(x.measureText(metin).width) + 40);   // tuval yazı boyuna göre: uzun ad kesilmez
  c.width = g; c.height = 64; x.font = F; x.textAlign = "center"; x.textBaseline = "middle"; x.lineWidth = 8; x.strokeStyle = "rgba(255,255,255,.95)"; x.strokeText(metin, g / 2, 34); x.fillStyle = renk || "#14305e"; x.fillText(metin, g / 2, 34);
  const b = (boy || .9) * g / 256, s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthTest:false })); s.scale.set(b, (boy || .9) / 4, 1); s.renderOrder = 10; return s; }
function kafes(g, w, h, d, x, z){ const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)), new THREE.LineBasicMaterial({ color:0xeab308 })); e.position.set(x, h / 2, z); g.add(e);
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color:0xeab308, transparent:true, opacity:.08, depthWrite:false })); p.position.copy(e.position); g.add(p); }

// ---------- bir hattı 3B kur (akış doğudan batıya: x2 → x1) ----------
function hatKur(m, b, cc){
