<script>
const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A";
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim(), key = s => String(s ?? "").trim().replace(/\s+/g, "").replace(/\//g, "-").toLocaleUpperCase("tr");
const sade = s => String(s ?? "").toLocaleUpperCase("tr").replace(/[\s\-_.\/×x*]+/g, "");

// ---------- hat düzeni: istasyonlar (x: hat boyunca konum), teknik bilgi, sabit parçalar, elle bağlı cihazlar ----------
const MOTOR = [["Motor", "Siemens 1FK7105-5AF71-1PA0 servo"], ["Güç", "≈ 8,2 kW (26 Nm × 3000 d/dk)"], ["Gerilim", "294 V (sürücü çıkışı)"], ["Akım", "18 A anma · 31 A duruş"], ["Koruma", "IP64 · 36 kg"]];

    { c:"cap", x:16.6, ad:"Çap ölçer 2", tur:"cap", sira:1 },
    { c:"pano", x:21.5, ad:"Pano", yer:/pano|plc|sürücü|surucu/, bilgi:[["Klima", "Rittal TopTherm SK 3332540"], ["Besleme", "400 V / 50 Hz 3~ · 4,2 A"], ["Çekilen güç", "1,72 – 1,99 kW"], ["Soğutma", "4,0 kW (L35/L35)"], ["Soğutucu", "R134a · 2995 g"], ["Koruma / yıl", "IP54 / IP34 · 2013"]],

    { c:"tekne", x:18.6, w:12.2, ad:"Soğutma havuzu" },

    { c:"toplayici", x:48.4, ad:"Toplayıcı 2", yer:/toplay/, bilgi:MOTOR.concat([["Seri no", "YF A721 5132 06 002"]]) } ]
};
const VARSAYILAN = HATLAR["UR-EK03"];

// ---------- 3B çizim: eğik izdüşüm (hat yatay, derinlik sağ-yukarı) ----------
const S = 24, OX = 30, OY = 250, DX = 0.42, DY = 0.30, KZ = 1.35;   // KZ: kablo yüksekliği
const P = (x, y, z) => [OX + (x + y * DX) * S, OY - (z + y * DY) * S];
const pts = L => L.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
const ton = (h, k) => { const n = parseInt(h.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k))); return "#" + [f(n >> 16), f(n >> 8 & 255), f(n & 255)].map(c => c.toString(16).padStart(2, "0")).join(""); };
function kutu(x, y, z, w, d, h, r, cizgi){ const st = `stroke="${cizgi || ton(r, .55)}" stroke-width=".7" stroke-linejoin="round"`;
  return `<polygon points="${pts([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)])}" fill="${ton(r, 1.18)}" ${st}/>` +
         `<polygon points="${pts([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)])}" fill="${ton(r, .78)}" ${st}/>` +
         `<polygon points="${pts([P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)])}" fill="${r}" ${st}/>`; }
function disk(x, y, z, r, d, renk){ const [a, b] = P(x, y + d, z), [c, e] = P(x, y, z), R = r * S;
  return `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${R}" fill="${ton(renk, .7)}" stroke="${ton(renk, .5)}"/>` +
    `<polygon points="${pts([[a, b - R], [c, e - R], [c, e + R], [a, b + R]])}" fill="${ton(renk, .82)}"/>` +
    `<circle cx="${c.toFixed(1)}" cy="${e.toFixed(1)}" r="${R}" fill="${renk}" stroke="${ton(renk, .55)}" stroke-width="1.5"/>` +
    `<circle cx="${c.toFixed(1)}" cy="${e.toFixed(1)}" r="${R * .62}" fill="${ton(renk, 1.15)}" stroke="${ton(renk, .6)}"/>` +
    `<circle cx="${c.toFixed(1)}" cy="${e.toFixed(1)}" r="${R * .16}" fill="#78350f"/>`; }
function kafes(x, y, z, w, d, h){ const k = "#eab308", c = [[x, y], [x + w, y], [x + w, y + d], [x, y + d]], tel = [];
  for(let i = 0; i <= 4; i++){ const a = x + w * i / 4; tel.push([[a, y, z], [a, y, z + h]]); }
  for(let i = 0; i <= 3; i++){ const a = y + d * i / 3; tel.push([[x + w, a, z], [x + w, a, z + h]]); }
  const cz = q => q.map(p => P(...p));
  return `<polygon points="${pts(c.map(p => P(p[0], p[1], z + h)))}" fill="none" stroke="${k}" stroke-width="1.6"/>` + c.map(p => `<line x1="${P(p[0], p[1], z)[0]}" y1="${P(p[0], p[1], z)[1]}" x2="${P(p[0], p[1], z + h)[0]}" y2="${P(p[0], p[1], z + h)[1]}" stroke="${k}" stroke-width="1.8"/>`).join("") +
    `<polygon points="${pts([P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)])}" fill="${k}" fill-opacity=".07" stroke="${k}" stroke-width=".6"/>` +
    tel.map(t => { const [a, b] = cz(t); return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${k}" stroke-opacity=".45" stroke-width=".7"/>`; }).join(""); }
const etiketYer = (s, sira) => s.c === "pano" ? P(merkez(s), 3.4, 4.75) : (() => { const [a, b] = P(merkez(s), -3.1, 0); return [a, b + sira * 15]; })();
const etiket = (s, sira, metin) => { const [a, b] = etiketYer(s, sira); return `<text class="et" x="${a.toFixed(1)}" y="${b.toFixed(1)}">${esc(metin)}</text>`; };
const CIZ = {
  verici: s => kafes(s.x - 0.3, -1.2, 0, 3.4, 2.6, 2.4) + kutu(s.x, -0.9, 0, 2.6, 1.8, 0.25, "#475569") + kutu(s.x + 0.2, -0.2, 0.25, 0.3, 0.4, 1.4, "#64748b") + kutu(s.x + 2.1, -0.2, 0.25, 0.3, 0.4, 1.4, "#64748b") + disk(s.x + 1.3, -0.5, 1.45, 1.15, 0.9, "#f59e0b") + kutu(s.x + 2.4, 0.9, 0.25, 0.7, 0.7, 0.8, "#94a3b8"),
  ekstruder: s => { const w = s.w || 1.6, b = w > 1.6;
    return kutu(s.x - 0.2, 0.4, 0, w + 0.4, 6.4, 0.5, "#334155") + kutu(s.x - 0.1, 5.2, 0.5, w + 0.2, 1.6, 1.7, "#1e3a8a") + kutu(s.x + w * 0.2, 0.9, 0.9, w * 0.6, 4.6, 0.75, "#2563eb") +
      kutu(s.x + w * 0.15, 0.5, 0.5, w * 0.7, 0.5, 0.4, "#1e40af") + kutu(s.x + w * 0.3, 3.7, 1.65, w * 0.4, 0.6, 0.5, "#1e40af") +
      `<polygon points="${pts([P(s.x + w * .05, 3.6, 2.15 + (b ? .9 : .7)), P(s.x + w * .95, 3.6, 2.15 + (b ? .9 : .7)), P(s.x + w * .7, 3.9, 2.15), P(s.x + w * .3, 3.9, 2.15)])}" fill="#60a5fa" stroke="#1e3a8a"/>` +
      kutu(s.x + w * 0.1, -0.5, 0.95, w * 0.8, 1.0, 0.85, "#0f172a") +
      (s.renk ? kutu(s.x + w + 0.6, 0.6, 0, 1.0, 3.0, 1.6, "#475569") + kutu(s.x + w + 0.7, 0.9, 1.6, 0.8, 2.4, 0.5, "#db2777") + `<polygon points="${pts([P(s.x + w + .62, 2.4, 2.75), P(s.x + w + 1.58, 2.4, 2.75), P(s.x + w + 1.35, 2.6, 2.1), P(s.x + w + .85, 2.6, 2.1)])}" fill="#f472b6" stroke="#9d174d"/>` : ""); },
  cap: s => kutu(s.x + 0.35, -0.2, 0, 0.5, 0.5, 0.8, "#64748b") + kutu(s.x, -0.5, 0.8, 1.2, 1.0, 0.25, "#e2e8f0") + kutu(s.x, -0.5, 1.05, 0.25, 1.0, 0.65, "#e2e8f0") +
      kutu(s.x + 0.95, -0.5, 1.05, 0.25, 1.0, 0.65, "#e2e8f0") + kutu(s.x, -0.5, 1.7, 1.2, 1.0, 0.3, "#e2e8f0") + kutu(s.x + 0.1, -0.52, 1.78, 0.35, 0.02, 0.14, "#38bdf8") +
      `<line x1="${P(s.x + .4, -0.5, 1.05)[0]}" y1="${P(s.x + .4, -0.5, 1.05)[1]}" x2="${P(s.x + .4, -0.5, 1.7)[0]}" y2="${P(s.x + .4, -0.5, 1.7)[1]}" stroke="#ef4444" stroke-width="1.6"/>`,
  tekne: s => [0.15, s.w / 2, s.w - 0.45].map(a => kutu(s.x + a, -0.3, 0, 0.25, 0.25, 0.8, "#64748b") + kutu(s.x + a, 0.9, 0, 0.25, 0.25, 0.8, "#64748b")).join("") +
      kutu(s.x, -0.6, 0.8, s.w, 1.8, 0.75, "#bfdbfe", "#1e40af") + `<polygon points="${pts([P(s.x + .1, -0.5, 1.48), P(s.x + s.w - .1, -0.5, 1.48), P(s.x + s.w - .1, 1.1, 1.48), P(s.x + .1, 1.1, 1.48)])}" fill="#60a5fa" opacity=".75"/>`,
  pano: s => kutu(s.x, 3.4, 0, 5.2, 1.3, 4.1, "#cbd5e1") + [1.3, 2.6, 3.9].map(a => `<line x1="${P(s.x + a, 3.4, 0.1)[0]}" y1="${P(s.x + a, 3.4, 0.1)[1]}" x2="${P(s.x + a, 3.4, 4.0)[0]}" y2="${P(s.x + a, 3.4, 4.0)[1]}" stroke="#94a3b8"/>`).join("") +
      kutu(s.x + 5.2, 3.6, 0.6, 0.6, 0.9, 2.6, "#e5e7eb") + kutu(s.x + 0.3, 3.38, 3.2, 0.8, 0.02, 0.5, "#22c55e"),
  spark: s => kutu(s.x + 0.2, -0.4, 0, 1.4, 1.2, 0.3, "#475569") + kutu(s.x, -0.6, 0.3, 1.8, 1.6, 1.55, "#cbd5e1") + kutu(s.x + 1.0, -0.62, 1.4, 0.6, 0.02, 0.25, "#22c55e") +
      `<circle cx="${P(s.x + .55, -0.6, KZ)[0]}" cy="${P(s.x + .55, -0.6, KZ)[1]}" r="${S * .38}" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M${P(s.x + .6, -0.6, 1.72)[0]} ${P(s.x + .6, -0.6, 1.72)[1]} l-5 9 h5 l-3 8 9 -12 h-5 l4 -5z" fill="#f59e0b" stroke="#b45309" stroke-width=".6"/>`,
  yazi: s => kutu(s.x, 0.6, 0, 1.3, 1.1, 2.5, "#d1d5db") + kutu(s.x + 0.1, 0.58, 1.75, 1.1, 0.02, 0.6, "#7c3aed") + kutu(s.x + 0.15, 0.58, 1.85, 0.6, 0.02, 0.3, "#c4b5fd") +
      kutu(s.x + 0.55, -0.35, 1.15, 0.25, 0.25, 0.5, "#111827") + `<path d="M${P(s.x + .7, 0.6, 1.4).join(" ")} Q ${P(s.x + .9, 0.2, 1.9).join(" ")} ${P(s.x + .68, -0.2, 1.65).join(" ")}" stroke="#111827" stroke-width="2.2" fill="none"/>`,
  katarpil: s => kutu(s.x, -0.8, 0, s.w, 1.9, 0.35, "#475569") + kutu(s.x + 0.1, -0.6, 0.35, s.w - 0.2, 1.5, 2.3, "#cbd5e1") +
      kutu(s.x + 0.25, -0.62, KZ + 0.1, s.w - 0.5, 0.02, 0.5, "#1f2937") + kutu(s.x + 0.25, -0.62, KZ - 0.6, s.w - 0.5, 0.02, 0.5, "#1f2937") + kutu(s.x + s.w, 0.1, 0.35, 0.6, 0.6, 0.9, "#1e3a8a"),
  toplayici: s => kutu(s.x - 0.1, -0.9, 0, 3.1, 1.8, 0.25, "#475569") + kutu(s.x + 0.1, -0.2, 0.25, 0.3, 0.4, 1.6, "#64748b") + kutu(s.x + 2.4, -0.2, 0.25, 0.3, 0.4, 1.6, "#64748b") +
      disk(s.x + 1.45, -0.5, 1.6, 1.35, 1.0, "#f59e0b") + kutu(s.x + 2.75, 0.1, 0.25, 0.75, 0.7, 1.0, "#94a3b8") + kafes(s.x - 0.4, -1.3, 0, 3.9, 2.8, 3.1)
};
const merkez = s => s.x + ({ verici:1.3, ekstruder:(s.w || 1.6) / 2, cap:0.6, tekne:(s.w || 10) / 2, pano:2.6, spark:0.9, yazi:0.65, katarpil:(s.w || 3) / 2, toplayici:1.45 }[s.c] || 1);

// ---------- fabrikadaki yeri: Buharkent yerleşim planından (piksel koordinatları, kuzey hol) ----------
const PLAN = { bina:[400, 340, 2030, 672], koridor:[], hatlar:{ "UR-EK12":[1235, 493, 1598, 514], "UR-EK24":[1215, 521, 1658, 544], "UR-EK21":[1287, 562, 1600, 582], "UR-EK10":[1230, 591, 1600, 610], "UR-EK03":[1288, 618, 1603, 638],
  "UR-EK16":[1143, 373, 1346, 391], "UR-EK19":[1157, 399, 1366, 417], "UR-EK11":[1135, 426, 1343, 445], "UR-EK20":[1408, 368, 1659, 386], "UR-EK15":[1520, 395, 1661, 412], "UR-EK07":[1391, 421, 1659, 440], "UR-EK25":[1281, 452, 1641, 471], "UR-EK08":[736, 570, 988, 589] },
  alanlar:[["Gerilim test", 951, 461, 1079, 515], ["HFFR plastik", 1739, 341, 1866, 402], ["PVC plastik", 1880, 338, 2008, 400], ["Kablo karantina", 1903, 590, 2028, 648], ["Hammadde depo", 782, 260, 1000, 300]] };
function planCiz(id){ const [x0, y0, x1, y1] = PLAN.bina, k = 1000 / (x1 - x0), X = x => ((x - x0) * k).toFixed(1), Y = y => ((y - y0) * k).toFixed(1), H = ((y1 - y0) * k).toFixed(0);
  const h = PLAN.hatlar[key(id)]; if(!h) return "";
  return `<div class="kart"><b style="color:#14305e">📍 Fabrikadaki yeri</b> <small style="color:#64748b">Buharkent fabrika yerleşim planından · kuzey üretim holü</small>
    <svg viewBox="-10 -10 1020 ${+H + 20}" style="width:100%;max-width:900px;display:block;margin:8px auto 0"><rect x="0" y="0" width="1000" height="${H}" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      ${PLAN.koridor.map(y => `<line x1="0" y1="${Y(y)}" x2="1000" y2="${Y(y)}" stroke="#cbd5e1" stroke-width="6"/>`).join("")}
      ${PLAN.alanlar.filter(a => a[2] >= y0 && a[4] <= y1).map(a => `<rect x="${X(a[1])}" y="${Y(a[2])}" width="${((a[3] - a[1]) * k).toFixed(1)}" height="${((a[4] - a[2]) * k).toFixed(1)}" fill="#eef2f7" stroke="#cbd5e1"/><text x="${X((a[1] + a[3]) / 2)}" y="${Y((a[2] + a[4]) / 2 + 5)}" font-size="11" text-anchor="middle" fill="#64748b">${a[0]}</text>`).join("")}
      ${Object.entries(PLAN.hatlar).map(([kod, r]) => { const se = kod === key(id); return `<rect x="${X(r[0])}" y="${Y(r[1])}" width="${((r[2] - r[0]) * k).toFixed(1)}" height="${Math.max(10, (r[3] - r[1]) * k).toFixed(1)}" rx="3" fill="${se ? "#b88b36" : "#e2e8f0"}" stroke="${se ? "#7c5a1e" : "#94a3b8"}"/>
        <text x="${X((r[0] + r[2]) / 2)}" y="${(+Y((r[1] + r[3]) / 2) + 4).toFixed(1)}" font-size="${se ? 13 : 10}" font-weight="${se ? 800 : 600}" text-anchor="middle" fill="${se ? "#fff" : "#475569"}">${kod.replace(/^UR-/, "").replace(/(\D)(\d)/, "$1-$2")}</text>`; }).join("")}
    </svg></div>`; }
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label)); return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; };

  const acik = {}; K.forEach(r => { if(!v(r["bitiş"]) && /^(Arıza|Tamir|Kalibrasyon)$/.test(v(r["tür"]))) acik[key(v(r["kayıt no"]))] = v(r["tür"]); });
  const durum = c => { const n = []; if(acik[key(c.id)] && acik[key(c.id)] !== "Kalibrasyon") n.push("arızada");
    if(c.kn && c.kn < bugun) n.push("kalibrasyon süresi geçti"); if(c.dn && c.dn < bugun) n.push("doğrulama süresi geçti"); if(/RAPORUNA|OLUMSUZ/i.test(c.ds)) n.push("ölçüm raporuna bakınız");

  const TUM = C.map(r => durum({ id:v(r["kayıt no"]), eski:v(r["eski kayıt no"]), ad:v(r["cihaz adı"]), marka:v(r["marka"]), model:v(r["model"]), yer:v(r["bulunduğu yer"]), kn:tar(r["sonraki kalibrasyon"]), dn:tar(r["sonraki doğrulama"]), ds:v(r["doğrulama sonucu"]) })).filter(c => c.id);

  const ist = D.map(s => { let L = [];
    (s.cihaz || []).forEach(k => { const c = bul(k); if(c && !L.includes(c)) L.push(c); });
    if(s.tur) cih.filter(c => tur(c) === s.tur && !L.includes(c) && !yerlesen.has(c.id)).forEach(c => { if(s.sira === undefined || cih.filter(x => tur(x) === s.tur).indexOf(c) % say(s.tur) === s.sira) L.push(c); });
    if(s.renk) cih.filter(c => tur(c) === "renk").forEach(c => L.push(c));
    L.forEach(c => yerlesen.add(c.id)); return Object.assign({}, s, { cihazlar:L }); });
  // hatta kayıtlı cihazı olmayan çap ölçer / spark / yazı makinası istasyonu çizilmez, sonraki istasyonlar sola kayar
  const GEN = { cap:2.3, spark:3.0, yazi:2.4 }; let kay = 0;
  for(let i = 0; i < ist.length; i++){ const s = ist[i]; if(GEN[s.c] && !s.cihazlar.length){ kay += GEN[s.c]; ist.splice(i, 1); i--; continue; } s.x -= kay; }
  // makine parça listesi → istasyon ("Kullanıldığı Yer"), depo stoğu
  const DEP = DP.map(r => ({ kod:v(r["malzeme kodu"]), barkod:v(r["barkod"]), ad:v(r["malzeme adı"]), model:v(r["model / ölçü"]), not:v(r["not"]), stok:Number(v(r["stok"]).replace(",", ".")) || 0, birim:v(r["birim"]) || "adet" })).filter(x => x.kod);
  const depo = (kod, ack) => { const k = sade(kod), a = sade(ack); return DEP.find(d => k.length >= 4 && [d.barkod, d.model, d.not, d.ad].some(x => sade(x).includes(k))) || DEP.find(d => a.length >= 6 && sade(d.ad) === a) || null; };
  const MPm = MP.filter(r => key(v(r["makine kodu"])) === key(id)).map(r => ({ marka:v(r["marka"]), kod:v(r["ürün kodu"]), ack:v(r["açıklama"]), yer:v(r["kullanıldığı yer"]) }));
  ist.forEach(s => { s.parcalar = (s.parca || []).map(p => ({ marka:p[0], kod:p[1], ack:p[2] })).concat(MPm.filter(p => norm(p.yer).includes(norm(s.ad)) || (s.yer && !/\d/.test(p.yer) && s.yer.test(norm(p.yer + " " + p.ack))))); });   // "Verici 1" yalnız Verici 1'de; numarasız yer ("Ana pano", "Katarpil") desenle
  const en = [v(mr["besleme gerilimi (v)"]) ? "⚡ " + v(mr["besleme gerilimi (v)"]).replace(/\s*V$/i, "") + " V" : "", v(mr["kurulu güç (kw)"]) ? v(mr["kurulu güç (kw)"]).replace(".", ",") + " kW" : "", v(mr["hava basıncı (bar)"]) ? "💨 " + v(mr["hava basıncı (bar)"]).replace(".", ",") + " bar" : ""].filter(Boolean).join(" · ");
  // sahne: önce zemin ve kablo, sonra arkadan öne istasyonlar (pano tekne arkasında)
  const sira = ist.map((s, i) => i).sort((a, b) => (ist[a].c === "pano" ? -1 : 0) - (ist[b].c === "pano" ? -1 : 0));
  // ad satırı: yakın istasyonlarda adlar iki sıraya dağılır (üst üste binmesin)
  const satir = {}; let onceki = null, son = 0; ist.map((s, i) => i).filter(i => ist[i].c !== "pano").sort((a, b) => merkez(ist[a]) - merkez(ist[b])).forEach(i => {
    const genis = Math.max(ist[i].ad.length, 8) * 0.27; satir[i] = onceki !== null && merkez(ist[i]) - genis / 2 < onceki ? 1 - son : 0; son = satir[i]; onceki = merkez(ist[i]) + genis / 2; });
  const sonX = Math.max(...ist.map(s => s.x + (s.w || 3))) + 2, k1 = P(-0.5, 0, KZ), k2 = P(sonX, 0, KZ), W = Math.ceil(P(sonX + 3, 8, 0)[0]);
  const zemin = `<polygon points="${pts([P(-1, -2.2, 0), P(sonX + 1, -2.2, 0), P(sonX + 1, 8, 0), P(-1, 8, 0)])}" fill="#cfd5dc" stroke="#b8c0ca" pointer-events="none"/>` +
    [-2.0, 7.6].map(y => `<line x1="${P(-1, y, 0)[0]}" y1="${P(-1, y, 0)[1]}" x2="${P(sonX + 1, y, 0)[0]}" y2="${P(sonX + 1, y, 0)[1]}" stroke="#eab308" stroke-width="2.2" stroke-dasharray="14 8" pointer-events="none"/>`).join("");
  const svg = `<svg viewBox="0 30 ${W} 312" xmlns="http://www.w3.org/2000/svg">${zemin}
    <line x1="${k1[0]}" y1="${k1[1]}" x2="${k2[0]}" y2="${k2[1]}" stroke="#111827" stroke-width="3.2" stroke-linecap="round" pointer-events="none"/>
    ${sira.map(i => { const s = ist[i], r = s.cihazlar.some(c => c.renk === "k") ? "#dc2626" : s.cihazlar.some(c => c.renk === "s") ? "#eab308" : s.cihazlar.length ? "#16a34a" : "";
      const [nx, ny] = etiketYer(s, satir[i] || 0), m = Math.max(s.ad.length, 4) * 3.1; return `<g class="ist" data-i="${i}" tabindex="0"><g class="sekil">${CIZ[s.c](s)}</g>${etiket(s, satir[i] || 0, s.ad)}${r ? `<circle cx="${(nx - m - 7).toFixed(1)}" cy="${(ny - 4).toFixed(1)}" r="4.5" fill="${r}"/>` : ""}</g>`; }).join("")}</svg>`;
  const tumC = [...new Set(ist.flatMap(s => s.cihazlar))];
  $("#app").innerHTML = `<div class="kart"><div class="mb"><div><h1>${esc(id)} · ${esc(v(mr["makine adı"]) || "Ekstruder hattı")}</h1><div class="alt">${esc([v(mr["hat / bölüm"]), v(mr["üretici / otomasyon"])].filter(Boolean).join(" · "))}</div>${en ? `<div class="en">${esc(en)}</div>` : ""}</div>
      <div class="lej"><span><span class="nok g"></span> hazır</span><span><span class="nok s"></span> kalibrasyonda</span><span><span class="nok k"></span> arıza / süresi geçmiş</span></div></div></div>
    ${planCiz(id)}<div class="sahne">${svg}</div><div class="akis">Kablonun akışı soldan sağa → · Makinenin üzerine gelin ya da dokunun: büyür, teknik verisi ve parçaları aşağıda görünür</div>

      ${tumC.map(c => `<div class="sat"><span class="nok ${c.renk}"></span><a href="cihaz.html?id=${encodeURIComponent(c.id)}">${esc(c.id)}</a><span>${esc(c.ad)}${c.marka ? " · " + esc(c.marka) : ""}</span><span style="color:#64748b">${esc(c.neden)}</span></div>`).join("") || '<div class="msg">Bu makineye bağlı ölçüm cihazı yok.</div>'}</div>`;
  const goster = i => { const s = ist[i]; document.querySelectorAll(".ist.secili").forEach(x => x.classList.remove("secili")); document.querySelector(`.ist[data-i="${i}"]`).classList.add("secili");
    $("#detay").innerHTML = `<h2>${esc(s.ad)}</h2>${(s.bilgi || []).length ? `<div class="tb">${s.bilgi.map(b => `<div><small>${esc(b[0])}</small><b>${esc(b[1])}</b></div>`).join("")}</div>` : ""}

}
