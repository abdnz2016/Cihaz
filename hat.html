<title>Hat görünümü – Seval Kablo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#0f172a}
.top{background:linear-gradient(135deg,#0d1b36,#1d4a85);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:19px}.top a{color:#fff;font-size:13px;opacity:.85;margin-left:12px}
.wrap{max-width:1760px;margin:0 auto;padding:12px}
.kart{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.mb{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mb h1{margin:0;font-size:26px;color:#14305e}.mb .alt{color:#475569;font-size:14px;margin-top:2px}.mb .en{font-weight:700;font-size:14px;margin-top:6px}
.lej{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#475569;align-items:center}.nok{width:10px;height:10px;border-radius:50%;display:inline-block}
.g{background:#16a34a}.s{background:#eab308}.k{background:#dc2626}.b{background:#cbd5e1}
.hat{position:relative;overflow-x:auto;overflow-y:visible;padding:96px 20px 24px;background:linear-gradient(#f8fafc,#eef2f7);border-radius:14px;border:1px solid #e2e8f0}
.ray{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:max-content;padding:0 10px}
.kablo{position:absolute;left:0;right:0;bottom:96px;height:4px;background:#1f2937;border-radius:2px;z-index:0}
.ist{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:104px;cursor:pointer;transition:transform .18s ease;transform-origin:50% 85%}
.ist.genis{width:180px}.ist .gor{position:relative;height:112px;display:flex;align-items:flex-end;justify-content:center}.ist .gor svg{width:100%}
.ist .gor svg{max-width:100%;height:auto}.ist .gor img{height:86px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ist .et{margin-top:8px;font-size:12px;font-weight:800;text-align:center;line-height:1.2;color:#14305e;min-height:30px}
.ist .cd{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:3px;min-height:14px}
.ist:hover{transform:scale(1.55);z-index:5}
.ipucu{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);width:250px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.25);padding:10px 12px;font-size:11px;text-align:left;z-index:10;cursor:default}
.ist.secili{transform:scale(1.55);z-index:5}.ist.secili .et{color:#b88b36}
#detay{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin:12px 0;min-height:110px}
#detay .ipucu{display:block;position:static;transform:none;width:auto;box-shadow:none;border:0;padding:0;font-size:14px}
#detay .ipucu b.t{font-size:18px}#detay .ipucu a.c{display:inline-block;vertical-align:top;width:300px;margin:6px 8px 0 0;font-size:13px}
.ipucu b.t{display:block;font-size:13px;color:#14305e;margin-bottom:3px}.ipucu .r{color:#475569;margin-bottom:6px}
.ipucu a.c{display:block;border:1px solid #e2e8f0;border-radius:8px;padding:6px 7px;margin-top:5px;text-decoration:none;color:#0f172a;background:#f8fafc}
.ipucu a.c small{display:block;color:#64748b;margin-top:2px}.ipucu .yok{color:#94a3b8;font-style:italic}
.akis{font-size:12px;color:#64748b;margin-top:10px;text-align:center}
.sat{display:grid;grid-template-columns:20px 90px 1fr 220px;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;align-items:center}
.sat a{color:#14305e;font-weight:700}
.msg{color:#64748b;font-size:14px;padding:10px}
@media print{.top a{display:none}.ist:hover{transform:none}}
</style></head><body>

  toplayici: '<svg viewBox="0 0 110 110" width="108" height="108"><rect x="8" y="94" width="94" height="10" rx="2" fill="#475569"/><rect x="14" y="40" width="7" height="56" fill="#64748b"/><rect x="89" y="40" width="7" height="56" fill="#64748b"/><circle cx="55" cy="56" r="36" fill="#f59e0b" stroke="#b45309" stroke-width="3"/><circle cx="55" cy="56" r="24" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><circle cx="55" cy="56" r="7" fill="#78350f"/><rect x="92" y="62" width="16" height="22" rx="2" fill="#1e3a8a"/></svg>'
};

async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`), t = await r.text();
  const j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)); if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label)); return j.table.rows.map(x => { const o = {}; H.forEach((h, i) => { o[h] = x.c && x.c[i] ? x.c[i] : null; }); return o; });
}
const v = c => c ? String(c.v ?? "").trim() : "", tar = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); return m ? new Date(+m[1], +m[2], +m[3]) : null; };
const fz = d => d ? d.toLocaleDateString("tr-TR") : "–";
const makineKodu = s => { const m = /(?:^|[^A-ZÇĞİÖŞÜ])(AK|BK|CT|CV|DK|EK|KN|KT|OR|PL|RJ|ZR)[\s\-]?0*(\d{1,2})(?!\d)/i.exec(String(s || "").toLocaleUpperCase("tr")); return m ? "UR-" + m[1].toUpperCase() + ("0" + m[2]).slice(-2) : ""; };

async function yukle(){
  const id = (new URLSearchParams(location.search).get("id") || "UR-EK03").toUpperCase(); $("#mk").href = "makine.html?id=" + encodeURIComponent(id);
  let C = [], M = [], K = [];
  try{ [C, M, K] = await Promise.all([sekme("Cihazlar"), sekme("Makinalar").catch(() => []), sekme("Karne").catch(() => [])]); }
  catch(e){ $("#app").innerHTML = `<div class="msg">Veriler alınamadı: ${esc(e.message)}</div>`; return; }
  const mr = M.find(r => key(v(r["makine kodu"])) === key(id)) || {}, bugun = new Date(); bugun.setHours(0, 0, 0, 0);
  const acik = {}; K.forEach(r => { if(!v(r["bitiş"]) && /^(Arıza|Tamir|Kalibrasyon)$/.test(v(r["tür"]))) acik[key(v(r["kayıt no"]))] = v(r["tür"]); });
  const cih = C.map(r => ({ id:v(r["kayıt no"]), ad:v(r["cihaz adı"]), marka:v(r["marka"]), model:v(r["model"]), yer:v(r["bulunduğu yer"]), durum:v(r["cihaz durumu"]),
      kn:tar(r["sonraki kalibrasyon"]), dn:tar(r["sonraki doğrulama"]), ds:v(r["doğrulama sonucu"]) }))
    .filter(c => c.id && (makineKodu(c.yer) === key(id) || makineKodu(c.model) === key(id)))
    .map(c => { const n = []; if(acik[key(c.id)] && acik[key(c.id)] !== "Kalibrasyon") n.push("arızada");
      if(c.kn && c.kn < bugun) n.push("kalibrasyon süresi geçti"); if(c.dn && c.dn < bugun) n.push("doğrulama süresi geçti"); if(/RAPORUNA|OLUMSUZ/i.test(c.ds)) n.push("ölçüm raporuna bakınız");
      c.renk = n.length ? "k" : acik[key(c.id)] === "Kalibrasyon" ? "s" : "g"; c.neden = n.join(" · ") || (acik[key(c.id)] === "Kalibrasyon" ? "kalibrasyonda" : "kullanıma hazır"); return c; })
    .sort((a, b) => a.id.localeCompare(b.id, "tr", { numeric:true }));
  // cihazları istasyonlara yerleştir
  const tur = c => { const n = norm(c.ad); return /çap|cap ölç/.test(n) ? "cap" : /spark/.test(n) ? "spark" : /yazı makina|yazi makina/.test(n) ? "yazi" : /metre sayac|metre disk/.test(n) ? "metre"
      : /ısı göster|isi göster|termokupl/.test(n) ? (/dolgu/.test(n) ? "dolgu" : /renk/.test(n) ? "renk" : "ana") : "diger"; };
  const gr = {}; cih.forEach(c => (gr[tur(c)] = gr[tur(c)] || []).push(c));
  const D = HATLAR[key(id)] || VARSAYILAN_EK, yerlesen = new Set();
  const ist = D.map(s => { let L = [];
    if(s.es === "cap" || s.es === "yazi") L = (gr[s.es] || []).filter((_, i) => i % D.filter(x => x.es === s.es).length === s.sira);
    else if(s.es) L = (gr[s.es] || []).slice();
    if(s.renk) L = L.concat(gr["renk"] || []);
    L.forEach(c => yerlesen.add(c.id)); return Object.assign({}, s, { cihazlar:L }); });
  const kalan = cih.filter(c => !yerlesen.has(c.id));
  const enYuksek = L => L.some(c => c.renk === "k") ? "k" : L.some(c => c.renk === "s") ? "s" : L.length ? "g" : "";
  const en = [v(mr["besleme gerilimi (v)"]) ? "⚡ " + v(mr["besleme gerilimi (v)"]).replace(/\s*V$/i, "") + " V" : "", v(mr["kurulu güç (kw)"]) ? v(mr["kurulu güç (kw)"]).replace(".", ",") + " kW" : "", v(mr["hava basıncı (bar)"]) ? "💨 " + v(mr["hava basıncı (bar)"]).replace(".", ",") + " bar" : ""].filter(Boolean).join(" · ");
  $("#app").innerHTML = `<div class="kart"><div class="mb"><div><h1>${esc(id)} · ${esc(v(mr["makine adı"]) || "Ekstruder hattı")}</h1><div class="alt">${esc([v(mr["hat / bölüm"]), v(mr["üretici / otomasyon"])].filter(Boolean).join(" · "))}</div>${en ? `<div class="en">${esc(en)}</div>` : ""}</div>
      <div class="lej"><span><span class="nok g"></span> hazır</span><span><span class="nok s"></span> kalibrasyonda</span><span><span class="nok k"></span> arıza / süresi geçmiş</span><span><span class="nok b"></span> cihaz bağlı değil</span></div></div></div>
    <div class="hat"><div class="ray"><div class="kablo"></div>
      ${ist.map((s, i) => { const r = enYuksek(s.cihazlar);
        return `<div class="ist ${s.genis ? "genis" : ""}" data-i="${i}" tabindex="0">
          <div class="ipucu"><b class="t">${esc(s.ad)}</b><div class="r">${esc(s.rol)}</div>${s.cihazlar.length ? s.cihazlar.map(c => `<a class="c" href="cihaz.html?id=${encodeURIComponent(c.id)}"><span class="nok ${c.renk}"></span> <b>${esc(c.id)}</b> · ${esc(c.ad)}<small>${esc([c.marka, /^EK[\s-]?\d/i.test(c.model) ? "" : c.model, c.neden].filter(Boolean).join(" · "))}<br>Sonraki kal.: ${fz(c.kn)} · doğ.: ${fz(c.dn)}</small></a>`).join("") : (s.es ? '<div class="yok">Bu istasyona bağlı ölçüm cihazı kaydı yok.</div>' : '<div class="yok">Makine ekipmanı (ölçüm cihazı yok).</div>')}</div>
          <div class="gor">${s.tip === "yazi" ? `<img src="${YAZI_FOTO}" alt="Yazı makinası">` : SVG[s.tip]}${s.renk ? `<span style="position:absolute;right:-6px;top:4px;width:40px">${SVG.renk}</span>` : ""}</div>
          <div class="et">${esc(s.ad)}</div><div class="cd">${s.cihazlar.map(c => `<span class="nok ${c.renk}" title="${esc(c.id)}"></span>`).join("") || (s.es ? '<span class="nok b"></span>' : "")}</div></div>`; }).join("")}
    </div><div class="akis">Kablonun akış yönü: soldan sağa → · Üzerine gelin (telefonda dokunun): istasyon büyür, ayrıntısı aşağıda görünür</div></div>
    <div id="detay"><div class="msg" style="padding:0">🔎 Bir istasyonun üzerine gelin ya da dokunun: ne iş yaptığı, takılı cihaz, durumu ve tarihleri burada görünür.</div></div>
    <div class="kart"><b style="color:#14305e">Hattaki ölçüm cihazları (${cih.length})</b>
      ${cih.map(c => `<div class="sat"><span class="nok ${c.renk}"></span><a href="cihaz.html?id=${encodeURIComponent(c.id)}">${esc(c.id)}</a><span>${esc(c.ad)}${c.marka ? " · " + esc(c.marka) : ""}</span><span style="color:#64748b">${esc(c.neden)}</span></div>`).join("") || '<div class="msg">Bu makineye bağlı ölçüm cihazı yok.</div>'}
      ${kalan.length ? `<div class="msg">Hat düzeninde yeri belirlenmeyen: ${kalan.map(c => esc(c.id)).join(", ")}</div>` : ""}</div>`;
  const goster = e => { document.querySelectorAll(".ist.secili").forEach(x => x.classList.remove("secili")); e.classList.add("secili"); $("#detay").innerHTML = e.querySelector(".ipucu").outerHTML; };
  document.querySelectorAll(".ist").forEach(e => { e.addEventListener("mouseenter", () => goster(e)); e.addEventListener("click", () => goster(e)); e.addEventListener("focus", () => goster(e)); });
}
yukle();
</script></body></html>
