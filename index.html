<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1b36"><title>Seval Kablo · Cihaz Takip Sistemi</title>
<style>:root{--mavi:#16315c;--yesil:#0a7d32;--kirmizi:#b00020;--turuncu:#b45309}
body{font:15px/1.45 system-ui,Arial,sans-serif;margin:0;background:#eef1f6;color:#16213a}
header{background:var(--mavi);color:#fff;padding:12px 16px;font-weight:700;font-size:17px;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:12px auto;padding:0 10px 40px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dt{font-weight:700;color:var(--mavi);margin-bottom:8px;font-size:14px;letter-spacing:.3px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f0f2f6}.row:last-child{border:0}.k{color:#556}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:#f5f7fb;border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:#e8edf6;color:var(--mavi)}
.chip.Arıza,.chip.Tamir{background:#fde8e8;color:var(--kirmizi)}.chip.Bakım,.chip.Planlı{background:#e6f4ea;color:var(--yesil)}.chip.Kalibrasyon,.chip.Doğrulama{background:#eef0ff;color:#3a3aa0}
.ol{padding:10px 0;border-bottom:1px solid #eef0f4}.ol:last-child{border:0}.ol small{color:#667}
button{background:var(--mavi);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}button.y{background:var(--yesil)}button.l{background:#fff;color:var(--mavi);border:1px solid #c5ccd9;padding:6px 10px;font-size:13px}
label{display:block;font-size:12px;color:#556;margin-top:8px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #c5ccd9;border-radius:8px;font:inherit}
.msg{font-size:13px;margin-top:8px}.err{color:var(--kirmizi)}.ok{color:var(--yesil)}
.liste a{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f0f2f6;color:inherit;text-decoration:none}.liste a:last-child{border:0}
.gec{color:var(--kirmizi);font-weight:600}.yak{color:var(--turuncu);font-weight:600}
#kilit{position:fixed;inset:0;background:linear-gradient(135deg,#0d1b36,#1d4a85);z-index:50;display:flex;align-items:center;justify-content:center}#kilit .card{width:min(330px,90vw)}
#pdfg{position:fixed;inset:0;background:#1f2937;z-index:90;display:flex;flex-direction:column}
#pdfg .pg-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d1b36;color:#fff;padding:10px 12px}
#pdfg .pg-bar b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdfg .pg-bar button{background:#fff;color:#0d1b36;border:0;border-radius:8px;padding:7px 11px;margin-left:6px;font-weight:700;font-size:13px}
#pdfg .pg-ic{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
#pdfg canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:100%}
#pdfg .pg-msg{color:#fff;margin-top:40px;text-align:center;font-size:15px}

body.genis main{max-width:none;padding:0 14px 40px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.lst{font-size:12.5px}
table.lst th{white-space:normal;line-height:1.2;vertical-align:bottom;font-size:11.5px;padding:6px 5px}
table.lst td{padding:5px;white-space:nowrap}
table.lst td.sar{white-space:normal;min-width:90px;max-width:160px}table.lst td.kir{white-space:normal;overflow-wrap:anywhere;max-width:96px;font-size:12px}table.lst td,table.lst th{padding:5px 4px!important}
table.lst th:nth-child(2),table.lst td:nth-child(2){position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 #e6e9ef}
table.lst th:nth-child(2){background:#f3f5f9;z-index:2}
table.lst td.ik{line-height:1.35;font-size:12px}table.lst td .ok{color:#047857;font-weight:600}table.lst td.act{white-space:nowrap}table.lst td.act a,table.lst td.act button{font-size:12px;padding:3px 6px;margin:1px}
#pdfg .xlk{background:#fff;border-radius:8px;padding:12px;width:min(1100px,100%);overflow-x:auto;box-sizing:border-box}
#pdfg .xlu{background:#fef3c7;color:#92400e;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px}
#pdfg .xlk h4{margin:12px 0 6px;color:#14305e;font-size:14px}
#pdfg table.xl{border-collapse:collapse;font-size:12px;min-width:100%}#pdfg table.xl td{border:1px solid #d5dbe5;padding:4px 6px;white-space:nowrap}
#pdfg table.xl tr:first-child td{background:#14305e;color:#fff;font-weight:700}#pdfg table.xl tr.v td{background:#e0f2fe;font-weight:700}

body.genis main{max-width:none;padding:0 14px 40px}body.genis .tiles{max-width:1400px}
.tw{overflow:auto;max-height:78vh;border-radius:10px}

table.lst td:nth-child(3),table.lst td:nth-child(4){white-space:normal;min-width:110px;max-width:190px}
table.lst tr>*:nth-child(1){position:sticky;left:0;z-index:3;width:30px;min-width:30px}

table.lst tr>*:last-child{position:sticky;right:0;z-index:3;box-shadow:-2px 0 0 #e6e9ef;white-space:nowrap}
table.lst th:nth-child(1),table.lst th:nth-child(2),table.lst th:last-child{z-index:4}
table.lst tbody tr:hover td{background:#f8fafc}
table.lst td.gec{color:#b00020;font-weight:700}table.lst td.yak{color:#b45309;font-weight:700}

.et{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;white-space:nowrap}
.et-ok{background:#dcfce7;color:#047857}.et-kv{background:#fef3c7;color:#92400e}.et-no{background:#fee2e2;color:#b91c1c}

.sar{white-space:normal;min-width:90px;max-width:250px}

<script>const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A";
const SERVIS_URL = "https://script.google.com/macros/s/AKfycbxFXTZEYyDTH9SscQygnRiW9HOIx1c4v3tgdGLjId9tXpJ5G0byl_LhaCXeEPDuzH-c/exec";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim();
const key = s => String(s ?? "").trim().replace(/\s+/g,"").replace(/\//g,"-").toLocaleUpperCase("tr");
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`);
  const t = await r.text(), j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1));
  if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label));
  return j.table.rows.map(r => { const o = {}; H.forEach((h,i) => { o[h] = r.c && r.c[i] ? r.c[i] : null; }); return o; });
}
const v = c => c ? (c.v ?? "") : "";
const tarih = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); if(m) return new Date(+m[1], +m[2], +m[3]); const n = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(c.f || c.v)); return n ? new Date(+n[3], n[2]-1, +n[1]) : null; };
const fd = d => d ? `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}` : "–";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
async function servis(o){ const r = await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(o) }); return r.json(); }
const MOBIL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// Şifreli belgeyi getirir: telefonda indirir (PDF görüntüleyicide açılır), bilgisayarda yeni sekmede açar
async function belgeGetir(istek, sessiz){
  const w = (!MOBIL && !sessiz) ? window.open("", "_blank") : null;
  if(w) w.document.write("<p style='font:16px sans-serif;padding:20px'>Belge açılıyor…</p>");
  try{
    const j = await belgeVeri(istek, servis);
    if(!j.ok){ if(w) w.close(); if(/şifre/i.test(j.hata || "")) sessionStorage.removeItem("erisimPin"); alert(j.hata || "Belge açılamadı"); return false; }
    const a = j.a;
    const url = URL.createObjectURL(new Blob([a], { type: j.mime || "application/pdf" }));
    if(w){ w.location.href = url; }
    else { const d = document.createElement("a"); d.href = url; d.download = j.ad || "belge.pdf"; document.body.appendChild(d); d.click(); d.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
    return true;
  }catch(e){ if(w) w.close(); alert("Belge açılamadı: " + e.message); return false; }
}
</script></head><body>

<script>
const GUN = 30, BUGUN = new Date(), SINIR = new Date(Date.now() + GUN*864e5);
let D = []; const SECILI = new Set();
async function ac(pin, sessiz){
  try{ const j = await servis({ islem:"pin", pin }); if(j.ok){ sessionStorage.setItem("erisimPin", pin); $("#kilit").remove(); yukle(); return; }
    sessionStorage.removeItem("erisimPin"); if(!sessiz) $("#km").textContent = j.hata || "Şifre hatalı"; }
  catch(e){ $("#km").textContent = "Servise ulaşılamadı: " + e.message; }
}
$("#kb").onclick = () => ac($("#kp").value.trim()); $("#kp").onkeydown = e => { if(e.key === "Enter") ac($("#kp").value.trim()); };

function raporYazdir(M, L){
  const f = d => d ? fd(d) : "", kw = x => { const w = parseFloat(String(x.guc).replace(",", ".")); return isNaN(w) ? null : w / 1000; };
  const V = x => (/(\d+(?:[.,]\d+)?)\s*V\b/i.exec(x.bes) || [])[1] || "", Hz = x => (/([\d/]+)\s*Hz/i.exec(x.bes) || [])[1] || "";
  const temel = [["Kayıt No", x => x.id, "kod"], ["Cihaz Adı", x => x.ad], ["Marka / Model", x => [x.marka, x.model].filter(Boolean).join(" ")], ["Seri No", x => x.seri], ["Yer", x => x.yer]];
  const K = {
    liste: [["Kal. Tarihi", x => f(x.kt)], ["Sonraki Kal.", x => f(x.kn), "t_kn"], ["Sertifika No", x => x.sert], ["Doğ. Tarihi", x => f(x.dt)], ["Sonraki Doğ.", x => f(x.dn), "t_dn"], ["Kabul Kriteri", x => x.kr], ["Max Hata", x => x.mx], ["Sonuç", x => x.ks, "sonuc"], ["Durum", x => x.durum]],
    sert:  [["Sertifika No", x => x.sert], ["Kal. Tarihi", x => f(x.kt)], ["Sonraki Kal.", x => f(x.kn), "t_kn"], ["Kalibrasyon Firması", x => x.firma]],
    dogf:  [["Doğrulama Tarihi", x => f(x.dt)], ["Sonraki Doğrulama", x => f(x.dn), "t_dn"], ["Durum", x => x.durum]],
    dogyap:[["Doğrulama Tarihi", x => f(x.dt)], ["Sonraki Doğrulama", x => f(x.dn), "t_dn"]],
    rapor: [["Kal. Tarihi", x => f(x.kt)], ["Kabul Kriteri", x => x.kr], ["Max Hata", x => x.mx], ["Sonuç", x => x.ks, "sonuc"]],
    kalk:  [["Sertifika No", x => x.sert], ["Kal. Tarihi", x => f(x.kt)], ["Kabul Kriteri", x => x.kr], ["Max Hata", x => x.mx], ["Sonuç", x => x.ks, "sonuc"]],
    enerji:[["Kurulu Güç (kW)", x => kw(x) === null ? "" : kw(x).toLocaleString("tr", { maximumFractionDigits:3 }), "sayi"], ["Gerilim (V)", V], ["Frekans (Hz)", Hz], ["Hacim / Kapasite", x => x.hac], ["Maks. Değer", x => x.mak]],
    karne: [["Planlı Bakım", x => f(x.b), "t_b"], ["Durum", x => x.durum]],
    talimat:[["Talimat Kodu", x => x.tk]],
    qr:    [["Kal. Tarihi", x => f(x.kt)], ["Doğ. Tarihi", x => f(x.dt)], ["Durum", x => x.durum]],
    yonet: [["Kal. Periyodu (ay)", x => x.kper || ""], ["Doğ. Periyodu (ay)", x => x.dper || ""], ["Durum", x => x.durum]]
  };
  const kol = temel.concat(K[mod] || []), yatay = kol.length > 8;
  const sinif = (k, x, d) => (k[2] || "").startsWith("t_") ? durumu(x[k[2].slice(2)]) : (k[2] === "sonuc" ? (d === "UYGUN" ? "iyi" : (d ? "bak" : "")) : (k[2] || ""));
  const top = L.reduce((s,x) => s + (kw(x) || 0), 0), tr = n => n.toLocaleString("tr", { maximumFractionDigits:2 });
  let ozet = `<b>${L.length}</b> cihaz`;
  if(mod === "enerji"){ const Y = {}; L.forEach(x => { Y[x.yer || "—"] = (Y[x.yer || "—"] || 0) + (kw(x) || 0); });
    ozet += ` · toplam kurulu güç <b>${tr(top)} kW</b><div class="yer">${Object.entries(Y).sort((a,b) => b[1]-a[1]).map(([y,k]) => `<span>${esc(y)}: <b>${tr(k)} kW</b></span>`).join("")}</div>`; }
  const filtre = [$("#f_ad").value, $("#f_yer").value, $("#ara").value ? "arama: " + $("#ara").value : ""].filter(Boolean).join(" · ");
  const w = window.open("", "_blank"); if(!w) return alert("Açılır pencere engellendi.");
  w.document.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(M.ad)}</title><style>
    @page{size:A4 ${yatay ? "landscape" : "portrait"};margin:10mm}
    body{font:11px/1.35 Arial,Helvetica,sans-serif;color:#0f172a;margin:0;padding:10mm}
    .bas{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #e31e24;padding-bottom:8px}
    .bas img{height:30px}.bas .s{text-align:right}.bas .s b{display:block;font-size:16px;color:#14305e}.bas .s small{color:#64748b}
    .oz{margin:10px 0 8px;background:#f1f5f9;border-left:4px solid #14305e;border-radius:4px;padding:7px 10px;font-size:12px}
    .oz .f{color:#64748b;font-size:11px;margin-top:2px}.oz .yer{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px}
    table{border-collapse:collapse;width:100%}th{background:#14305e;color:#fff;font-size:10px;text-align:left;padding:6px 5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    td{padding:5px;border-bottom:1px solid #e2e8f0;vertical-align:top}tr:nth-child(even) td{background:#f8fafc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    td.kod{font-weight:700;color:#14305e;white-space:nowrap}td.sayi{text-align:right;font-weight:700}td.gec{color:#b00020;font-weight:700}td.yak{color:#b45309;font-weight:700}td.iyi{color:#047857;font-weight:700}td.bak{color:#b45309;font-weight:700}
    tfoot td{font-weight:700;background:#e0f2fe!important;border-top:2px solid #14305e;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .alt{display:flex;justify-content:space-between;margin-top:22px;font-size:10.5px;color:#475569}.alt b{display:block;color:#0f172a;font-size:11.5px}
    thead{display:table-header-group}tr{break-inside:avoid}
    .dugme{position:fixed;right:12px;top:12px;background:#14305e;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px}@media print{.dugme{display:none}body{padding:0}}
  </style></head><body><button class="dugme" onclick="print()">🖨 Yazdır / PDF</button>
  <div class="bas"><img src="${RAPOR_LOGO}" alt="Seval Kablo"><div class="s"><b>${esc(M.ad)}</b><small>Cihaz Takip Sistemi · ${fd(BUGUN)}</small></div></div>
  <div class="oz">${ozet}${filtre ? `<div class="f">Filtre: ${esc(filtre)}</div>` : ""}</div>
  <table><thead><tr><th>#</th>${kol.map(k => `<th>${esc(k[0])}</th>`).join("")}</tr></thead><tbody>
  ${L.map((x,i) => `<tr><td>${i+1}</td>${kol.map(k => { const d = k[1](x) ?? ""; return `<td class="${sinif(k, x, d)}">${esc(d)}</td>`; }).join("")}</tr>`).join("")}
  </tbody>${mod === "enerji" ? `<tfoot><tr><td></td><td colspan="5">TOPLAM</td><td class="sayi">${tr(top)}</td><td colspan="${kol.length - 6}"></td></tr></tfoot>` : ""}</table>
  <div class="alt"><span>SEVAL KABLO · Kalite Güvence · +90 256 311 17 70</span><span style="text-align:right"><b>Abdullah DENİZ</b>Lab. Personeli</span></div>
  </body></html>`); w.document.close();
}

/* ===== Sayfa içi PDF görüntüleyici (şifreli belgeler indirilmeden ekranda açılır) ===== */
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function pdfjsYukle(){ return window.pdfjsLib ? Promise.resolve(window.pdfjsLib) : new Promise((ok, hata) => { const s = document.createElement("script"); s.src = PDFJS_URL; s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; ok(window.pdfjsLib); }; s.onerror = () => hata(new Error("PDF görüntüleyici yüklenemedi")); document.head.appendChild(s); }); }
async function belgeGoster(istek, baslik){
  const kap = document.createElement("div"); kap.id = "pdfg";
  kap.innerHTML = `<div class="pg-bar"><b>${esc(baslik || "Belge")}</b><span><button class="pg-in">⬇ İndir</button><button class="pg-x">✕</button></span></div><div class="pg-ic"><div class="pg-msg">Belge açılıyor…</div></div>`;
  document.body.appendChild(kap); document.body.style.overflow = "hidden";
  const kapat = () => { kap.remove(); document.body.style.overflow = ""; };
  kap.querySelector(".pg-x").onclick = kapat;
  try{
    const j = await belgeVeri(istek, servis);
    if(!j.ok){ if(/şifre/i.test(j.hata || "")) sessionStorage.removeItem("erisimPin"); kap.querySelector(".pg-msg").textContent = "⚠ " + (j.hata || "Belge açılamadı"); return false; }
    const a = j.a;
    const blob = new Blob([a], { type: j.mime || "application/pdf" });
    kap.querySelector(".pg-in").onclick = () => { const u = URL.createObjectURL(blob), d = document.createElement("a"); d.href = u; d.download = j.ad || "belge.pdf"; document.body.appendChild(d); d.click(); d.remove(); };
    if(/sheet|excel|xls/i.test((j.mime || "") + " " + (j.ad || ""))){ await excelGoster(a.slice(), istek.id, kap.querySelector(".pg-ic")); return true; }
    if(!/pdf/i.test(j.mime || "pdf")){ kap.querySelector(".pg-msg").textContent = "Bu belge PDF değil (" + (j.ad || "") + "). İndir düğmesiyle açın."; return true; }
    const lib = await pdfjsYukle(), pdf = await lib.getDocument({ data: a.slice() }).promise, ic = kap.querySelector(".pg-ic");
    ic.innerHTML = "";
    const gen = Math.min(ic.clientWidth - 16, 1100), oran = window.devicePixelRatio || 1;
    for(let n = 1; n <= pdf.numPages; n++){
      const sayfa = await pdf.getPage(n), v0 = sayfa.getViewport({ scale:1 }), olcek = gen / v0.width, v = sayfa.getViewport({ scale: olcek * oran });
      const c = document.createElement("canvas"); c.width = v.width; c.height = v.height; c.style.width = (v.width / oran) + "px"; c.style.height = (v.height / oran) + "px";
      ic.appendChild(c); await sayfa.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
    }
    return true;
  }catch(e){
    kap.querySelector(".pg-ic").innerHTML = `<div class="pg-msg">⚠ ${esc(e.message)}<br><small>İndir düğmesiyle telefona kaydedip açabilirsiniz.</small></div>`; return false;
  }
}

function xlsxYukle(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, hata) => { const s = document.createElement("script"); s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => hata(new Error("Excel okuyucu yüklenemedi")); document.head.appendChild(s); }); }
function kodAnahtar(s){ const t = String(s ?? "").toLocaleUpperCase("tr").replace(/[\s\-_.]/g, ""); return [t, t.replace(/^([A-ZÇĞİÖŞÜ]+)0+(\d)/, "$1$2")]; }
async function excelGoster(bayt, id, ic){
  const X = await xlsxYukle(), wb = X.read(bayt, { type:"array" }), [k1, k2] = kodAnahtar(id), es = c => { const [a, b] = kodAnahtar(c); return a && (a === k1 || b === k2); };
  const kodGibi = c => /^[A-ZÇĞİÖŞÜ]{1,4}[\s\-]?\d{1,4}(\/\d+)?$/i.test(String(c ?? "").trim());
  const tablo = (satirlar, vurgu) => { const kol = []; satirlar.forEach(r => r.forEach((c, j) => { if(String(c ?? "").trim() !== "") kol[j] = 1; }));
    const J = kol.map((v, j) => v ? j : -1).filter(j => j >= 0);
    return `<table class="xl">${satirlar.map((r, i) => `<tr class="${vurgu(i) ? "v" : ""}">${J.map(j => `<td>${esc(r[j] ?? "")}</td>`).join("")}</tr>`).join("")}</table>`; };
  let html = "";
  wb.SheetNames.forEach(ad => {
    const ws = wb.Sheets[ad], R = X.utils.sheet_to_json(ws, { header:1, raw:false, defval:"" });
    if(es(ad)){ html += `<h4>Sayfa: ${esc(ad)}</h4>` + tablo(R.filter(r => r.some(c => String(c).trim() !== "")), () => false); return; }
    const M = R.map((r, i) => r.some(es) ? i : -1).filter(i => i >= 0); if(!M.length) return;
    let bas = M[0];   // tablo başlığı: ilk eşleşmenin üstünde, içinde cihaz kodu olmayan ve en az 3 dolu hücreli satırlar (en fazla 3)
    const ust = []; for(let i = M[0] - 1; i >= 0 && ust.length < 3; i--){ const r = R[i], dolu = r.filter(c => String(c).trim() !== "").length; if(r.some(kodGibi)) { if(ust.length) break; else continue; } if(dolu >= 2) ust.unshift(i); else if(ust.length) break; }
    const alt = []; for(let i = M[M.length - 1] + 1; i < R.length && alt.length < 4; i++) if(R[i].some(c => /tarih|doğrulayan|yapan/i.test(String(c)))) alt.push(i);
    const sec = [...ust, ...M, ...alt];
    html += `<h4>Sayfa: ${esc(ad)}</h4>` + tablo(sec.map(i => R[i]), i => M.includes(sec[i]));
  });
  ic.innerHTML = `<div class="xlk"><div class="xlu">⚠ Bu cihazın doğrulaması <b>eski Excel kaydından</b> gösteriliyor (yeni formatta form yok). Yalnızca <b>${esc(id)}</b> ile ilgili satırlar/sayfalar listelenir; tüm dosya için ⬇ İndir.</div>${html || `<p>Excel dosyasında ${esc(id)} kodu bulunamadı.</p>`}</div>`;
}

function eskiKayit(x){
  const m = pencere(`<div class="dt">📋 ${esc(x.id)} · ${esc(x.ad)}</div>
    <p style="margin:6px 0 10px;line-height:1.5">Bu cihazın doğrulaması <b>henüz yeni formda yapılmadı</b>. Kaydı, grubun tüm cihazlarını içeren <b>eski toplu Excel dosyasına</b> bağlı; bu yüzden PDF olarak açılmıyor ve tüm grup görünüyor.</p>
    <p style="margin:0 0 12px;color:#475569;font-size:13px">Yeni formda gerçek ölçümle doğrulama yapıp kaydettiğinizde, bu cihazın kendi PDF formu oluşur ve link kendiliğinden ona geçer.</p>
    <p><a class="y" href="dogrulama.html?id=${encodeURIComponent(x.id)}" style="display:inline-block;background:#0a7d32;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600">🧪 Doğrulama Yap (yeni form)</a></p>
    <p><button class="l" id="ek_indir">⬇ Eski Excel kaydını indir</button> <button class="l" id="ek_kapat">Kapat</button></p>`);
  m.querySelector("#ek_kapat").onclick = () => m.remove();
  m.querySelector("#ek_indir").onclick = () => { belgeGetir({ islem:"dosya", tur:"dogrulama", id:x.id, pin:sessionStorage.getItem("erisimPin") }, true); };
}
document.addEventListener("click", e => { const b = e.target.closest("button[data-eski]"); if(!b) return; const x = D.find(d => d.id === b.dataset.eski); if(x) eskiKayit(x); });

// Çıkarılan cihazlar (Silinenler sekmesi) – geri alınınca aynı kayıt no ile sertifika, doğrulama formu, karne ve ölçümler kendiliğinden bağlanır
async function silinenlerAc(){
  const m = pencere(`<div class="dt">♻ Çıkarılan cihazlar</div><div class="msg" id="s_msg">Yükleniyor…</div><div id="s_list"></div><p><button class="l" id="s_kapat">Kapat</button></p>`);
  m.querySelector("#s_kapat").onclick = () => m.remove();
  let L = [];
  try { L = await sekme("Silinenler"); } catch(e) { m.querySelector("#s_msg").textContent = "Silinenler sekmesi okunamadı."; return; }
  const sim = {}, gor = {}; D.forEach(d => sim[key(d.id)] = 1);
  const R = L.reverse().map(r => ({ id:String(v(r["kayıt no"])).trim(), ad:v(r["cihaz adı"]), seri:v(r["seri numarası"]), neden:v(r["çıkarma nedeni"]), t:tarih(r["silinme tarihi"]) }))
    .filter(x => x.id && !sim[key(x.id)] && !gor[key(x.id)] && (gor[key(x.id)] = 1));
  m.querySelector("#s_msg").textContent = R.length ? R.length + " cihaz çıkarılmış durumda. Geri alınan cihazın bütün bilgileri ve belgeleri geri gelir." : "Çıkarılmış cihaz yok.";
  m.querySelector("#s_list").innerHTML = R.map(x => `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #e6e9ef">
      <div><b>${esc(x.id)}</b> · ${esc(x.ad)}${x.seri ? " · S/N " + esc(x.seri) : ""}<br><span style="font-size:12px;color:#64748b">${x.t ? fd(x.t) + " · " : ""}${esc(x.neden || "neden yazılmamış")}</span></div>
      <button class="y" data-geri="${esc(x.id)}">♻ Geri al</button></div>`).join("");
  m.querySelectorAll("[data-geri]").forEach(b => b.onclick = async () => {
    const id = b.dataset.geri; if(!confirm(id + " geri alınsın mı?")) return;
    let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin) return; }
    const msg = m.querySelector("#s_msg"); msg.className = "msg"; msg.textContent = id + " geri alınıyor…";
    try { const j = await servis({ islem:"cihaz", eylem:"geri", id, pin });
      if(j.ok){ localStorage.setItem("kayitPin", pin); msg.className = "msg ok"; msg.textContent = "✓ " + j.mesaj; setTimeout(() => { m.remove(); yukle(); }, 1800); }
      else { if(/PIN/.test(j.hata || "")) localStorage.removeItem("kayitPin"); msg.className = "msg err"; msg.textContent = "⚠ " + j.hata; } }
    catch(e){ msg.className = "msg err"; msg.textContent = "⚠ Servise ulaşılamadı: " + e.message; }
  });
}

// v18.4: sonuç etiketi (kompakt) – kalibrasyon kontrolü ve doğrulama sonucu
function sonucEt(s){ s = String(s || "").trim(); if(!s) return "–"; const u = /^UYGUN/i.test(s), kv = /KARAR VER|SONUÇLARINA/i.test(s);
  return `<span class="et ${u ? "et-ok" : kv ? "et-kv" : "et-no"}">${esc(u ? "UYGUN" : kv ? "ÖLÇÜM SONUÇ. BAKINIZ" : /ÖLÇÜM|OLUMSUZ/i.test(s) ? "ÖLÇÜM RAP. BAKINIZ" : s)}</span>`; }

// v18.5: listede satıra tıklayınca cihaz kartı öne açılır (enerji kartı gibi); belge düğmeleri satırdakilerle aynı
document.addEventListener("click", e => {
  const tr = e.target.closest && e.target.closest("tr[data-kart]"); if(!tr || e.target.closest("input,button,a,select,label")) return;
  const x = D.find(d => d.id === tr.dataset.kart); if(x) cihazKart(x, tr.cells[tr.cells.length - 1].innerHTML);
});
function cihazKart(x, belge){
  const s = (k, v2) => v2 ? `<div class="row"><span class="k">${k}</span><span>${v2}</span></div>` : "";
  const blok = (bas, ic) => ic ? `<div style="margin:10px 0 4px;font-weight:700;color:#14305e;font-size:13px">${bas}</div>${ic}` : "";
  pencere(`<div class="dt">${esc(x.id)} · ${esc(x.ad)}</div><div style="color:#64748b;font-size:13px;margin-bottom:8px">${esc([x.marka, x.model].filter(Boolean).join(" "))}${x.seri ? " · S/N " + esc(x.seri) : ""}</div>
    ${s("Bulunduğu yer", esc(x.yer))}${s("Ölçüm aralığı", esc(x.aralik))}${s("Çözünürlük", esc(x.coz))}${s("Cihaz durumu", esc(x.durum))}
    ${blok("📄 Kalibrasyon", x.kal ? s("Tarih → sonraki", fd(x.kt) + ` → <span class="${durumu(x.kn)}">${fd(x.kn)}</span>`) + s("Periyot", x.kper ? x.kper + " ay" : "") + s("Sertifika no", esc(x.sert)) + s("Yapan firma", esc(x.firma)) + s("Kal. kontrol", x.ks ? sonucEt(x.ks) : "") + s("Kriter", esc(x.kr)) + s("En büyük hata", esc(x.mx)) : "")}
    ${blok("📋 Doğrulama", x.dog ? s("Tarih → sonraki", fd(x.dt) + ` → <span class="${durumu(x.dn)}">${fd(x.dn)}</span>`) + s("Periyot", x.dper ? x.dper + " ay" : "") + s("Sonuç", x.dsonuc ? sonucEt(x.dsonuc) : "") + s("Kriter", esc(x.dkr)) + s("En büyük hata", esc(x.dmx)) : "")}
    ${belge ? `<div style="margin:12px 0 4px;font-weight:700;color:#14305e;font-size:13px">Belgeler</div><div class="kbel" style="display:flex;gap:6px;flex-wrap:wrap">${belge}</div>` : ""}
    <p><button class="l" onclick="this.closest('#pen').remove()">Kapat</button></p>`);
}

// v18.7: belge önbelleği – açılan PDF cihazda saklanır; sonraki açılışta sunucu yalnızca "değişti mi" der (şifre yine sorulur)
const BELGE_IDB = { db:null,
  ac(){ return this.db || (this.db = new Promise((ok, red) => { const r = indexedDB.open("cihazBelge", 1); r.onupgradeneeded = () => r.result.createObjectStore("b"); r.onsuccess = () => ok(r.result); r.onerror = () => red(r.error); })); },
  async al(k){ try{ const d = await this.ac(); return await new Promise(ok => { const q = d.transaction("b").objectStore("b").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }catch(e){ return null; } },
  async koy(k, v){ try{ const d = await this.ac(); d.transaction("b", "readwrite").objectStore("b").put(v, k); }catch(e){} } };
async function belgeVeri(istek, post){
  const k = [istek.tur, istek.id, istek.fid || ""].join("|"), on = await BELGE_IDB.al(k);
  const j = await post(Object.assign({}, istek, on && on.fid ? { bilinen: on.fid } : {}));
  if(!j.ok) return j;
  if(j.ayni && on) return { ok:true, ad:on.ad, mime:on.mime, a:new Uint8Array(await on.blob.arrayBuffer()) };
  const bin = atob(j.veri), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  if(j.fid) BELGE_IDB.koy(k, { fid:j.fid, ad:j.ad, mime:j.mime, blob:new Blob([a], { type:j.mime || "application/pdf" }) });
  return { ok:true, ad:j.ad, mime:j.mime, a };
}

// v18.7: sayfa açılınca sunucuyu ve PDF görüntüleyiciyi önceden hazırla (ilk tıklamadaki bekleme kalkar)
window.addEventListener("load", () => { setTimeout(() => { try{ fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ islem:"ping" }) }).catch(() => {}); }catch(e){}
  try{ if(typeof pdfjsYukle === "function") pdfjsYukle().catch(() => {}); }catch(e){} }, 800); });

// v18.8: etiket fotoğrafı → sunucuda Drive OCR → alanlar burada ayrıştırılır; yalnızca BOŞ alanlar doldurulur, dolanlar sarı işaretlenir
async function etiketDoldur(dosya, m){
  const msg = m.querySelector("#y_fmsg"); msg.className = "msg"; msg.textContent = "Fotoğraf hazırlanıyor…";
  let pin = localStorage.getItem("kayitPin") || ""; if(!pin){ pin = (prompt("Kayıt PIN'i:") || "").trim(); if(!pin){ msg.textContent = ""; return; } }
  try{
    const veri = await resimKucult(dosya, 1600); msg.textContent = "Etiket okunuyor… (5–15 sn)";
    const j = await servis({ islem:"etiket", pin, veri });
    if(!j.ok){ if(/PIN/.test(j.hata || "")) localStorage.removeItem("kayitPin"); msg.className = "msg err"; msg.textContent = "⚠ " + j.hata; return; }
    localStorage.setItem("kayitPin", pin);
    const A = etiketAyristir(j.metin || ""), dol = [];
    Object.entries(A).forEach(([lab, val]) => { const i = m.querySelector(`[data-a="${lab}"]`); if(i && val && !i.value.trim()){ i.value = val; i.style.background = "#fef9c3"; dol.push(lab); } });
    msg.className = "msg ok"; msg.textContent = dol.length ? "✓ Dolduruldu: " + dol.join(", ") + " – sarı alanları kontrol edin." : "Etiketten yeni bilgi çıkarılamadı; okunan metin aşağıda.";
    let ac = m.querySelector("#y_metin"); if(!ac){ ac = document.createElement("details"); ac.id = "y_metin"; ac.style.cssText = "margin:6px 0;font-size:12px"; m.querySelector("#y_fmsg").parentNode.after(ac); }
    ac.innerHTML = `<summary>Etiketten okunan metin (kopyalayıp alanlara yapıştırabilirsiniz)</summary><pre style="white-space:pre-wrap;background:#f8fafc;padding:8px;border-radius:8px;max-height:200px;overflow:auto">${esc(j.metin || "")}</pre>`;
  }catch(e){ msg.className = "msg err"; msg.textContent = "⚠ " + e.message; }
}
function resimKucult(f, enfazla){ return new Promise((ok, red) => { const r = new FileReader(); r.onerror = () => red(new Error("Fotoğraf okunamadı"));
  r.onload = () => { const im = new Image(); im.onerror = () => red(new Error("Fotoğraf açılamadı")); im.onload = () => {
    const o = Math.min(1, enfazla / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * o); c.height = Math.round(im.height * o);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]); }; im.src = r.result; }; r.readAsDataURL(f); }); }
function etiketAyristir(t){
  const T = String(t).replace(/\r/g, ""), tek = T.replace(/\s+/g, " "), A = {}, al = (re, s = tek) => { const m = re.exec(s); return m ? m[1].trim() : ""; };
  const markalar = [...new Set(D.map(d => d.marka).filter(Boolean))].sort((a, b) => b.length - a.length);
  const mk = markalar.find(b => b.length >= 3 && new RegExp("(^|[^\\p{L}])" + b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^\\p{L}]|$)", "iu").test(tek)); if(mk) A["Marka"] = mk;
  A["Model"] = al(/(?:Model|Modell|Type|Typ|Tip|Mod\.)\s*(?:No\.?)?\s*[:.\-]?\s*([A-Z0-9][A-Z0-9\-\/\. ]{1,24}?)(?=\s{2,}|\s(?:S\/?N|Seri|Serial|No|V\b|Hz|W\b)|$)/i, T.replace(/\n/g, "  "));
  A["Seri Numarası"] = al(/(?:S\/?N|Seri\s*(?:No|Numarası)?|Serial\s*(?:No\.?|Number)?|Ser\.?\s*No\.?|Fabrika\s*No|Fab\.?\s*No)\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})/i);
  const g = /(\d+(?:[.,]\d+)?)\s*(kW|kVA|VA|W)\b/i.exec(tek); if(g){ const v = parseFloat(g[1].replace(",", ".")); A["Kurulu Güç (W)"] = String(Math.round(/^k/i.test(g[2]) ? v * 1000 : v)); }
  const v = /(\d{2,3}(?:\s*[\/\-]\s*\d{2,3})?)\s*V(?:AC|DC|~)?\b/i.exec(tek), hz = /(\d{2}(?:\s*\/\s*\d{2})?)\s*Hz/i.exec(tek); if(v) A["Besleme"] = v[1].replace(/\s+/g, "") + " V" + (hz ? ", " + hz[1].replace(/\s+/g, "") + " Hz" : "");
  const ar = /(-?\d+(?:[.,]\d+)?)\s*(?:\.\.\.|…|–|-|to|~|÷)\s*(\+?-?\d+(?:[.,]\d+)?)\s*(°C|℃|mm|bar|kV|V|kg|g|N|Ω|%)/i.exec(tek); if(ar && !(/^V$/i.test(ar[3]) && A["Besleme"] && A["Besleme"].indexOf(ar[1]) === 0)) A["Ölçüm Aralığı"] = ar[1] + "–" + ar[2].replace("+", "") + " " + ar[3].replace("℃", "°C");   // besleme gerilimi aralık sanılmasın
  const cz = al(/(?:Resolution|Çözünürlük|Cozunurluk|Okunabilirlik|Readability|\bd\s*=)\s*[:.]?\s*(\d+(?:[.,]\d+)?\s*(?:°C|mm|µm|g|mg|kg|V|bar)?)/i); if(cz) A["Çözünürlük"] = cz;
  const hc = /(\d+(?:[.,]\d+)?)\s*(L|lt|litre|liter)\b/i.exec(tek); if(hc) A["Hacim / Kapasite"] = hc[1] + " L";
  const mx = al(/(?:Max\.?|Maks\.?|Maximum|T\s*max)\s*[:.=]?\s*(\d+(?:[.,]\d+)?\s*(?:°C|bar|kg|g|kV|V|A|N))/i); if(mx) A["Maks. Değer"] = mx;
  Object.keys(A).forEach(k => { if(!A[k]) delete A[k]; });
  return A;
}
