<script>const SHEET_ID = "1T7L5c7nnffw8O8HFFVLnhgjr0CnLsJ_lmk-VkAaGd_A";
const SERVIS_URL = "https://script.google.com/macros/s/AKfycbxFXTZEYyDTH9SscQygnRiW9HOIx1c4v3tgdGLjId9tXpJ5G0byl_LhaCXeEPDuzH-c/exec";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim();
const key = s => String(s ?? "").trim().replace(/\s+/g,"").replace(/\//g,"-").toLocaleUpperCase("tr");
async function sekme(ad){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(ad)}&t=${Date.now()}`);
  const t = await r.text(), j = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1));
  if(!j.table) return [];
  const H = j.table.cols.map(c => norm(c.label));
  return j.table.rows.map(r => { const o = {}; H.forEach((h,i) => { o[h] = r.c && r.c[i] ? r.c[i] : null; }); return o; });
}
const v = c => c ? (c.v ?? "") : "";
const tarih = c => { if(!c || c.v == null) return null; const m = /Date\((\d+),(\d+),(\d+)/.exec(String(c.v)); if(m) return new Date(+m[1], +m[2], +m[3]); const n = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(c.f || c.v)); return n ? new Date(+n[3], n[2]-1, +n[1]) : null; };
const fd = d => d ? `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}` : "–";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
async function servis(o){ const r = await fetch(SERVIS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(o) }); return r.json(); }
const MOBIL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// Şifreli belgeyi getirir: telefonda indirir (PDF görüntüleyicide açılır), bilgisayarda yeni sekmede açar
async function belgeGetir(istek, sessiz){
  const w = (!MOBIL && !sessiz) ? window.open("", "_blank") : null;
  if(w) w.document.write("<p style='font:16px sans-serif;padding:20px'>Belge açılıyor…</p>");
  try{
    const j = await servis(istek);
    if(!j.ok){ if(w) w.close(); if(/şifre/i.test(j.hata || "")) sessionStorage.removeItem("erisimPin"); alert(j.hata || "Belge açılamadı"); return false; }
    const bin = atob(j.veri), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([a], { type: j.mime || "application/pdf" }));
    if(w){ w.location.href = url; }
    else { const d = document.createElement("a"); d.href = url; d.download = j.ad || "belge.pdf"; document.body.appendChild(d); d.click(); d.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
    return true;
  }catch(e){ if(w) w.close(); alert("Belge açılamadı: " + e.message); return false; }
}

}

if(sessionStorage.getItem("erisimPin")) ac(sessionStorage.getItem("erisimPin"), true);

    const o = { id:String(v(r["kayıt no"])), ad:String(v(r["cihaz adı"])), marka:String(v(r["marka"])), model:String(v(r["model"])), seri:String(v(r["seri numarası"])), yer:String(v(r["bulunduğu yer"])),

      b: sb && bp ? new Date(sb.getFullYear(), sb.getMonth()+bp, sb.getDate()) : null };
    o.kal = !!(o.kt || o.kper); o.dog = !!(o.dt || o.dper); return o; });
  const sec = (sel, alan, bas) => { const L = [...new Set(D.map(x => x[alan]).filter(Boolean))].sort((a,b) => a.localeCompare(b,"tr")); $(sel).innerHTML = `<option value="">${bas}</option>` + L.map(x => `<option>${esc(x)}</option>`).join(""); };
  sec("#f_ad","ad","Tüm cihaz türleri"); sec("#f_yer","yer","Tüm laboratuvar / yerler");

const MOD = {
  liste:  { ik:"📋", ad:"Cihaz Listesi", tablo:true },
  sert:   { ik:"📄", ad:"Kalibrasyon Sertifikaları", f:x => x.sl, alt:x => `Sertifika ${x.sert || "–"} · ${fd(x.kt)}${x.firma ? " · " + x.firma : ""}`, ac:x => belge("sertifika", x.id) },
  dogf:   { ik:"📋", ad:"Doğrulama Formları", f:x => x.dl, alt:x => `Doğrulama ${fd(x.dt)} · sonraki ${fd(x.dn)}`, ac:x => belge("dogrulama", x.id) },
  rapor:  { ik:"📊", ad:"Ölçüm ve Kullanım Raporları", f:x => x.kt, alt:x => `Kalibrasyon ${fd(x.kt)}`, ac:x => git("rapor.html", x.id) },
  dogyap: { ik:"🧪", ad:"Doğrulama Yap", f:x => x.dog, alt:x => `Son doğrulama ${fd(x.dt)} · sonraki ${fd(x.dn)}`, ac:x => git("dogrulama.html", x.id) },
  qr:     { ik:"🔳", ad:"QR / Cihaz Kartları", f:x => true, alt:x => `${x.marka} ${x.model}`.trim(), ac:x => git("cihaz.html", x.id) },
  karne:  { ik:"🛠", ad:"Bakım / Arıza Karnesi", f:x => true, alt:x => x.b ? "Planlı bakım " + fd(x.b) : "", ac:x => git("karne.html", x.id) },
  talimat:{ ik:"📘", ad:"Kullanım Talimatları", f:x => x.tl || x.vt, alt:x => [x.tk, x.vt ? "🎬 video" : ""].filter(Boolean).join(" · "), ac:x => window.open(x.tl || x.vt, "_blank") },
  takip:  { ik:"⏰", ad:"Takip (süresi dolan / yaklaşan)", takip:true }
};
let mod = (location.hash || "#liste").slice(1); if(!MOD[mod]) mod = "liste";
const git = (s, id) => { location.href = s + "?id=" + encodeURIComponent(id); };
function tiles(){
  $("#tiles").innerHTML = Object.entries(MOD).map(([k,m]) => `<button class="${k===mod?"on":""}" data-m="${k}" style="--r:${RENK[k]}"><span class="sy">${m.tablo ? D.length : m.takip ? D.filter(x => durumu(x.kn)==="gec"||durumu(x.dn)==="gec").length : D.filter(m.f).length}</span><div class="ik">${IKON[k]}</div><div class="ad">${esc(m.ad)}</div><div class="ac">${esc(ACIK[k])}</div></button>`).join("");
  const kg = D.filter(x => durumu(x.kn)==="gec").length, dg = D.filter(x => durumu(x.dn)==="gec").length, yk = D.filter(x => durumu(x.kn)==="yak" || durumu(x.dn)==="yak").length;
  $("#uyari").innerHTML = (kg ? `<button class="k" data-m="takip">● ${kg} kalibrasyonu geçmiş</button>` : "") + (dg ? `<button class="k" data-m="takip">● ${dg} doğrulaması geçmiş</button>` : "") + (yk ? `<button class="t" data-m="takip">● ${yk} cihazın süresi 30 gün içinde doluyor</button>` : "") + (!kg && !dg && !yk ? `<button class="y">✓ Süresi geçen cihaz yok</button>` : "");
  $("#modad").textContent = MOD[mod].ik + " " + MOD[mod].ad;
}
document.addEventListener("click", e => { const t = e.target.closest("#tiles button, #uyari button[data-m]"); if(!t) return; mod = t.dataset.m; history.replaceState(null, "", "#" + mod); SECILI.clear(); tiles(); ciz(); $("#modad").scrollIntoView({ behavior:"smooth", block:"start" }); });
function ciz(){
  const M = MOD[mod]; $("#tabloBtn").hidden = !M.tablo; $("#g_liste").hidden = !!M.takip; $("#takip").hidden = !M.takip; $("#liste").hidden = !!M.takip;
  if(M.takip){ takipCiz(); return; }
  if(!M.tablo){ const F = filtre().filter(M.f); $("#say").textContent = F.length + " cihaz";
    const indir = /sert|dogf/.test(mod);
    $("#liste").innerHTML = `<div class="secbar"><button class="l" id="tumSec">☑ Tümünü seç</button><button class="l" id="secTemiz">☐ Temizle</button>
      ${indir ? `<button class="y" id="secIndir">⬇ Seçilenleri indir (<span class="sn">${SECILI.size}</span>)</button>` : ""}<button id="secYaz">🖨 Seçilenleri yazdır (<span class="sn">${SECILI.size}</span>)</button></div>
      <div class="sec">${F.length ? F.map(x => `<div class="sat"><input type="checkbox" data-s="${esc(x.id)}" ${SECILI.has(x.id) ? "checked" : ""}><button class="s" data-sec="${esc(x.id)}"><span class="ic"><span class="l1"><span class="rozet">${esc(x.id)}</span><b>${esc(x.ad)}</b>${x.yer ? `<span class="yer">${esc(x.yer)}</span>` : ""}</span>${M.alt(x) ? `<small>${esc(M.alt(x))}</small>` : ""}${(() => { const d = /dogf|dogyap/.test(mod) ? x.dn : x.kn; return d ? `<span class="pill ${durumu(d)}">${/dogf|dogyap/.test(mod) ? "Sonraki doğrulama" : "Sonraki kalibrasyon"}: ${fd(d)}</span>` : ""; })()}</span><span class="ok">${indir ? "🔒" : "›"}</span></button></div>`).join("") : "<small>Kayıt yok</small>"}</div>`;
    return; }
  const F = filtre(); $("#say").textContent = F.length + " cihaz";
  const td = (d) => `<td class="${durumu(d)}">${fd(d)}</td>`;
  $("#liste").innerHTML = `<div id="ptitle">SEVAL KABLO – ${esc(baslik())} (${F.length} cihaz)</div><div class="tw"><table class="lst"><thead><tr><th>Kayıt No</th><th>Cihaz Adı</th><th>Marka / Model</th><th>Seri No</th><th>Yer</th><th>Kal. Tarihi</th><th>Sonraki Kal.</th><th>Sertifika No</th><th>Doğ. Tarihi</th><th>Sonraki Doğ.</th><th>Durum</th><th class="act">Belgeler</th></tr></thead><tbody>` +
    F.map(x => `<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.ad)}</td><td>${esc(x.marka)} ${esc(x.model)}</td><td>${esc(x.seri)}</td><td>${esc(x.yer)}</td>${td(x.kn && x.kt ? x.kt : x.kt)}${td(x.kn)}<td>${esc(x.sert)}</td>${td(x.dt)}${td(x.dn)}<td>${esc(x.durum)}</td>
      <td class="act"><a href="cihaz.html?id=${encodeURIComponent(x.id)}">Kart</a>${x.sl ? `<button data-b="sertifika" data-id="${esc(x.id)}">🔒 Sertifika</button>` : ""}${x.dl ? `<button data-b="dogrulama" data-id="${esc(x.id)}">🔒 Doğrulama</button>` : ""}${x.kt ? `<a href="rapor.html?id=${encodeURIComponent(x.id)}">Rapor</a>` : ""}<a href="karne.html?id=${encodeURIComponent(x.id)}">Karne</a></td></tr>`).join("") + `</tbody></table></div>`;
}
function takipCiz(){
  const g = (f, a) => D.filter(f).sort((x,y) => (x[a]||0) - (y[a]||0)), B = [
    ["Kalibrasyonu geçmiş", g(x => durumu(x.kn)==="gec","kn"), "kn"], [`Kalibrasyonu ${GUN} gün içinde`, g(x => durumu(x.kn)==="yak","kn"), "kn"],
    ["Doğrulaması geçmiş", g(x => durumu(x.dn)==="gec","dn"), "dn"], [`Doğrulaması ${GUN} gün içinde`, g(x => durumu(x.dn)==="yak","dn"), "dn"],
    [`Planlı bakımı geçmiş / ${GUN} gün içinde`, g(x => x.b && x.b <= SINIR,"b"), "b"], ["Doğrulama bekleyenler (eski Excel kaydı, gerçek ölçüm gerekli)", g(x => x.bek,"dn"), "dn"]];
  $("#takip").innerHTML = B.map(([ad,L,a]) => `<div class="card"><div class="dt">${esc(ad)} (${L.length})</div><div class="liste">${L.length ? L.map(x => `<a href="cihaz.html?id=${encodeURIComponent(x.id)}"><span><b>${esc(x.id)}</b> · ${esc(x.ad)} <small>${esc(x.yer)}</small></span><span class="${durumu(x[a])}">${fd(x[a])}</span></a>`).join("") : "<small>Yok</small>"}</div></div>`).join("");
}
["#ara","#f_tip","#f_ad","#f_yer","#f_dur"].forEach(s => $(s).addEventListener("input", () => D.length && ciz()));
document.addEventListener("click", e => { const s = e.target.closest("button[data-sec]"); if(!s) return; const x = D.find(d => d.id === s.dataset.sec); if(x) MOD[mod].ac(x); });
$("#yazdir").onclick = () => window.print();
$("#excel").onclick = () => { const F = filtre(), s = x => `"${String(x ?? "").replace(/"/g,'""')}"`;
  const satir = [["Kayıt No","Cihaz Adı","Marka","Model","Seri No","Bulunduğu Yer","Kalibrasyon Tarihi","Sonraki Kalibrasyon","Sertifika No","Kalibrasyon Firması","Doğrulama Tarihi","Sonraki Doğrulama","Cihaz Durumu"]]
    .concat(F.map(x => [x.id,x.ad,x.marka,x.model,x.seri,x.yer,x.kt?fd(x.kt):"",x.kn?fd(x.kn):"",x.sert,x.firma,x.dt?fd(x.dt):"",x.dn?fd(x.dn):"",x.durum]));
  const blob = new Blob(["\ufeff" + satir.map(r => r.map(s).join(";")).join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Cihaz_Listesi_${iso(BUGUN)}.csv`; document.body.appendChild(a); a.click(); a.remove(); };
document.addEventListener("click", e => { const b = e.target.closest("button[data-b]"); if(b) belge(b.dataset.b, b.dataset.id); });
async function belge(tur, id){ return belgeGetir({ islem:"dosya", tur, id, pin:sessionStorage.getItem("erisimPin") });
}

document.addEventListener("change", e => { const c = e.target.closest("input[data-s]"); if(!c) return; c.checked ? SECILI.add(c.dataset.s) : SECILI.delete(c.dataset.s); document.querySelectorAll(".sn").forEach(s => s.textContent = SECILI.size); });
document.addEventListener("click", async e => {
  const id = e.target.id; if(!["tumSec","secTemiz","secIndir","secYaz"].includes(id)) return;
  const M = MOD[mod], F = filtre().filter(M.f || (() => true));
  if(id === "tumSec"){ F.forEach(x => SECILI.add(x.id)); ciz(); }
  else if(id === "secTemiz"){ SECILI.clear(); ciz(); }
  else if(id === "secIndir"){ const L = F.filter(x => SECILI.has(x.id)); if(!L.length) return alert("Önce seçim yapın.");
    const b = e.target; b.disabled = true; let n = 0;
    for(const x of L){ b.textContent = `İndiriliyor ${++n}/${L.length}…`; await belgeGetir({ islem:"dosya", tur: mod === "sert" ? "sertifika" : "dogrulama", id:x.id, pin:sessionStorage.getItem("erisimPin") }, true); await new Promise(r => setTimeout(r, 700)); }
    b.disabled = false; ciz(); }
  else if(id === "secYaz"){ const L = F.filter(x => SECILI.has(x.id)); if(!L.length) return alert("Önce seçim yapın.");
    const w = window.open("", "_blank"); w.document.write(`<html><head><meta charset="utf-8"><title>${esc(M.ad)}</title><style>body{font:12px Arial;margin:12mm}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px;text-align:left}</style></head><body><h3>SEVAL KABLO – ${esc(M.ad)} · ${fd(BUGUN)} (${L.length})</h3><table><tr><th>Kayıt No</th><th>Cihaz Adı</th><th>Marka / Model</th><th>Seri No</th><th>Yer</th><th>Bilgi</th></tr>${L.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.ad)}</td><td>${esc(x.marka)} ${esc(x.model)}</td><td>${esc(x.seri)}</td><td>${esc(x.yer)}</td><td>${esc(M.alt ? M.alt(x) : "")}</td></tr>`).join("")}</table><script>print()<\/script></body></html>`); w.document.close(); }
});
</script>

</body></html>
